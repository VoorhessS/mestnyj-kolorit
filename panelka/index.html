<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Панелька до неба</title>
<meta name="theme-color" content="#4aa3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face { font-family: 'Rubik'; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
@font-face { font-family: 'Rubik'; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
html,body{margin:0;height:100%;background:#4aa3f0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%,rgba(20,32,70,.35),rgba(10,16,40,.72))}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff;padding:26px 20px 22px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hide{display:none!important}
h1{margin:0;font-size:42px;font-weight:900;line-height:.98;letter-spacing:.5px;background:linear-gradient(180deg,#fff7c2,#ffc23a 60%,#ff9a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(90,40,0,.55))}
h2{margin:0;font-size:30px;font-weight:900;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:#ff6b3d;color:#fff;box-shadow:0 3px 0 #b8401c}
.btn{font:inherit;font-size:22px;font-weight:900;border:0;border-radius:18px;padding:15px 34px;background:linear-gradient(180deg,#ffe066,#ffb31f);color:#4a2c00;box-shadow:0 6px 0 #b9700a,0 10px 20px rgba(0,0,0,.25);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9700a}
.btn.sec{background:linear-gradient(180deg,#fff,#dfe9f3);color:#1f3550;box-shadow:0 5px 0 #8ea3b8;font-size:17px;padding:10px 24px}
.sub{opacity:.95;font-size:16px;line-height:1.38}
.small{font-size:13px;opacity:.8}
.stars{display:flex;gap:6px;justify-content:center;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
#hud .pill svg{display:block}
#hLives{gap:1px}
#hLives svg{width:18px;height:15px}
#hud .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:17px;padding:6px 12px;border-radius:99px;background:rgba(14,24,52,.45);border:1px solid rgba(255,255,255,.2);text-shadow:0 1px 0 rgba(0,0,0,.4)}
#bMenu{pointer-events:auto;font:inherit;font-weight:900;font-size:16px;border:0;border-radius:12px;padding:7px 11px;background:rgba(255,255,255,.88);color:#1f3550;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#tbar{margin:8px auto 0;max-width:360px;height:12px;border-radius:99px;background:rgba(14,24,52,.45);border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative}
#tfill{height:100%;width:100%;background:linear-gradient(90deg,#5be38a,#ffd23f);border-radius:99px}
#ttxt{position:absolute;inset:0;font-size:10px;font-weight:900;color:#fff;text-align:center;line-height:12px;text-shadow:0 1px 0 #0008}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:min(330px,88vw);padding:8px 12px 8px 8px;border-radius:18px;background:rgba(255,255,255,.95);color:#1f3550;box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:none}
#toast canvas{width:56px;height:56px;flex:none}
#toast .tx{font-size:14px;line-height:1.25}
#toast b{font-size:15px}
#toast.show{animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.card.wide{max-width:400px;max-height:88vh;overflow:auto}
#cGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rc{background:rgba(255,255,255,.12);border-radius:14px;padding:6px 4px 8px;font-size:11px;line-height:1.2}
.rc canvas{width:64px;height:64px;display:block;margin:0 auto 4px}
.rc b{display:block;font-size:12px}
.rc .say{opacity:.85;margin-top:3px}
.rc.lock{opacity:.6}
.list{display:flex;flex-direction:column;gap:8px;width:100%}
.it{display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;font:inherit;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.12);cursor:pointer}
.it:active{transform:translateY(2px)}
.it.lock{opacity:.45;cursor:default}
.it.cur{border-color:#ffd23f;box-shadow:0 0 0 2px rgba(255,210,63,.45)}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-size:16px}
.it .nm span{font-size:12px;opacity:.85}
.it .st{display:flex;gap:1px;flex:none}
.bar{height:7px;border-radius:9px;background:rgba(0,0,0,.25);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5be38a,#ffd23f)}
.pc{font-weight:900;font-size:15px;flex:none;width:44px;text-align:right}
.tk{display:flex;align-items:center;gap:10px;text-align:left;width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.12)}
.tk.ok{border-color:#5be38a}
.tk .nm{flex:1}
.tk .nm b{display:block;font-size:15px}
.tk .nm span{font-size:12px;opacity:.85}
.claim{font:inherit;font-weight:900;font-size:14px;border:0;border-radius:12px;padding:8px 12px;background:linear-gradient(180deg,#ffe066,#ffb31f);color:#4a2c00;box-shadow:0 3px 0 #b9700a;flex:none}
.claim[disabled]{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:99px;background:#ff5a5a;color:#fff;font-size:13px;line-height:18px}
#ver{position:fixed;bottom:6px;right:8px;font-size:11px;opacity:.55;color:#fff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div class="row"><span class="pill" id="hFloors"></span><span class="pill" id="hLives"></span><span class="row"><span class="pill" id="hPeople"></span><button id="bMenu" aria-label="Меню"><svg viewBox="0 0 16 14" width="16" height="14" style="display:block"><rect y="1" width="16" height="2.6" rx="1.3" fill="#1f3550"/><rect y="5.7" width="16" height="2.6" rx="1.3" fill="#1f3550"/><rect y="10.4" width="16" height="2.6" rx="1.3" fill="#1f3550"/></svg></button></span></div>
  <div id="tbar" class="hide"><div id="tfill"></div><div id="ttxt"></div></div>
</div>

<div id="menu" class="ov"><div class="card">
  <h1>Панелька<br>до неба</h1>
  <div class="sub">Кран качает этаж. <b>Тапни</b> — и он упадёт.<br>Ставь ровно — будет «Идеально!» и больше жильцов.</div>
  <button class="btn" id="bPlay">▶ Играть</button>
  <div class="sub small" id="mInfo"></div>
  <button class="btn sec hide" id="bCont">Продолжить</button>
  <button class="btn sec" id="bTasks">Задания</button>
  <button class="btn sec" id="bDist">Районы</button>
  <button class="btn sec" id="bColl">Жильцы</button>
</div><div id="ver">версия 0.6.1</div></div>

<div id="intro" class="ov hide"><div class="card">
  <span class="tag">Особая стройка</span>
  <h2 id="iT"></h2>
  <div class="sub" id="iS"></div>
  <button class="btn" id="iGo">Поехали!</button>
</div></div>

<div id="end" class="ov hide"><div class="card">
  <h2 id="eT"></h2>
  <div class="stars" id="eStars"></div>
  <div class="sub" id="eS"></div>
  <button class="btn" id="eNext"></button>
  <button class="btn sec" id="eAgain">↻ Заново</button>
  <button class="btn sec" id="eMenu">Меню</button>
</div></div>

<div id="toast" class="hide"><canvas id="tC" width="96" height="96"></canvas><div class="tx"><b id="tN"></b><div id="tS"></div></div></div>

<div id="tasks" class="ov hide"><div class="card wide">
  <h2>Задания на сегодня</h2>
  <div class="sub small" id="tkInfo"></div>
  <div id="tkList" class="list"></div>
  <button class="btn sec" id="tkBack">Назад</button>
</div></div>

<div id="dist" class="ov hide"><div class="card wide">
  <h2 id="dT">Районы</h2>
  <div class="sub small" id="dInfo"></div>
  <div id="dList" class="list"></div>
  <button class="btn sec" id="dBack">Назад</button>
</div></div>

<div id="coll" class="ov hide"><div class="card wide">
  <h2>Жильцы</h2>
  <div class="sub small" id="cInfo"></div>
  <div id="cGrid"></div>
  <button class="btn sec" id="cClose">Назад</button>
</div></div>

<script>
'use strict';
// ═════════ Настройки ═════════
const FW = 150, FH = 56, G = 1500, L = 170, D = 11, PERF = 8; // этаж; гравитация; трос; глубина; «идеально», px
const SAVE = 'panelka-v1';
const HOUSES = [ // стены и полоска у каждого дома
  ['#e6dfcf', '#d4553a'], ['#d6e0e8', '#2f80c4'], ['#ebdfc6', '#33a35f'], ['#e0d8e6', '#8a52c0'],
  ['#dde3d2', '#e8902a'], ['#ead7cd', '#c23c64'], ['#d5dde9', '#e9b61e'], ['#dedede', '#22a89c'],
];
const SPECIALS = ['widths', '', 'timer', '', 'precise', ''];
const SPINFO = {
  widths: ['Разные этажи', 'Этажи бывают узкие и широкие. На узкий трудно попасть, широкий держит лучше.'],
  timer: ['На время', 'Дом надо сдать до срока! Не тяни — таймер вверху.'],
  precise: ['Только ровно', 'Криво поставил — тоже минус каска. Целься в центр!'],
};
function level(i) {
  const sp = i >= 2 ? SPECIALS[(i - 2) % 6] : '';
  let goal = Math.min(8 + i * 2, 40);
  if (sp === 'precise') goal = Math.min(goal, 10);
  if (sp === 'timer') goal = Math.min(goal, 16);
  return {
    goal, sp,
    amp: Math.min(.38 + i * .045, .95),               // размах качания, рад
    per: Math.max(2.5 - i * .06, 1.55),               // период качания, с
    wind: i >= 3 ? Math.min(.25 + (i - 3) * .08, 1) : 0, // ветер раскачивает дом
    drift: i >= 5 ? Math.min(30 + (i - 5) * 8, 80) : 0,  // тележка крана ездит
    time: sp === 'timer' ? Math.round(goal * 3.4 + 4) : 0,
  };
}


const ICON = {
  helmet: (on = true) => `<svg viewBox="0 0 24 20" width="22" height="18"><path d="M3 15 Q3 4 12 4 Q21 4 21 15 Z" fill="${on ? '#ffc21f' : 'rgba(255,255,255,.18)'}" stroke="${on ? '#b07800' : 'rgba(255,255,255,.4)'}" stroke-width="1.4"/><rect x="1" y="14" width="22" height="3.5" rx="1.5" fill="${on ? '#f0a800' : 'rgba(255,255,255,.18)'}"/><rect x="10.5" y="4" width="3" height="10" fill="${on ? '#ffe07a' : 'none'}"/></svg>`,
  people: () => `<svg viewBox="0 0 26 20" width="22" height="17"><circle cx="9" cy="6" r="4" fill="#d9f0ff"/><path d="M2 19 Q2 11 9 11 Q16 11 16 19 Z" fill="#d9f0ff"/><circle cx="18.5" cy="7" r="3.3" fill="#9fcff0"/><path d="M14 19 Q14 12 18.5 12 Q24 12 24 19 Z" fill="#9fcff0"/></svg>`,
  floors: () => `<svg viewBox="0 0 20 22" width="17" height="19"><rect x="3" y="2" width="14" height="19" rx="1.5" fill="#e6dfcf"/><rect x="3" y="17" width="14" height="4" fill="#d4553a"/>${[4, 9, 14].map(y => `<rect x="5.5" y="${y}" width="3.5" height="3" fill="#7fb3e3"/><rect x="11" y="${y}" width="3.5" height="3" fill="#ffd36b"/>`).join('')}</svg>`,
  star: on => `<svg viewBox="0 0 24 24" width="46" height="46"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9z" fill="${on ? '#ffd23f' : 'rgba(255,255,255,.15)'}" stroke="${on ? '#c98a00' : 'rgba(255,255,255,.55)'}" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  clock: () => `<svg viewBox="0 0 12 12" width="9" height="9" style="vertical-align:-1px"><circle cx="6" cy="6" r="5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M6 3v3l2 1.2" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>`,
};


// ═════════ Районы ═════════
const DIST = [
  { name: 'Спальный район', kind: 'bed' }, { name: 'Набережная', kind: 'river' },
  { name: 'Промзона', kind: 'factory' }, { name: 'Центр', kind: 'center' },
];
const distOf = i => Math.floor(i / 5);
const distInfo = i => { const d = distOf(i), D2 = DIST[d % DIST.length]; return { d, kind: D2.kind, name: D2.name + (d >= DIST.length ? ' ' + (Math.floor(d / DIST.length) + 1) : ''), house: i % 5 + 1 }; };

// ═════════ Жильцы ═════════
const RES = [
  { id: 'rocker', name: 'Рокер Вася', say: 'Соседи, сегодня репетиция!', d: 0, skin: '#f0c39a', shirt: '#2b2b2b' },
  { id: 'jock', name: 'Качок Гена', say: 'Лифт? Я по лестнице. С холодильником.', d: 0, skin: '#e9b48a', shirt: '#e0453a' },
  { id: 'student', name: 'Студент Петя', say: 'А вайфай тут общий?', d: 0, skin: '#f3cba4', shirt: '#3fa35a' },
  { id: 'chef', name: 'Повар Арам', say: 'Чую, на третьем жарят котлеты!', d: 0, skin: '#e2a982', shirt: '#f7f7f2' },
  { id: 'dj', name: 'Диджей Макс', say: 'Бас пробьёт до первого этажа!', d: 1, skin: '#c98d62', shirt: '#7b4fc9' },
  { id: 'blogger', name: 'Блогерша Лиза', say: 'Подписывайтесь на наш подъезд!', d: 1, skin: '#f5cfb0', shirt: '#ff7aa8' },
  { id: 'plumber', name: 'Сантехник Толя', say: 'Где течёт? Уже бегу!', d: 1, skin: '#eab792', shirt: '#2f6db5' },
  { id: 'gardener', name: 'Дачник Михалыч', say: 'Рассада поедет на балкон.', d: 2, skin: '#e8b08a', shirt: '#5c9e4a' },
  { id: 'artist', name: 'Художник Жорж', say: 'Можно я покрашу лифт?', d: 2, skin: '#f2c8a2', shirt: '#ffffff' },
  { id: 'catman', name: 'Кошатник Игорь', say: 'Со мной всего восемь котов.', d: 2, skin: '#eebd96', shirt: '#8a6a4a' },
  { id: 'astro', name: 'Космонавт Юра', say: 'А этаж повыше есть?', d: 3, skin: '#f0c39a', shirt: '#eef2f6' },
  { id: 'ninja', name: 'Ниндзя Кэндзи', say: 'Я по стене. Лифт не нужен.', d: 3, skin: '#e9b48a', shirt: '#1f1f26' },
];
const RESD = Object.fromEntries(RES.map(r => [r.id, r]));
function paintResident(g, id, x, y, sc = 1) {
  const R = RESD[id]; if (!R) return;
  g.save(); g.translate(x, y); g.scale(sc, sc);
  const big = id === 'jock' ? 4 : 0;
  // плечи
  g.fillStyle = R.shirt; g.beginPath(); g.moveTo(-17 - big, 0); g.quadraticCurveTo(-17 - big, -16, -6, -17); g.lineTo(6, -17); g.quadraticCurveTo(17 + big, -16, 17 + big, 0); g.fill();
  if (id === 'artist') { g.fillStyle = '#1f3550'; for (let yy = -14; yy < 0; yy += 4) g.fillRect(-17, yy, 34, 2); }
  if (id === 'plumber') { g.fillStyle = '#1f4f8a'; g.fillRect(-9, -15, 4, 15); g.fillRect(5, -15, 4, 15); }
  if (id === 'chef') { g.fillStyle = '#c9c9c0'; for (const yy of [-11, -5]) { g.beginPath(); g.arc(-3, yy, 1.2, 0, 7); g.arc(3, yy, 1.2, 0, 7); g.fill(); } }
  if (id === 'rocker') { g.fillStyle = '#ffd23f'; g.beginPath(); g.moveTo(1, -14); g.lineTo(-3, -7); g.lineTo(0, -7); g.lineTo(-2, -1); g.lineTo(4, -9); g.lineTo(1, -9); g.fill(); }
  if (id === 'student') { g.strokeStyle = '#2a7a40'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-3, -16); g.lineTo(-4, -9); g.moveTo(3, -16); g.lineTo(4, -9); g.stroke(); }
  if (id === 'gardener') { g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; g.beginPath(); for (let xx = -14; xx < 16; xx += 5) { g.moveTo(xx, -16); g.lineTo(xx, 0); } for (let yy = -13; yy < 0; yy += 5) { g.moveTo(-17, yy); g.lineTo(17, yy); } g.stroke(); }
  if (id === 'astro') { g.fillStyle = '#e04646'; g.fillRect(-12, -12, 6, 4); g.fillStyle = '#3d7fd6'; g.fillRect(6, -12, 6, 4); }
  // шея и голова
  g.fillStyle = R.skin; g.fillRect(-3.5, -21, 7, 5);
  g.beginPath(); g.ellipse(0, -29, 9, 10, 0, 0, 7); g.fill();
  // волосы и головные уборы (до лица)
  const hair = (c, f) => { g.fillStyle = c; g.beginPath(); f(); g.fill(); };
  if (id === 'rocker') hair('#1b1b1b', () => { g.moveTo(-10, -12); g.quadraticCurveTo(-12, -40, 0, -40); g.quadraticCurveTo(12, -40, 10, -12); g.lineTo(7, -14); g.lineTo(7, -31); g.quadraticCurveTo(0, -35, -7, -31); g.lineTo(-7, -14); g.closePath(); });
  if (id === 'jock') hair('#5a3a22', () => { g.ellipse(0, -36, 8.5, 3.5, 0, Math.PI, 0); });
  if (id === 'student') hair('#7a4a26', () => { for (let a = -2.6; a <= -.4; a += .45) g.arc(Math.cos(a) * 8, -31 + Math.sin(a) * 8, 4, 0, 7); });
  if (id === 'dj' || id === 'catman') hair(id === 'dj' ? '#1b1b1b' : '#6b4a2a', () => { g.ellipse(0, -35, 9, 5, 0, Math.PI, 0); });
  if (id === 'blogger') { hair('#f2d16b', () => { g.ellipse(0, -33, 9.5, 6.5, 0, Math.PI, 0); }); hair('#f2d16b', () => { g.arc(0, -42, 4.5, 0, 7); }); hair('#f2d16b', () => { g.ellipse(-8, -27, 2.5, 6, 0, 0, 7); g.ellipse(8, -27, 2.5, 6, 0, 0, 7); }); }
  if (id === 'artist' || id === 'gardener' || id === 'plumber' || id === 'chef') hair('#3a2a1a', () => { g.ellipse(0, -35, 8.5, 4, 0, Math.PI, 0); });
  // лицо
  if (id !== 'ninja') {
    g.fillStyle = '#1d1d1d'; g.beginPath(); g.arc(-3.2, -30, 1.2, 0, 7); g.arc(3.2, -30, 1.2, 0, 7); g.fill();
    g.strokeStyle = '#7a3b2e'; g.lineWidth = 1.2; g.beginPath(); g.arc(0, -26.5, 3, .25, Math.PI - .25); g.stroke();
    g.fillStyle = 'rgba(255,120,120,.35)'; g.beginPath(); g.arc(-6, -26.5, 1.8, 0, 7); g.arc(6, -26.5, 1.8, 0, 7); g.fill();
  }
  // аксессуары

const topY = () => st.floors.length * FH;

    const sup = j ? F[j - 1] : { off: 0, w: FW + 44 }, half = sup.w / 2, d = mx / m - sup.off;

const SHEETS = [['#ffffff', '#ff7a8a'], ['#fff6d6', '#4aa3f0'], ['#e8f6ff', '#5be38a'], ['#ffffff', '#ffb347'], ['#f3e8ff', '#b48be0']];

  for (const j of st.jumpers) {

// погода на стройке случайная: 0 — ясно, 1 — снег (убирают дворники), 2 — метель (убирает техника)
const SNOW_COLS = 48;
function makeSnow() {
  const q = new URLSearchParams(location.search).get('snow'), r = Math.random();
  const lvl = q != null ? +q : r < .45 ? 0 : r < .78 ? 1 : 2;
  const n = [0, 80, 240][lvl], flakes = [];
  for (let i = 0; i < n; i++) flakes.push({ x: Math.random() * 1.2 - .1, y: Math.random(), r: .8 + Math.random() * (lvl === 2 ? 2.4 : 1.8), v: .06 + Math.random() * .08, ph: Math.random() * 6, z: Math.random() });
  return { lvl, flakes, cols: new Array(SNOW_COLS).fill(0), cap: 0, cleaner: null, wait: 3 + Math.random() * 3 };
}
function snowTick(dt) { // снежинки летят и в меню
  const sn = st && st.snow; if (!sn || !sn.lvl) return;

    f.y += f.v * (.6 + f.z) * dt * (sn.lvl === 2 ? 1.6 : 1); f.x += (gust * (.5 + f.z) + Math.sin(f.y * 9 + f.ph) * .01) * dt * 3;

function physics() {
  const s = st, n = s.floors.length, S2 = s.stab;

  const K = 3.85 * Math.max(.45, 1 - weak * .9), C = .8 - Math.min(1.15, weak * 1.5);
  const wind = CFG.wind * Math.min(1, n / 8) * 26 * Math.sin(s.t * 1.96);
  s.v += (-K * s.x - C * s.v + wind + lean * 32) * DT; s.x = clamp(s.x + s.v * DT, -140, 140);
  s.sway = s.x;

    if (s.creak <= 0 && Math.abs(s.x) > 6) { s.creak = 1.1; tone(85 + Math.random() * 20, .3, 'sawtooth', .035, 25); }
  }
  // раскачка тянет шаткий этаж за край — копим напряжение
  for (let j = 0; j < S2.length; j++) {
    if (S2[j].s >= SHAKY) { s.floors[j].strain = 0; continue; }
    const eff = S2[j].s - Math.max(0, s.x * S2[j].dir) / 50, f = s.floors[j];
    f.strain = eff < TIP ? (f.strain || 0) + DT : Math.max(0, (f.strain || 0) - DT * .5);

  }

function topW() { return st.floors.length ? st.floors[st.floors.length - 1].w : FW + 44; }

  const w = 2 * Math.PI / CFG.per, a = CFG.amp * Math.sin(w * st.t + st.phase), da = CFG.amp * w * Math.cos(w * st.t + st.phase);
  const p = pivot(), enter = Math.max(0, 1 - st.enter) * 160;
  return { x: p.x + L * Math.sin(a), y: p.y - L * Math.cos(a) + enter, vx: L * Math.cos(a) * da, vy: L * Math.sin(a) * da, a };
}

const DT = 1 / 120;

}
function drawMast() {
  const py = sy(pivot().y), g0 = Math.min(H + 10, sy(0)), x = MX;
  ctx.strokeStyle = '#d99a0b'; ctx.lineWidth = 2;
  ctx.fillStyle = '#f5b81c'; ctx.fillRect(x - 10, py, 3, g0 - py); ctx.fillRect(x + 7, py, 3, g0 - py);
  ctx.beginPath(); const s0 = py - ((py % 22) + 22); for (let y = s0; y < g0; y += 22) { if (y < py) continue; ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y + 11); ctx.lineTo(x - 8, y + 22); } ctx.stroke();
  // основание
  if (sy(0) < H + 10) { ctx.fillStyle = '#6b7178'; ctx.fillRect(x - 18, sy(0) - 8, 36, 12); }
}
function drawJib() {
  const p = pivot(), py = sy(p.y), x = MX;
  // голова башни и растяжки
  ctx.strokeStyle = '#3b3f45'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, py - 52); ctx.lineTo(-10, py - 16); ctx.moveTo(x, py - 52); ctx.lineTo(W + 10, py - 16); ctx.stroke();
  ctx.fillStyle = '#f5b81c'; ctx.beginPath(); ctx.moveTo(x - 9, py - 16); ctx.lineTo(x, py - 54); ctx.lineTo(x + 9, py - 16); ctx.fill();
  // стрела-ферма
  ctx.fillStyle = '#f5b81c'; ctx.fillRect(-10, py - 18, W + 20, 3); ctx.fillRect(-10, py - 5, W + 20, 3);
  ctx.strokeStyle = '#d99a0b'; ctx.lineWidth = 1.6; ctx.beginPath(); for (let xx = -10; xx < W + 10; xx += 14) { ctx.moveTo(xx, py - 16); ctx.lineTo(xx + 7, py - 4); ctx.lineTo(xx + 14, py - 16); } ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(-10, py - 2, W + 20, 2);
  // противовес
  ctx.fillStyle = '#9aa1a8'; ctx.fillRect(x + 14, py - 2, 22, 14); ctx.fillStyle = '#7b828a'; ctx.fillRect(x + 14, py + 8, 22, 4);
  // кабина
  ctx.fillStyle = '#f5b81c'; ctx.fillRect(x - 30, py - 2, 22, 20); ctx.fillStyle = '#9fd4ff'; ctx.fillRect(x - 28, py + 1, 12, 10); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x - 27, py + 2, 4, 8);
  // тележка
  ctx.fillStyle = '#3b3f45'; ctx.fillRect(p.x - 13, py - 6, 26, 8); ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(p.x - 8, py - 6, 3, 0, 7); ctx.arc(p.x + 8, py - 6, 3, 0, 7); ctx.fill();
  return { x: p.x, y: py + 2 };
}
function hookBlock(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = '#f5b81c'; ctx.fillRect(-8, -8, 16, 11); ctx.fillStyle = '#222'; ctx.fillRect(-8, -3, 16, 3);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 8, 4, -Math.PI / 2, Math.PI * .9); ctx.stroke();
  ctx.restore();
}
function drawHeld(tr) {
  const s = st;
  if (s.hold) {
    const h = hook(), cx = h.x, cy = sy(h.y), a = -h.a, f = s.hold, hk = FH / 2 + 26;
    const top = { x: cx + Math.sin(a) * hk, y: cy - Math.cos(a) * hk };
    ctx.strokeStyle = '#2b2f35'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(tr.x - 2, tr.y); ctx.lineTo(top.x - 2, top.y); ctx.moveTo(tr.x + 2, tr.y); ctx.lineTo(top.x + 2, top.y); ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(0, -hk + 10); ctx.lineTo(-f.w / 2 + 8, -FH / 2); ctx.moveTo(0, -hk + 10); ctx.lineTo(f.w / 2 - 8, -FH / 2); ctx.stroke();
    ctx.restore();
    drawFloor(f, cx, cy, a, true);
    hookBlock(top.x, top.y, a);
    if (mode === 'play' && !s.floors.length && !s.drop && save.lvl === 0) {
      ctx.font = '800 17px Rubik, system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.4)';
      ctx.strokeText('Тапни, когда этаж над домом!', CX, sy(topY()) - 28); ctx.fillStyle = '#fff'; ctx.fillText('Тапни, когда этаж над домом!', CX, sy(topY()) - 28);
    }
  } else {
    ctx.strokeStyle = '#2b2f35'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(tr.x - 2, tr.y); ctx.lineTo(tr.x - 2, tr.y + 54); ctx.moveTo(tr.x + 2, tr.y); ctx.lineTo(tr.x + 2, tr.y + 54); ctx.stroke();
    hookBlock(tr.x, tr.y + 58, 0);
  }
}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (!st) { LVL = save.lvl; CFG = level(LVL); newGame(); }
  const s = st, sh = s.shake > 0 ? s.shake * 8 : 0;
  drawSky();
  ctx.save(); if (sh) ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  drawGround();
  drawDistrictLayer();
  drawMast();
  drawSite();
  drawSnowGround();
  drawCleaner();
  const n = s.floors.length;
  for (let i = 0; i < n; i++) { const y = sy(i * FH + FH / 2); if (y < -FH * 2 || y > H + FH) continue; drawFloor(s.floors[i], floorX(i), y, floorRot(i), i === n - 1 && !s.roof); }
  drawSnowCaps();
  if (s.roof) drawRoof(topX(), sy(s.roof.y), topW());
  for (const r of s.rings) { const k = r.t / .6; ctx.strokeStyle = `rgba(255,225,74,${1 - k})`; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.ellipse(r.x, sy(r.y), r.w / 2 + k * 60, 8 + k * 20, 0, 0, 7); ctx.stroke(); }
  if (s.drop) drawFloor(s.drop.f, s.drop.x, sy(s.drop.y), -s.drop.rot, true);
  for (const b of s.debris) drawFloor(b.f, b.x, sy(b.y), b.rot, true);
  drawJumpers();
  for (const p of s.parts) {
    const a = 1 - p.t / p.life;
    if (p.k === 'conf') { ctx.save(); ctx.translate(p.x, sy(p.y)); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.c; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); ctx.globalAlpha = 1; }
    else if (p.k === 'snow') { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(p.x, sy(p.y), 2 + p.t * 3, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = `rgba(214,200,176,${a * .8})`; ctx.beginPath(); ctx.arc(p.x, sy(p.y), 4 + p.t * 12, 0, 7); ctx.fill(); }
  }
  const tr = drawJib();
  if (!s.done) drawHeld(tr);
  ctx.restore();
  drawSnowfall();
  ctx.textAlign = 'center';
  for (const t of s.texts) {
    const a = Math.min(1, 2.6 - t.t * 2), y = sy(t.y) - t.t * 40, pop = t.t < .12 ? .7 + t.t / .12 * .3 : 1;
    ctx.globalAlpha = Math.max(0, a); ctx.font = `900 ${Math.round(23 * t.big * pop)}px Rubik, system-ui`; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(30,20,0,.55)';
    const tw = t.icon ? ctx.measureText(t.txt).width : 0, sz = 23 * t.big * pop, tx = t.icon ? t.x - sz * .55 : t.x;
    ctx.strokeText(t.txt, tx, y); ctx.fillStyle = t.col; ctx.fillText(t.txt, tx, y);
    if (t.icon === 'helmet') helmetIcon(ctx, tx + tw / 2 + sz * .6, y - sz * .3, sz / 22);
    else if (t.icon === 'people') peopleIcon(ctx, tx + tw / 2 + sz * .6, y - sz * .3, sz / 18);
    ctx.globalAlpha = 1;
  }
  hudTime();
}

// ═════════ Цикл ═════════
let last = performance.now(), acc = 0, running = true;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (running && st && mode === 'play') { acc += dt; while (acc >= DT) { step(); acc -= DT; if (mode !== 'play') break; } }
  else if (st) { acc = 0; if (mode !== 'end') st.t += dt; }
  snowTick(dt);
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize); resize();
showMenu();
if (document.fonts) document.fonts.load('900 20px Rubik').then(() => { for (const f of st ? st.floors : []) f.img = null; district = null; }).catch(() => {});
requestAnimationFrame(frame);

// для автотестов
window.__p = { get st() { return st; }, get mode() { return mode; }, get cfg() { return CFG; }, hook, topX, topY, tap, step, play, go: () => $('iGo').click(), setRunning: v => { running = v; }, get save() { return save; } };
</script>
