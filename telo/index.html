<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6b4f35">
<title>Бумажное тело — книжка-раскладушка</title>
<style>
@font-face { font-family: 'Rubik'; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
@font-face { font-family: 'Rubik'; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
html,body{margin:0;height:100%;background:#6b4f35;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3b2616}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.hide{display:none!important}
:root{--ink:#4a2e1c;--paper:#fff8ea;--sh:rgba(140,80,30,.38)}
.paper{background-color:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");border:2px solid var(--ink);border-radius:7px;box-shadow:3px 4px 0 var(--sh)}
#page,#game,#res{position:fixed;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box;pointer-events:none}
#page{bottom:calc(env(safe-area-inset-bottom) + 14px);max-height:60%;}
#page > *,#res > *,#game > *{pointer-events:auto}
#pScroll{width:100%;max-width:440px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px 6px 8px;box-sizing:border-box;touch-action:pan-y}
.banner{font-weight:900;font-size:24px;padding:6px 18px;background:#ffd36b;transform:rotate(-1.5deg)}
.fact{font-size:15.5px;line-height:1.36;padding:9px 12px;text-align:left;transform-origin:50% 100%;animation:pop .75s cubic-bezier(.3,1.55,.5,1) both}
.fact b{color:#a3341f}
.fact:nth-child(2n){transform:rotate(.6deg)}
.fact:nth-child(2n+1){transform:rotate(-.5deg)}
@keyframes pop{0%{transform:perspective(600px) rotateX(-92deg)}100%{transform:perspective(600px) rotateX(0)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:18px;color:var(--ink);padding:11px 20px;background:#ffd36b;cursor:pointer;transition:transform .08s}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--sh)}
.btn.sec{background:#fff8ea;font-size:16px}
.btn.big{font-size:21px;padding:13px 26px}
#game{top:calc(env(safe-area-inset-top) + 10px)}
#gTop{display:flex;align-items:center;gap:8px;width:100%;max-width:440px}
#gTitle{flex:1;font-weight:900;font-size:17px;padding:6px 12px;background:#fff8ea}
#gScore{font-weight:900;font-size:17px;padding:6px 12px;background:#ffd36b;min-width:44px;text-align:center}
#gX{font:inherit;font-weight:900;font-size:16px;padding:6px 12px;background:#fff8ea;color:var(--ink)}
#gHint{font-size:15px;font-weight:700;padding:6px 12px;max-width:400px;text-align:center;line-height:1.3}
#res{top:0;bottom:0;justify-content:center;background:rgba(60,40,20,.45);z-index:5}
#rCard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 22px;max-width:360px;text-align:center;animation:pop .7s cubic-bezier(.3,1.55,.5,1) both}
#rT{font-weight:900;font-size:28px}
#rS{font-size:16px;line-height:1.4}
#rStars svg{margin:0 3px}
#bVoice{position:fixed;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 22px);font-size:14px;padding:8px 12px;z-index:2}
#bToc{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 14px);font-size:14px;padding:8px 12px}
.say{cursor:pointer;position:relative}
.say::after{content:'';position:absolute;right:6px;top:6px;width:16px;height:16px;opacity:.55;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 6h3l4-3v10l-4-3H2z' fill='%234a2e1c'/><path d='M11 5.5q1.6 2.5 0 5M12.8 3.8q3 4.2 0 8.4' stroke='%234a2e1c' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>") no-repeat center/contain}
.fact.say{padding-right:26px}
#gHint.say{padding-right:28px}
.speaking{outline:3px solid #ffb31f;outline-offset:2px}
#quiz{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);box-sizing:border-box;overflow:auto;touch-action:pan-y}
#qTop{display:flex;gap:8px;width:100%;max-width:440px;align-items:center}
#qTitle{flex:1;font-weight:900;font-size:16px;padding:6px 12px;background:#fff8ea}
#qNum{font-weight:900;font-size:15px;padding:6px 12px;background:#ffd36b}
#qQ{width:100%;max-width:440px;box-sizing:border-box;font-weight:900;font-size:20px;line-height:1.3;padding:14px 30px 14px 14px;background:#fff8ea;animation:pop .6s cubic-bezier(.3,1.55,.5,1) both}
#qOpts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:440px}
.opt{font:inherit;font-weight:800;font-size:17px;text-align:left;color:var(--ink);padding:12px 30px 12px 14px;background:#fff8ea;animation:pop .6s cubic-bezier(.3,1.55,.5,1) both}
.opt.sel{background:#ffe7a3;transform:translate(-1px,-1px)}
.opt.good{background:#c9efc2}
.opt.bad{background:#f7c2b8}
#qWhy{width:100%;max-width:440px;box-sizing:border-box;font-size:16px;line-height:1.35;padding:10px 30px 10px 14px;background:#fff8ea}
#qWhy b{font-size:18px}
#bToc,#ver{z-index:2}
#ver{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 4px);font-size:11px;color:#fff8ea;opacity:.55;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="page" class="hide">
  <div class="banner paper say" id="pT"></div>
  <div id="pScroll"></div>
  <div class="row"><button class="btn big paper" id="pPlay"></button><button class="btn sec paper" id="pBack">К телу</button></div>
</div>

<div id="game" class="hide">
  <div id="gTop"><button class="paper" id="gX">←</button><div class="paper" id="gTitle"></div><div class="paper" id="gScore"></div></div>
  <div class="paper say" id="gHint"></div>
</div>

<div id="res" class="hide"><div class="paper" id="rCard">
  <div id="rT"></div><div id="rStars"></div><div id="rS"></div>
  <button class="btn big paper hide" id="rQuiz">Пройти тест</button>
  <div class="row"><button class="btn paper" id="rAgain">Ещё раз</button><button class="btn sec paper" id="rBack">К странице</button></div>
</div></div>
<div id="quiz" class="hide">
  <div id="qTop"><button class="paper" id="qX" style="font:inherit;font-weight:900;font-size:16px;padding:6px 12px;background:#fff8ea;color:#4a2e1c">←</button><div class="paper" id="qTitle"></div><div class="paper" id="qNum"></div></div>
  <div class="paper say" id="qQ"></div>
  <div id="qOpts"></div>
  <div class="paper say hide" id="qWhy"></div>
  <button class="btn big paper" id="qGo">Ответить</button>
</div>
<button class="btn sec paper hide" id="bVoice"></button>
<button class="btn sec paper hide" id="bToc">← Оглавление</button>
<div id="ver">пробник 0.1</div>

<script>
'use strict';
// ═════════ Основа ═════════
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
let W = 0, H = 0, DPR = 1, K = 1, VW = 400, VH = 760;
const INK = '#4a2e1c', SH = 'rgba(140,80,30,.38)', SKIN = '#f2c6a0', BONE = '#fbf3df';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, PI = Math.PI;
const SAVE = 'bumtelo-v1';
let save = { stars: {} }; try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {} save.stars = save.stars || {};
const store = () => { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) {} };
let cache = {};
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K = Math.min(W / 400, H / 700); VW = W / K; VH = H / K; cache = {};
}
addEventListener('resize', resize); resize();
// наскок «раскладушки»: поднимается на сгибе с перелётом ~10% и успокаивается к 1 с
const rise = t => { t = clamp(t, 0, 1); const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ═════════ Бумага: зерно, кусок картона, рваный край ═════════
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 128;
(() => { const g = grainC.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1400; i++) { const v = 200 + Math.random() * 55 | 0; g.fillStyle = `rgba(${v - 30},${v - 50},${v - 80},${Math.random() * .5})`; g.fillRect(Math.random() * 128, Math.random() * 128, 1, 1); }
  g.strokeStyle = 'rgba(150,110,70,.14)'; g.lineWidth = .6; for (let i = 0; i < 26; i++) { const x = Math.random() * 128, y = Math.random() * 128, a = Math.random() * 7; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6 + 3, x + Math.cos(a) * 12, y + Math.sin(a) * 12); g.stroke(); } })();
const GRAIN = ctx.createPattern(grainC, 'repeat');
// кусок картона: тень → контур → заливка → зерно → светлая кромка
function piece(g, path, col, o = {}) {
  g.save();
  if (o.shadow !== false) { g.shadowColor = o.shc || SH; g.shadowBlur = (o.blur ?? 4) * K * DPR; g.shadowOffsetX = (o.sx ?? 2.5) * K * DPR; g.shadowOffsetY = (o.sy ?? 3.5) * K * DPR; }
  g.beginPath(); path(g); g.fillStyle = col; g.fill(); g.restore();
  g.save(); g.beginPath(); path(g); g.strokeStyle = INK; g.lineWidth = (o.lw ?? 1.6) * 2; g.lineJoin = 'round'; g.stroke(); g.fillStyle = col; g.fill(); g.restore();
  g.save(); g.beginPath(); path(g); g.clip();
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = .55; g.fillStyle = GRAIN; g.fillRect(-900, -900, 1800, 1800);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  if (o.hl !== false) { g.translate(1.5, 1.5); g.beginPath(); path(g); g.strokeStyle = 'rgba(255,251,238,.6)'; g.lineWidth = 2.4; g.stroke(); }
  g.restore();
}
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function tornRect(g, x, y, w, h, seed, amp = 2.2) { // рваный край по периметру
  const r = rng(seed), pts = [], st = 7;
  for (let i = 0; i <= w; i += st) pts.push([x + i, y + (r() - .5) * amp]);
  for (let i = 0; i <= h; i += st) pts.push([x + w + (r() - .5) * amp, y + i]);
  for (let i = w; i >= 0; i -= st) pts.push([x + i, y + h + (r() - .5) * amp]);
  for (let i = h; i >= 0; i -= st) pts.push([x + (r() - .5) * amp, y + i]);
  g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.closePath();
}
const rr = (g, x, y, w, h, r) => { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
// готовая картинка (рисуется один раз под текущий размер экрана)
function cached(key, w, h, ox, oy, fn) {
  let c = cache[key];
  if (!c) { c = cache[key] = document.createElement('canvas'); const s = K * DPR; c.width = Math.ceil(w * s); c.height = Math.ceil(h * s); const g = c.getContext('2d'); g.setTransform(s, 0, 0, s, ox * s, oy * s); fn(g); }
  return c;
}
const blit = (c, x, y, w, h) => ctx.drawImage(c, x, y, w, h);
function text(g, s, x, y, size, col = INK, al = 'center', wt = 900, maxW = 0) { g.font = `${wt} ${size}px Rubik, system-ui, sans-serif`; if (maxW) { const m = g.measureText(s).width; if (m > maxW) { size *= maxW / m; g.font = `${wt} ${size}px Rubik, system-ui, sans-serif`; } } g.textAlign = al; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y); }
function starPath(g, x, y, r) { for (let i = 0; i < 10; i++) { const rad = i % 2 ? r * .45 : r, a = -PI / 2 + i * PI / 5; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } g.closePath(); }
const STAR_SVG = on => `<svg width="38" height="38" viewBox="-20 -20 40 40" xmlns="http://www.w3.org/2000/svg"><path d="${Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 7.6 : 17, a = -PI / 2 + i * PI / 5; return (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1); }).join('')}Z" fill="${on ? '#ffc93b' : '#e8dcc4'}" stroke="#4a2e1c" stroke-width="2" stroke-linejoin="round"/></svg>`;

// ═════════ Звук ═════════
let ac = null, bus = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = .7; bus.connect(ac.destination); } catch (e) {} } if (ac && ac.state !== 'running') ac.resume().catch(() => {}); }
function tone(f, d, type = 'triangle', v = .12, slide = 0, delay = 0) {
  if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(bus); o.start(t); o.stop(t + d + .02);
}
function swish(d = .35, v = .25, f0 = 1800) { // шелест страницы
  if (!ac) return; const t = ac.currentTime, n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), dd = b.getChannelData(0);
  for (let i = 0; i < n; i++) dd[i] = (Math.random() * 2 - 1) * Math.sin(PI * i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'bandpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f0 * .4, t + d); f.Q.value = .8; g.gain.value = v;
  s.buffer = b; s.connect(f).connect(g).connect(bus); s.start(t);
}
const sfx = {
  pop: () => { tone(420, .09, 'triangle', .1, 260); swish(.12, .12, 2600); },
  ok: () => { tone(660, .1); tone(990, .14, 'triangle', .1, 0, .07); },
  bad: () => tone(200, .25, 'square', .05, -80),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .1, 0, i * .1)),
  beat: () => { tone(70, .16, 'sine', .4, -25); tone(55, .14, 'sine', .3, -15, .14); },
};
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ═════════ Озвучка ═════════
const norm = t => t.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
const vhash = t => { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
// как читать вслух то, что на экране цифрами и стрелками
const SAY = {
  'За день оно бьётся около 100 000 раз и никогда не отдыхает.': 'За день оно бьётся около ста тысяч раз и никогда не отдыхает.',
  'Взрослый в покое делает 12–20 вдохов в минуту, а после бега — гораздо больше.': 'Взрослый в покое делает от двенадцати до двадцати вдохов в минуту, а после бега — гораздо больше.',
  'Мозг взрослого весит около 1,4 кг — как большой пакет сахара.': 'Мозг взрослого весит около килограмма и четырёхсот граммов — как большой пакет сахара.',
  'Еда идёт так: рот → пищевод → желудок → тонкая кишка → толстая кишка.': 'Еда идёт так: рот, потом пищевод, желудок, тонкая кишка и толстая кишка.',
  'Тонкая кишка у взрослого длиной около 6 метров — она сложена петлями.': 'Тонкая кишка у взрослого длиной около шести метров — она сложена петлями.',
  'У взрослого 206 костей.': 'У взрослого двести шесть костей.',
  'У младенца костей больше — около 300: часть из них потом срастается.': 'У младенца костей больше — около трёхсот. Часть из них потом срастается.',
  '1 000': 'Тысяча.', '10 000': 'Десять тысяч.', '100 000': 'Сто тысяч.', '1 000 000': 'Миллион.',
};
const sayText = k => SAY[k] || k.replace(/→/g, ',').replace(/[«»]/g, '');
const VOICES = [['kseniya', 'Ксения'], ['xenia', 'Ксюша'], ['baya', 'Бая'], ['aidar', 'Айдар'], ['eugene', 'Евгений']];
if (!VOICES.some(v => v[0] === save.voice)) save.voice = 'kseniya';
let voEl = null, voAudio = null;
function speak(textOrEl, el) {
  const t = norm(typeof textOrEl === 'string' ? textOrEl : textOrEl.innerHTML); el = el || (typeof textOrEl === 'string' ? null : textOrEl);
  if (voAudio) { voAudio.pause(); voAudio = null; } if (voEl) voEl.classList.remove('speaking'); try { speechSynthesis.cancel(); } catch (e) {}
  if (!t) return; voEl = el; if (el) el.classList.add('speaking');
  const done = () => { if (voEl === el && el) el.classList.remove('speaking'); };
  const a = new Audio('vo/' + save.voice + '/' + vhash(t) + '.mp3?v=3'); voAudio = a; a.onended = done;
  a.onerror = () => { if (voAudio !== a) return; try { const u = new SpeechSynthesisUtterance(sayText(t)); u.lang = 'ru-RU'; u.rate = .95; u.onend = done; speechSynthesis.speak(u); } catch (e) { done(); } };
  a.play().catch(() => {});
}
const hush = () => { if (voAudio) { voAudio.pause(); voAudio = null; } if (voEl) voEl.classList.remove('speaking'); try { speechSynthesis.cancel(); } catch (e) {} };
document.addEventListener('click', e => { const el = e.target.closest('.say'); if (el && !el.classList.contains('opt')) speak(el); });

// ═════════ Органы: формы (локальные координаты, размер «на теле») ═════════
const ORG = {
  brain: { name: 'Мозг', col: '#f4a7b9', game: 'Память' },
  lungs: { name: 'Лёгкие', col: '#f08a7e', game: 'Дыши в ритм' },
  heart: { name: 'Сердце', col: '#d8343f', game: 'Качай кровь' },
  stomach: { name: 'Желудок', col: '#f3a960', game: 'Путь бутерброда' },
  bones: { name: 'Скелет', col: BONE, game: 'Собери скелет' },
  muscles: { name: 'Мышцы', soon: true }, eye: { name: 'Глаз', soon: true }, ear: { name: 'Ухо', soon: true }, tongue: { name: 'Нос и язык', soon: true },
  skin: { name: 'Кожа', soon: true }, blood: { name: 'Кровь', soon: true }, germs: { name: 'Иммунитет', soon: true },
};
const CHAPTERS = [
  { id: 'inside', name: 'Внутри', sub: 'Органы, которые работают без остановки', pages: ['heart', 'lungs', 'stomach', 'brain'], tab: '#e2585b' },
  { id: 'move', name: 'Опора и движение', sub: 'Кости держат, мышцы двигают', pages: ['bones', 'muscles'], tab: '#f3d27a' },
  { id: 'senses', name: 'Органы чувств', sub: 'Как мы видим, слышим и чувствуем', pages: ['eye', 'ear', 'tongue', 'skin'], tab: '#8fc6e8' },
  { id: 'guard', name: 'Защита', sub: 'Кровь и борьба с микробами', pages: ['blood', 'germs'], tab: '#9ed39a' },
];
let chap = CHAPTERS[0];
