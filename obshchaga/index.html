function babble(text, v, out, delay = 0) {

function sndTalk(o) {               // окно диалога: сначала говорит «Ты», потом собеседник

  SND.bab.forEach(x => { try { x.stop(); } catch (e) {} }); SND.bab = [];

}
const WARDEN_MUTTER = ['ходют тут всякие', 'бу-бу-бу', 'отбой был в одиннадцать', 'где мои очки', 'опять курили в туалете', 'ох, молодёжь', 'кто тут топает', 'сериал пропустила'];

function sFlirt(good, bad, slap) {

const sSad = () => [392, 370, 349, 294].forEach((f, i) => tone({ f, f2: i === 3 ? 260 : 0, t: i * .38, d: i === 3 ? .9 : .36, type: 'sawtooth', g: .07, lp: 1100 }));

// ---- музыка: тихий ночной lo-fi, 4 аккорда по кругу ----
const MUS_CH = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 59], [55, 59, 62, 65]];   // Am7 Fmaj7 Cmaj7 G7
const MUS_SC = [69, 72, 74, 76, 79, 81];
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function musTick() {
  const ac = SND.ac; if (!ac || ac.state !== 'running' || !SND.on) { if (ac) SND.musNext = ac.currentTime + .1; return; }
  const st = 60 / 74 / 2;
  if (SND.musNext < ac.currentTime) SND.musNext = ac.currentTime + .05;
  while (SND.musNext < ac.currentTime + .4) { musStep(SND.musStep++, SND.musNext - ac.currentTime, st); SND.musNext += st; }
}
function musStep(i, t, st) {
  const ch = MUS_CH[Math.floor(i / 8) % 4], sb = i % 8, out = SND.musLp;
  if (sb === 0) for (const m of ch) for (const det of [-7, 7]) tone({ f: mtof(m), t, d: st * 8.4, type: 'triangle', g: .035, a: .5, hold: .7, det, out });
  if (sb === 0 || sb === 5) tone({ f: mtof(ch[0] - 24), t, d: st * 2.2, type: 'sine', g: .16, a: .02, out });
  if (sb % 2 === 1) noise({ t, d: .03, g: .03, hp: 7000, out });
  if (sb === 4) noise({ t, d: .09, g: .05, bp: 1500, q: .8, out });

}
// ---- каждый кадр: шаги, двери, вахтёрша, сирена ----
function sndTick(dt) {
