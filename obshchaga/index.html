<style>

  #act.on { display: flex; }
  #act:active { transform: scale(.94); }
  #joy { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid #ffffff40; background: #ffffff12;

  #pimg { width: 96px; height: 110px; border-radius: 12px; border: 2px solid #4a3d58; flex: none; overflow: hidden; }

  #dname { font-weight: 800; font-size: 18px; }
  #dsub { font-size: 12px; color: #b9aecb; margin-top: 2px; }

  #dtext { margin: 10px 0; min-height: 44px; white-space: pre-line; }

  #night.close #s0 { transform: translateX(-82%); } #night.close #s1 { transform: translateX(-18%) scaleX(-1); }
  #night .curt { position: absolute; inset: 0; animation: sway 3s ease-in-out infinite alternate;
    background: linear-gradient(#3a2018 0 12px, transparent 12px), repeating-linear-gradient(90deg, rgba(0,0,0,.30) 0 7px, rgba(255,230,200,.10) 7px 18px, rgba(0,0,0,.14) 18px 30px); }
  @keyframes sway { to { transform: translateX(5px); } }
  #nfx span { position: absolute; font-size: 26px; animation: rise 2.4s ease-out forwards; }
  @keyframes rise { to { transform: translateY(-180px) scale(1.4); opacity: 0; } }
  #ntext { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 96px); text-align: center; font-weight: 700; font-size: 16px;

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------- путь (BFS по клеткам) ----------------
const tileOf = e => ({ x: Math.floor(e.x / T), y: Math.floor(e.y / T) });
function bfs(s, t) {
  if (!walk(t.x, t.y) || !walk(s.x, s.y)) return [];
  const prev = new Int16Array(W * H).fill(-1), si = s.y * W + s.x, ti = t.y * W + t.x, q = [si]; prev[si] = si;
  for (let h = 0; h < q.length; h++) {
    const c = q[h]; if (c === ti) break;
    const cx = c % W, cy = (c / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, n = ny * W + nx;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || prev[n] !== -1 || !walk(nx, ny)) continue;
      prev[n] = c; q.push(n);
    }
  }
  if (prev[ti] === -1) return [];
  const p = []; for (let c = ti; c !== si; c = prev[c]) p.push({ x: (c % W) * T + 8, y: ((c / W) | 0) * T + 9 });
  return p.reverse();
}
function face(e, dx, dy) { if (Math.abs(dx) > Math.abs(dy)) e.dir = dx < 0 ? 2 : 3; else if (dy) e.dir = dy < 0 ? 1 : 0; }
function stepTo(e, p, sp, dt) {
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy), s = sp * dt;
  if (d <= s) { e.x = p.x; e.y = p.y; return true; }
  e.x += dx / d * s; e.y += dy / d * s; face(e, dx, dy); e.moving = true; return false;
}
function walkPath(e, sp, dt) { e.moving = false; if (e.path.length && stepTo(e, e.path[0], sp, dt)) e.path.shift(); }
function wander(e, dt, sp, homeP = .55) {
  if (e.path.length) return walkPath(e, sp, dt);
  e.moving = false; e.wait -= dt;
  if (e.wait <= 0) { const r = Math.random() < homeP ? e.room : pick(HANG); e.path = bfs(tileOf(e), pick(r.tiles)); e.wait = 2 + Math.random() * 5; }
}
function goHome(e) { e.path = bfs(tileOf(e), pick(e.room.tiles)); e.state = 'idle'; e.wait = 4; }
function followTrail(e, idx, dt) {
  const p = hero.trail[Math.min(idx, hero.trail.length - 1)] || hero;
  e.moving = false;
  if (dist(e, p) > .5) stepTo(e, p, Math.max(60, dist(e, p) * 3), dt);
}

// ---------------- герой: движение с коллизиями ----------------
function blocked(px, py) {
  for (const [ox, oy] of [[-4, -3], [3, -3], [-4, 2], [3, 2]]) if (!walk(Math.floor((px + ox) / T), Math.floor((py + oy) / T))) return true;
  return false;
}
function moveHero(vx, vy, dt) {
  const sp = (hero.cling ? 38 : 60) * dt, dx = vx * sp, dy = vy * sp;
  hero.moving = !!(vx || vy); if (!hero.moving) return;
  face(hero, vx, vy);
  const ox = hero.x, oy = hero.y;
  if (dx) { if (!blocked(hero.x + dx, hero.y)) hero.x += dx; else assist(hero, 'y', Math.abs(dx), dx); }
  if (dy) { if (!blocked(hero.x, hero.y + dy)) hero.y += dy; else assist(hero, 'x', Math.abs(dy), dy); }
  if (!hero.trail.length || Math.hypot(hero.x - hero.trail[0].x, hero.y - hero.trail[0].y) >= 2) { hero.trail.unshift({ x: hero.x, y: hero.y }); hero.trail.length = Math.min(hero.trail.length, 40); }
  if (ox === hero.x && oy === hero.y) hero.moving = false;
}
function assist(e, axis, s, d) {   // упёрся в стену рядом с дверью — мягко подталкиваем к проёму
  const cur = axis === 'y' ? e.y : e.x;
  for (const kk of [0, -1, 1]) {
    const c = (Math.floor(cur / T) + kk) * T + (axis === 'y' ? 9 : 8);
    if (Math.abs(c - cur) > 11) continue;
    const ok = axis === 'y' ? !blocked(e.x + d, c) : !blocked(c, e.y + d);
    if (ok) { const m = Math.sign(c - cur) * Math.min(Math.abs(c - cur), s); if (axis === 'y' && !blocked(e.x, e.y + m)) e.y += m; if (axis === 'x' && !blocked(e.x + m, e.y)) e.x += m; return; }
  }
}
const inRoom = (e, id) => { const t = tileOf(e), r = RM[t.y * W + t.x]; return r && r.id === id; };

// ---------------- вахтёрша ----------------
const WP = [[7, 2], [8, 10], [7, 18], [8, 26], [7, 34], [8, 41], [3, 45], [5, 44], [7, 46]];
const CONE_L = 84, CONE_A = .52;

  for (let i = 1; i < n; i++) { const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n; if (opaque(Math.floor(x / T), Math.floor(y / T))) return false; }
  return true;
}
function angTo(p) { let a = Math.atan2(p.y - warden.y, p.x - warden.x) - warden.ang; return Math.abs(Math.atan2(Math.sin(a), Math.cos(a))); }
function sees(p) {

  if (d < 14 && a < 1.9) return true;        // совсем рядом замечает, если только ты не точно за спиной
  return d < CONE_L && a < CONE_A && los(warden.x, warden.y - 6, p.x, p.y - 6);
}
function updWarden(dt, t) {

    if (w.pause <= 0) { const p = pick(WP); w.path = bfs(tileOf(w), { x: p[0], y: p[1] }); w.pause = 1.2 + Math.random() * 2.4; }

  const gl = hero.follower; if (gl) { hero.follower = null; gl.cool = 15; goHome(gl); }
  face(warden, hero.x - warden.x, hero.y - warden.y); hud();
  const line = why === 'steal' ? 'Ах ты воришка! Положи на место! Это мне студенты подарили!' : pick(CAUGHT);
  panel({ L: warden.look, name: 'Галина Петровна', sub: 'вахтёрша, 30 лет стажа', emo: 'angry', bar: null,
    text: `<b>Галина Петровна:</b> ${line}\n\n📝 Объяснительная ${S.strikes} из 3.`,
    btns: [{ t: S.strikes >= 3 ? 'Ой…' : 'Больше не буду (буду)', cls: 'wide', f: () => { closePanel(); if (S.strikes >= 3) endNight('expel'); } }] });
}

// ---------------- тени за занавеской ----------------
// общая сцена: свет гаснет, видно только два силуэта; o.done() возвращает итоговый текст, o.flop — провал
function curtain(o) {
  paused = true;
  const n = $('night'), tx = $('ntext'), fx = $('nfx');
  $('s0').innerHTML = portrait(hero.look, 'smile', 's0'); $('s1').innerHTML = portrait(o.L, 'smile', 's1');
  n.className = 'on'; fx.innerHTML = ''; $('nbtn').style.display = 'none';
  tx.textContent = 'Свет выключен. За занавеской — только тени…';
  setTimeout(() => n.classList.add('close'), 500);
  if (!o.flop) setTimeout(() => { for (let i = 0; i < 9; i++) setTimeout(() => { const s = document.createElement('span'); s.textContent = pick(['❤', '💕', '💗']);
    s.style.left = 30 + Math.random() * 40 + '%'; s.style.bottom = 35 + Math.random() * 15 + '%'; fx.appendChild(s); }, i * 220); }, 2400);
  setTimeout(() => { n.classList.add('blink'); setTimeout(() => n.classList.remove('blink'), 180); tx.textContent = o.interrupt + '…'; }, 3900);
  setTimeout(() => {
    tx.textContent = o.done();
    const b = $('nbtn'); b.textContent = o.flop ? 'Позор… 😳' : 'Дальше 😏'; b.style.display = '';
    b.onclick = () => { n.className = ''; paused = false; o.next(); };
  }, 5800);
}
function nightScene(gl) {
  hero.follower = null; gl.state = 'hidden';
  const back = () => { const t = pick(gl.room.tiles); gl.x = t.x * T + 8; gl.y = t.y * T + 9; gl.state = 'idle'; gl.path = []; };
  if (gl.flop) {
    const fan = gl.flop;
    return curtain({ L: gl.q, flop: 1, interrupt: 'Что-то пошло не так', done: () => { S.flop = { girl: gl.name, fan }; S.min += 30;
      return `…после ночи с ${fan === 'Зинка' ? 'Зинкой' : 'Люськой'} сил не осталось.\nВСЁ. НЕ ВСТАЛ 😳\n${gl.name} хлопнула дверью.`; },
      next: () => { back(); gl.flop = null; endNight('flop'); } });
  }
  curtain({ L: gl.q, interrupt: pick(INTERRUPT), done: () => {
    SAVE.got[gl.q.id] = SAVE.night; S.tonight++; S.min += 60; persist(); hud();
    return `…но вам было уже не до этого 😏\n❤ ${gl.name} — ${Object.keys(SAVE.got).length} из 20`;
  }, next: () => { back(); const total = Object.keys(SAVE.got).length; if (total >= 20) endNight('win'); else if (S.min >= 540) endNight('morning'); } });
}

// ---------------- HUD, тосты, экраны, журнал ----------------
function clockStr(m) { const h = (22 + Math.floor(m / 60)) % 24, mm = Math.floor(m % 60); return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
function hud() {
  $('clock').textContent = '🕙 ' + clockStr(Math.min(S.min, 540));
  $('score').textContent = `❤ ${Object.keys(SAVE.got).length}/20`;
  $('strikes').textContent = S.strikes ? '📝'.repeat(S.strikes) : '';
  $('inv').textContent = S.inv.map(i => ITEMS[i].e).join('');
}
let toastTimer = 0;
function toast(t, ms = 3000) { const s = $('say'); s.textContent = t; s.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => s.classList.remove('on'), ms); }
function screen(html, btns) {
  const s = $('screen'); s.className = ''; s.innerHTML = html;
  for (const b of btns) { const e = document.createElement('button'); e.className = 'big' + (b.alt ? ' alt' : ''); e.textContent = b.t; e.onclick = b.f; s.appendChild(e); }
}
function hideScreen() { $('screen').className = 'off'; }
function journal() {
  const was = paused; paused = true;
  $('jlist').innerHTML = ROSTER.map((q, i) => {
    const m = SAVE.met[q.id], a = ARCH[q.arch], r = ROOM[q.room], got = SAVE.got[q.id];
    if (!m) return `<div class="card"><div class="ph"></div><div><b>???</b><br><span class="q">комната ${r.no}<br>ещё не знакомы</span></div></div>`;
    return `<div class="card${got ? ' got' : ''}"><div class="ph">${portrait(q, got ? 'happy' : 'smile', 'j' + i, BUST)}</div><div><b>${q.name}</b> ${got ? '❤' : ''}<br>${a.t}, к. ${r.no}<br>` +
      `<span class="q">любит:</span> ${m.likes ? TYPE_NAME[a.likes] : '?'}<br><span class="q">хочет:</span> ${m.wish ? q.wish.map(w => ITEMS[w].e).join('') : '?'}</div></div>`;
  }).join('');
  $('journal').classList.add('on');
  $('jClose').onclick = () => { $('journal').classList.remove('on'); paused = was; };
}
$('jBtn').onclick = () => { if (S && !S.over && $('screen').classList.contains('off') && !$('dlg').classList.contains('on')) journal(); };
function intro() {
  paused = true;
  const total = Object.keys(SAVE.got).length, faces = ROSTER.slice(0, 5).map((q, i) => `<div>${portrait(q, 'smile', 'i' + i, BUST)}</div>`).join('');
  screen(`<h1>ОБЩАГА<small>ночной обход</small></h1><div class="faces">${faces}</div>
    <p>В общаге 20 девушек, у каждой свой характер и свои желания. Добейся каждой, принеси, что она хочет, и проведи к себе мимо вахтёрши с фонариком. Поклонницы хотят тебя просто так — от них придётся отбиваться.</p>
    <p class="fine">Тяни пальцем по экрану — идёшь. Большая кнопка — действие. На ПК: стрелки/WASD и пробел. Коллекция сохраняется между ночами.</p>
    <p class="fine">Все персонажи — совершеннолетние студенты. Никаких откровенных сцен: только тени за занавеской 😏</p>`,
    [{ t: SAVE.night > 1 || total ? `Ночь ${SAVE.night} (❤ ${total}/20)` : 'Играть', f: start },
     { t: 'Старая версия (новелла)', alt: 1, f: () => location.href = 'novella.html' }]);
}
function start() {
  newNight(); hideScreen(); paused = false;
  toast(`Ночь ${SAVE.night}. Ты в своей комнате (дверь «ТЫ ♥»). Найди девчонок и жми 💋`, 4000);
  setTimeout(() => !paused && toast('Подсказка: каждой нравится своё. Смотри, на что она радуется', 3500), 4500);
}
function endNight(kind) {
  S.over = true; paused = true;
  const total = Object.keys(SAVE.got).length; SAVE.best = Math.max(SAVE.best || 0, S.tonight);
  if (kind !== 'win') SAVE.night++; persist();
  const T1 = { win: 'ЛЕГЕНДА ОБЩАГИ', morning: 'УТРО', expel: 'ВЫГНАЛИ ДО УТРА', flop: 'НЕ ВСТАЛ 😳' }[kind];
  const txt = {
    win: `Все 20 сердец за ${SAVE.night} ноч${SAVE.night === 1 ? 'ь' : SAVE.night < 5 ? 'и' : 'ей'}! Галина Петровна до сих пор не понимает, как.`,
    morning: `Будильник, пары… За ночь ❤ ${S.tonight}, всего ${total} из 20. ${S.tonight >= 2 ? 'Неплохо 😏' : 'Толик говорит, что следующей ночью повезёт.'}`,
    flop: S.flop ? `${S.flop.girl} рассказала всей общаге. ${S.flop.fan} ходит довольная. Мораль: не спи с поклонницей ради подарка красотке. За ночь ❤ ${S.tonight}, всего ${total} из 20.` : '',
    expel: `Третья объяснительная — ночуешь у Толика на балконе. За ночь ❤ ${S.tonight}, всего ${total} из 20.`,
  }[kind];
  screen(`<h1>${T1}</h1><p>${txt}</p>`, [{ t: kind === 'win' ? 'Новая общага' : `Ночь ${SAVE.night}`, f: kind === 'win' ? resetAll : start },
    { t: '📖 Журнал', alt: 1, f: () => { journal(); } }]);
}
function resetAll() { SAVE = freshSave(); persist(); ROSTER = genRoster(SAVE.seed); paintBeds(); start(); }
$('menuBtn').onclick = () => {
  if (!S || S.over || !$('screen').classList.contains('off')) return;
  const was = paused; paused = true;
  screen('<h1>ПАУЗА</h1>', [{ t: 'Продолжить', f: () => { hideScreen(); paused = was; } }, { t: '📖 Журнал', alt: 1, f: () => { hideScreen(); journal(); } },
    { t: 'Новая общага (сброс)', alt: 1, f: () => { if (confirm('Начать с новыми девушками? Коллекция обнулится.')) resetAll(); } }]);
};

// ---------------- управление ----------------
const keys = {}; let joy = null;
addEventListener('keydown', e => { keys[e.code] = 1; if (['Space', 'Enter', 'KeyE'].includes(e.code)) { e.preventDefault(); act(); } });
addEventListener('keyup', e => { keys[e.code] = 0; });
$('game').addEventListener('pointerdown', e => {
  if (paused || e.target.closest('button, #dlg, #journal')) return;
  joy = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
  const j = $('joy'), r = $('game').getBoundingClientRect(); j.style.left = (e.clientX - r.left) + 'px'; j.style.top = (e.clientY - r.top) + 'px'; j.style.display = 'block'; j.firstChild.style.transform = '';
});
addEventListener('pointermove', e => {
  if (!joy || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.x, dy = e.clientY - joy.y; const d = Math.hypot(dx, dy), R = 42;
  if (d > R) { dx *= R / d; dy *= R / d; }
  joy.dx = dx / R; joy.dy = dy / R; $('joy').firstChild.style.transform = `translate(${dx}px,${dy}px)`;
});
const joyEnd = e => { if (joy && e.pointerId === joy.id) { joy = null; $('joy').style.display = 'none'; } };
addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);
$('act').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); act(); });
function input() {
  let x = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), y = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (joy && Math.hypot(joy.dx, joy.dy) > .2) { x = joy.dx; y = joy.dy; }
  const d = Math.hypot(x, y); if (d > 1) { x /= d; y /= d; }
  return [x, y];
}

// ---------------- цикл ----------------
function resize() {
  const r = $('game').getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); k = cv.width / VIEW; VH = cv.height / k;
}
addEventListener('resize', resize);
const LAMPS = [];
for (let y = 3; y < 46; y += 6) LAMPS.push({ x: 8 * T, y: y * T, r: 46, c: '255,205,130', a: .2 });
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const c = at(x, y);
  if (c === 't' || c === 'k') LAMPS.push({ x: x * T + 11, y: y * T + 6, r: 34, c: '255,200,120', a: .22 });
  if (c === 'v') LAMPS.push({ x: x * T + 8, y: y * T + 10, r: 30, c: '120,200,255', a: .14 }); }
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (!paused && S && !S.over) {
    const [vx, vy] = input(); moveHero(vx, vy, dt);
    updWarden(dt, t);
    for (const e of girls) updGirl(e, dt);
    for (const e of fans) updFan(e, dt);
    if (!paused && hero.follower && inRoom(hero, 'hero') && dist(hero, BED) < 30) nightScene(hero.follower);
    S.min += dt; if (S.min >= 540 && !paused) endNight('morning');
    for (const e of ents) if (e.moving) e.ft += dt * 8;
    if (Math.floor(S.min) !== Math.floor(S.min - dt)) hud();
  }
  const lab = !paused && S && !S.over ? actLabel() : null, a = $('act');
  if (lab) { if (a.textContent !== lab) a.textContent = lab; a.classList.add('on'); } else a.classList.remove('on');
  if (S) render(t);
  requestAnimationFrame(frame);
}
function render(t) {
  const cw = VIEW, ch = VH;
  camX = clamp(hero.x - cw / 2, 0, W * T - cw);
  camY = clamp(hero.y - ch / 2 + 10, -58, H * T - ch + 40);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#120e1c'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(k, 0, 0, k, -camX * k, -camY * k);
  g.imageSmoothingEnabled = true; g.drawImage(mapCv, 0, 0, W * T, H * T);
  // предметы: искорки
  for (const s of SPOTS) if (!S.taken[s.item]) { const p = .6 + .4 * Math.sin(t / 260 + s.x * 3); g.globalAlpha = p; g.font = '6px system-ui'; g.textAlign = 'center'; g.fillText('✨', s.px, s.py - 3); g.globalAlpha = 1; }
  if (hero.follower) { g.globalAlpha = .45 + .35 * Math.sin(t / 180); g.strokeStyle = '#ff5d8f'; g.lineWidth = 1; g.strokeRect(T + .5, 16 * T + .5, T - 1, 2 * T - 1); g.globalAlpha = 1; }
  for (const e of [...ents].sort((a, b) => a.y - b.y)) {
    if (e.state === 'hidden') continue;
    if (e.x < camX - 20 || e.x > camX + cw + 20 || e.y < camY - 10 || e.y > camY + ch + 40) continue;
    chibi(g, e.x, e.y, e.look, e.dir, e.moving ? (Math.floor(e.ft) % 2) + 1 : 0, t);
  }
  // ночь: затемнение, лампы, фонарик
  g.fillStyle = 'rgba(10,6,38,.4)'; g.fillRect(camX - 2, camY - 2, cw + 4, ch + 4);
  g.globalCompositeOperation = 'lighter';
  for (const L of LAMPS) {
    if (L.y < camY - 60 || L.y > camY + ch + 60) continue;
    const gr = g.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r); gr.addColorStop(0, `rgba(${L.c},${L.a})`); gr.addColorStop(1, `rgba(${L.c},0)`);
    g.fillStyle = gr; g.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
  }
  const w = warden, ox = w.x, oy = w.y - 6;
  g.fillStyle = w.sus > 0 ? `rgba(255,140,90,${.22 + w.sus * .2})` : 'rgba(255,236,150,.22)';
  g.beginPath(); g.moveTo(ox, oy);
  for (let i = 0; i <= 18; i++) {
    const a = w.ang - CONE_A + (2 * CONE_A) * i / 18; let L = 0;
    while (L < CONE_L && !opaque(Math.floor((ox + Math.cos(a) * L) / T), Math.floor((oy + Math.sin(a) * L) / T))) L += 2;
    g.lineTo(ox + Math.cos(a) * L, oy + Math.sin(a) * L);
  }
  g.closePath(); g.fill();
  g.globalCompositeOperation = 'source-over';
  // значки и имена
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  if (w.sus > 0) { g.font = 'bold 9px system-ui'; g.fillStyle = w.sus > .6 ? '#ff5d5d' : '#ffd166'; g.fillText(w.sus > .6 ? '!' : '?', w.x, w.y - 29); }
  for (const e of girls) if (SAVE.got[e.q.id] && e.state !== 'hidden') heartPath(g, e.x, e.y - 33, 2.4, '#ff5d8f');
  for (const e of fans) if (e.state === 'chase' || e.state === 'cling') heartPath(g, e.x, e.y - 33 - (Math.floor(t / 200) % 2), 2.4, '#ff9ec7');
  const n = !paused && !hero.cling && nearest();
  if (n) {
    const nx = n.kind === 'spot' ? n.px : n.x, ny = n.kind === 'spot' ? n.py - 6 : n.y - 28;
    const label = n.kind === 'spot' ? ITEMS[n.item].e + ' ' + ITEMS[n.item].n : n.name;
    if (label) { g.font = 'bold 4.6px system-ui, sans-serif'; const tw = g.measureText(label).width + 4; rr(g, nx - tw / 2, ny - 5.5, tw, 7, 2, 'rgba(20,14,32,.85)'); g.fillStyle = '#fff'; g.fillText(label, nx, ny); }
  }
  if (hero.follower) {   // стрелка к твоей комнате, если её не видно
    const sx = BED.x - camX, sy = BED.y - camY, m = 10, top = 60;
    if (sx < m || sy < top || sx > cw - m || sy > ch - m) {
      const cx = cw / 2, cy = ch / 2, a = Math.atan2(sy - cy, sx - cx), kk = Math.min(Math.abs((cw / 2 - m) / Math.cos(a)), Math.abs((ch / 2 - top) / Math.sin(a)));
      g.save(); g.translate(camX + cx + Math.cos(a) * kk, camY + cy + Math.sin(a) * kk); g.rotate(a);
      poly(g, [7, 0, -4, -5.5, -4, 5.5], '#ff5d8f'); g.restore();
    }
  }
}
paintBeds(); resize(); newNight(); intro(); requestAnimationFrame(frame);
</script>
