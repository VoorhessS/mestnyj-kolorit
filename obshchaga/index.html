<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1622">
<title>Общага — до сессии 14 дней</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1b1622; color: #f3ead8; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 10px); gap: 8px; }
  #hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; letter-spacing: .5px; }
  #top .day { color: #ffd166; }
  #top button { background: none; border: 0; color: #a99fb8; font-size: 20px; padding: 2px 6px; }
  .st { background: #2a2233; border-radius: 8px; padding: 4px 6px; font-size: 12px; font-weight: 700; }
  .st .bar { height: 5px; background: #3c3247; border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .st .bar i { display: block; height: 100%; border-radius: 3px; transition: width .4s; }
  .st.bump { animation: bump .5s; }
  @keyframes bump { 30% { transform: scale(1.12); } }
  #stage { position: relative; width: 100%; flex: 1 0 250px; max-height: 64vh; border-radius: 12px; overflow: hidden; background: #000; --lamp: 1; }
  #scene { position: absolute; left: -6px; top: -6px; width: calc(100% + 12px); height: calc(100% + 12px); filter: blur(2px) saturate(1.15); }
  #stage.curtain #scene { filter: none; }
  #chars { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-end; }
  #chars .ch { height: 98%; max-width: 100%; aspect-ratio: 2 / 3; filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); animation: pop .35s ease-out; }
  #chars.two .ch { height: 90%; max-width: 58%; margin: 0 -5%; }
  #chars svg { width: 100%; height: 100%; display: block; }
  @keyframes pop { from { transform: translateY(8%); opacity: 0; } }
  #chars .sil { filter: brightness(0) blur(3px); opacity: calc(.75 * var(--lamp) + .1); transition: transform 3.6s ease-in-out; animation: none; }
  #chars .sil.s0 { transform: translateX(-38%); } #chars .sil.s1 { transform: translateX(38%) scaleX(-1); }
  #chars .sil.s0.close { transform: translateX(6%); } #chars .sil.s1.close { transform: translateX(-6%) scaleX(-1); }
  #curt { position: absolute; inset: 0; display: none; pointer-events: none;
    background: linear-gradient(#3a2018 0 6px, transparent 6px), repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 5px, rgba(255,230,200,.10) 5px 14px, rgba(0,0,0,.12) 14px 24px); }
  #stage.curtain #curt { display: block; animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway { to { transform: translateX(4px); } }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #fx span { position: absolute; bottom: 10%; font-size: 22px; animation: rise 2.2s ease-out forwards; }
  @keyframes rise { to { transform: translateY(-160%) scale(1.3); opacity: 0; } }
  #text { background: #2a2233; border: 2px solid #4a3d58; border-radius: 10px; padding: 10px 12px; min-height: 92px; white-space: pre-line; }
  #text b { color: #ffd166; }
  #text .who { display: block; font-weight: 800; margin-bottom: 2px; }
  #choices { display: flex; flex-direction: column; gap: 7px; }
  #choices button { font: 700 15px system-ui, sans-serif; color: #f3ead8; background: #3a2f48; border: 2px solid #5b4b6e; border-radius: 10px;
    padding: 10px 12px; min-height: 46px; text-align: left; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  #choices button:active { transform: scale(.98); background: #4a3d5c; }
  #choices button:disabled { opacity: .4; }
  #choices button .c { font-size: 12px; color: #c9bcdc; font-weight: 600; white-space: nowrap; }
  #choices button.hot { background: #6b2346; border-color: #ff5d8f; }
  #choices button.go { background: #2f5a3a; border-color: #5fd27f; justify-content: center; }
  #float { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); pointer-events: none; font-weight: 800; font-size: 18px; text-shadow: 0 2px 4px #000; }
  #float span { display: block; animation: up 1.4s forwards; text-align: center; }
  @keyframes up { to { transform: translateY(-50px); opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="day" id="day"></span><span id="slot"></span><button id="menu" aria-label="Меню">☰</button></div>
  <div id="hud"></div>
  <div id="stage"><canvas id="scene" width="192" height="144"></canvas><div id="chars"></div><div id="curt"></div><div id="fx"></div></div>
  <div id="text"></div>
  <div id="choices"></div>
</div>
<div id="float"></div>
<script>
'use strict';
// ===== Общага: комедийный симулятор студенческой жизни (идея друга, msg 2257/2259) =====
// Все герои — студенты 2 курса, им 19–20 лет. Без откровенных сцен: свидание — только тени за занавеской.
const $ = id => document.getElementById(id);
const cv = $('scene'), g = cv.getContext('2d');
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)], clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DAYS = 14, SLOTS = ['☀️ Утро', '🌤 День', '🌙 Вечер'];

// ----- Девушки: у каждой свой вкус -----
const GIRLS = {
  katya: { name: 'Катя', about: 'филфак, язвит, читает Бродского', like: { joke: 15, smart: 8, bold: -6 }, where: 'kitchen',
    hair: '#c4572a', top: '#3f7d4e', bottom: '#2d2a3a', style: 'bob', glasses: false },
  alina: { name: 'Алина', about: 'физмат, отличница, всегда с конспектом', like: { smart: 15, joke: 4, bold: -8 }, where: 'uni',
    hair: '#2b1d16', top: '#e9e4f0', bottom: '#3b4a6b', style: 'bun', glasses: true },
  vika: { name: 'Вика', about: 'волейбол, громко смеётся, бегает по утрам', like: { bold: 15, joke: 8, smart: -4 }, where: 'stadium',
    hair: '#e8c35a', top: '#2f6fd6', bottom: '#1d2b55', style: 'tail', glasses: false },
};
const LINES = {
  katya: {
    hi: ['Катя мешает в кастрюле что-то подозрительное. — Это суп. Наверное.', 'Катя сидит на подоконнике кухни с книжкой. — Ты тоже пришёл смотреть, как Толик ворует чужую еду?', 'Катя: — О, человек. Редкий вид для нашей кухни в это время.'],
    joke: [['— Говорят, если долго смотреть в общажный холодильник, холодильник посмотрит в тебя. И заберёт сосиску.', '— Ха! Ладно, это было неплохо.', '— Ты репетировал. Видно.'], ['— У нас в комнате таракан с регистрацией. Он тут дольше нас живёт.', '— *смеётся* Надо его на старосту выдвинуть.', '— Шутка бородатая, как он сам.']],
    smart: [['— Читаешь Бродского? «Не выходи из комнаты» — это прямо про сессию.', '— О, кто-то в этой общаге умеет читать!', '— Ну, хотя бы название обложки ты прочитал.'], ['— Знаешь, почему кухня — сердце общаги? Тут единственная розетка, которая работает.', '— Метафора засчитана.', '— Звучит как сочинение на троечку.']],
    bold: [['— Брось этот суп. Пойдём, я угощу тебя нормальной шавермой.', '— Хм… суп и правда подозрительный. Ладно, уговорил.', '— Я сама решаю, когда бросать суп, спасибо.'], ['— У тебя красивые глаза. Особенно когда закатываешь их на Толика.', '— *краснеет* …Ну ты и подхалим.', '— Это был худший подкат на этом этаже. А тут Толик живёт.']],
  },
  alina: {
    hi: ['Алина в аудитории раскладывает пять цветных маркеров. — Садись, только не дыши на конспект.', 'Алина в библиотеке: — Ты тоже готовишься к матану? Или просто греешься?', 'Алина поправляет очки: — Ты в списке на пересдачу? Просто уточняю.'],
    joke: [['— Матан — это когда ты всё понял, а потом наступила вторая строчка.', '— *хихикает* Ну, это правда.', '— Не смешно. Это моя жизнь.'], ['— Знаешь, чем студент похож на интеграл? Оба неопределённые.', '— Математический юмор! Засчитано.', '— Интеграл хотя бы берётся.']],
    smart: [['— Можно я помогу с задачей? Тут замена переменной напрашивается.', '— О! Точно. Ты не так безнадёжен, как сидишь.', '— Неправильно. Но мило.'], ['— Я тут вывел, как успеть за ночь выучить билеты. Хочешь, покажу график?', '— График? Ты говоришь на моём языке!', '— Твой график нарушает законы физики. И сна.']],
    bold: [['— Давай после пар сбежим в кино? Матан никуда не денется.', '— …Матан никуда не денется. Звучит разумно.', '— Матан не денется. А стипендия — денется.'], ['— Сними очки. Хочу посмотреть, кто там такой умный.', '— *снимает и тут же надевает* Ничего не видно, но приятно.', '— Без очков я тебя вообще не отличу от шкафа. Нет.']],
  },
  vika: {
    hi: ['Вика наматывает круги по стадиону. — Догонишь — поговорим!', 'Вика отбивает мяч от стенки: — Эй, сосед! Подай мячик.', 'Вика делает растяжку на трибуне: — Ты бегать или поглазеть?'],
    joke: [['— Я тоже спортсмен. Каждое утро бегу от будильника.', '— Ха-ха! Ладно, ты смешной.', '— Это не спорт, это позор.'], ['— Я бы побегал с тобой, но я берегу колени. Для лестницы в общаге.', '— *ржёт* Девятый этаж без лифта — это сила!', '— Слабак. Смешной, но слабак.']],
    smart: [['— Знаешь, бег улучшает память. Я читал исследование.', '— Ну хоть кто-то читает за меня. Круто!', '— Ты сейчас как тренер по физре, только скучнее.'], ['— Если подавать под углом 45 градусов, мяч летит дальше всего.', '— Серьёзно? Покажи!', '— Я подаю как чувствую. Не занудствуй.']],
    bold: [['— Давай наперегонки. Кто проиграл — тот угощает кофе.', '— Принято! Готовь кошелёк!', '— Ты задохнёшься через десять метров. Не позорься.'], ['— Ты самая быстрая на стадионе. И самая красивая на всём районе.', '— *улыбается* Ох, нахал. Мне нравится.', '— Ого, какой смелый. Сначала круг пробеги.']],
  },
};

// ----- Состояние -----
const NEW = () => ({ day: 1, slot: 0, money: 400, energy: 100, study: 15, charm: 10, aff: { katya: 0, alina: 0, vika: 0 }, talked: {}, dating: null, tolikAway: false, stip: false, over: false });
let S = NEW();
try { const sv = JSON.parse(localStorage.getItem('obshchaga-save') || 'null'); if (sv && !sv.over) S = Object.assign(NEW(), sv); } catch (e) {}
const save = () => { try { localStorage.setItem('obshchaga-save', JSON.stringify(S)); } catch (e) {} };

// ----- Шкалы -----
const STATS = [['money', '💰', '#ffd166', 2000, v => v + '₽'], ['energy', '⚡', '#5fd27f', 100, v => v], ['study', '📚', '#6fb3ff', 100, v => v], ['charm', '😎', '#ff7eb3', 100, v => v]];
function hud(bump) {
  $('day').textContent = `День ${S.day}/${DAYS}`;
  $('slot').textContent = SLOTS[S.slot] + (S.dating ? ` · ❤ ${GIRLS[S.dating].name}` : '');
  $('hud').innerHTML = STATS.map(([k, ic, col, max, f]) => `<div class="st${bump && bump[k] ? ' bump' : ''}">${ic} ${f(S[k])}<div class="bar"><i style="width:${clamp(S[k] / max * 100, 0, 100)}%;background:${col}"></i></div></div>`).join('');
}
function change(d) {   // d = { money: +100, energy: -20, ... } — меняет и показывает всплывашки
  const fl = [];
  for (const k in d) {
    if (k === 'aff') continue;
    const max = k === 'money' ? 99999 : 100; S[k] = clamp(S[k] + d[k], 0, max);
    const st = STATS.find(s => s[0] === k); if (st && d[k]) fl.push(`<span style="color:${st[2]}">${d[k] > 0 ? '+' : ''}${d[k]}${k === 'money' ? '₽' : ''} ${st[1]}</span>`);
  }
  if (d.aff) for (const [gk, v] of Object.entries(d.aff)) { S.aff[gk] = clamp(S.aff[gk] + v, 0, 100); fl.push(`<span style="color:#ff5d8f">${v > 0 ? '+' : ''}${v} ❤ ${GIRLS[gk].name}</span>`); }
  if (fl.length) { const f = $('float'); f.innerHTML = fl.join(''); f.style.animation = 'none'; void f.offsetWidth; }
  hud(d); save();
}

// ----- Экран: текст + кнопки -----
let scene = { bg: 'room', who: [] }, anim = null;
function show(txt, choices, sc) {
  if (sc) scene = sc;
  $('text').innerHTML = txt;
  const box = $('choices'); box.innerHTML = '';
  for (const c of choices) {
    const b = document.createElement('button'); b.innerHTML = `<span>${c.t}</span>${c.c ? `<span class="c">${c.c}</span>` : ''}`;
    if (c.cls) b.className = c.cls; if (c.off) b.disabled = true;
    b.onclick = () => { click(); c.f(); }; box.appendChild(b);
  }
  hud(); draw(); renderChars();
}
const say = (gk, txt) => `<span class="who" style="color:${GIRLS[gk] ? GIRLS[gk].hair === '#2b1d16' ? '#b9a3ff' : GIRLS[gk].hair : '#ffd166'}">${GIRLS[gk] ? GIRLS[gk].name : gk}</span>${txt}`;

// ===== Ход: выбор места =====
const PLACES = [
  { id: 'uni', t: '📚 На пары', c: '+📚 −⚡', slots: [0, 1] },
  { id: 'work', t: '💼 Подработка', c: '+💰 −⚡', slots: [1, 2] },
  { id: 'kitchen', t: '🍳 На кухню', c: 'еда, соседи', slots: [0, 1, 2] },
  { id: 'stadium', t: '🏃 На стадион', c: '+😎 −⚡', slots: [0, 1] },
  { id: 'party', t: '🎉 Вечеринка в 512-й', c: '−100₽ +😎', slots: [2] },
  { id: 'sleep', t: '😴 Поспать', c: '+⚡', slots: [0, 1, 2] },
];
function turn() {
  if (S.over) return ending();
  hud(); save();
  if (S.day === 7 && !S.stip) { S.stip = true; change({ money: 600 }); return show('📩 СМС из банка: <b>пришла стипендия!</b> 600₽.\nТолик уже стоит в дверях с лицом «одолжи до стипендии». Так стипендия же.', [{ t: 'Спрятать карту под матрас', f: turn }], { bg: 'room', who: ['tolik'] }); }
  if (S.energy <= 0) { return show('Ты уснул прямо в коридоре, обняв огнетушитель. Пропускаешь время.', [{ t: 'Проснуться…', f: () => { change({ energy: 35 }); next(); } }], { bg: 'hall', who: [] }); }
  if (Math.random() < .22) { const ev = pick(EVENTS.filter(e => !e.slot || e.slot.includes(S.slot))); if (ev) return ev.run(); }
  const ch = PLACES.filter(p => p.slots.includes(S.slot)).map(p => ({ t: p.t, c: p.c, f: () => go(p.id), off: p.id === 'party' && S.money < 100 }));
  const ready = Object.keys(GIRLS).find(k => S.aff[k] >= 100 && S.dating !== k);
  if (S.slot === 2 && ready) ch.unshift({ t: `❤ Позвать ${GIRLS[ready].name === 'Вика' ? 'Вику' : GIRLS[ready].name === 'Катя' ? 'Катю' : 'Алину'} к себе`, c: 'вечер', cls: 'hot', f: () => invite(ready) });
  const txt = S.slot === 0 ? pick(['Будильник орёт. Толик храпит. Куда пойдём?', 'Утро. На кухне уже пахнет чужой яичницей.', 'Солнце светит в немытое окно. Новый день!']) :
    S.slot === 1 ? pick(['День в разгаре. Чем займёмся?', 'Обед. В столовой опять «рыба по-польски».', 'Пары кончились (или ты их прогулял). Дальше?']) :
    pick(['Вечер. В коридоре кто-то играет на гитаре «Кино».', 'Стемнело. Из 512-й гремит музыка.', 'Вечер. Галина Петровна заступила на вахту. Берегись.']);
  show(`${txt}\n<b>До сессии ${DAYS - S.day + 1} дн.</b>`, ch, { bg: 'room', who: S.tolikAway ? [] : ['tolik'] });
}
function next() {
  S.slot++; S.talked = S.slot === 0 ? {} : S.talked;
  if (S.slot > 2) { S.slot = 0; S.day++; S.talked = {}; S.tolikAway = false; change({ energy: 30, study: S.study > 20 ? -2 : 0 }); if (S.day > DAYS) return exam(); }
  save(); turn();
}
function go(id) {
  if (id === 'sleep') { change({ energy: S.slot === 2 ? 55 : 35 }); return show(pick(['Ты уснул. Снился матан в виде дракона.', 'Сон — лучший предмет. Сдал бы на отлично.', 'Толик храпел, но ты победил.']), [{ t: 'Дальше', cls: 'go', f: next }], { bg: 'room', who: S.tolikAway ? [] : ['tolik'], night: true }); }
  if (id === 'uni') {
    const gain = S.energy < 30 ? 3 : 8; change({ study: gain, energy: -20 });
    const t = pick(['Лектор бубнит про пределы. Ты что-то даже записал.', 'Семинар! Тебя спросили, и ты ответил. Почти правильно.', 'Лабораторка. Ничего не взорвалось. Успех.']) + (S.energy < 30 ? '\n<i>Ты клевал носом — запомнил немного.</i>' : '');
    return meetOr('alina', t, 'uni');
  }
  if (id === 'work') { change({ money: 220, energy: -25 }); return show(pick(['Раздавал листовки у метро. Одна бабушка взяла три, «на растопку».', 'Курьер на самокате. Пиццу довёз, правда, слегка вертикально.', 'Помогал грузить мебель. Диван победил, но заплатили.']), [{ t: 'Дальше', cls: 'go', f: next }], { bg: 'street', who: [] }); }
  if (id === 'stadium') { change({ charm: 4, energy: -15 }); return meetOr('vika', pick(['Пробежал круг. Потом ещё полкруга. Потом посидел.', 'Подтягивался на турнике. Целых три раза!', 'Сделал зарядку. Голуби впечатлены.']), 'stadium'); }
  if (id === 'party') { change({ money: -100, charm: 8, energy: -20 }); const gk = pick(Object.keys(GIRLS)); return meetOr(gk, pick(['В 512-й танцы, чипсы и колонка, которая хрипит на басах.', 'Кто-то принёс караоке. Ты спел «Группу крови». Зал аплодировал (или просил замолчать).']), 'party', true); }
  if (id === 'kitchen') {
    const eat = S.money >= 60;
    if (eat) change({ money: -60, energy: 20 }); else change({ energy: 5 });
    const t = eat ? pick(['Сварил пельмени. Половина слиплась в одного большого пельменя. Вкусно!', 'Пожарил яичницу. Сковородку Толик так и не помыл с прошлого семестра.', 'Заварил «Доширак» с сосиской. Ресторан!']) : 'Денег нет. Съел корочку хлеба и посмотрел на чужую колбасу. Стало чуть сытнее.';
    return meetOr('katya', t, 'kitchen');
  }
}
function meetOr(gk, txt, bg, force) {   // в месте может встретиться девушка
  const can = !S.talked[gk] && (force || Math.random() < .7);
  const ch = [{ t: 'Дальше', cls: 'go', f: next }];
  if (can) ch.unshift({ t: `💬 Подойти к ${GIRLS[gk].name === 'Вика' ? 'Вике' : GIRLS[gk].name === 'Катя' ? 'Кате' : 'Алине'}`, c: `❤ ${S.aff[gk]}`, cls: 'hot', f: () => flirt(gk, bg) });
  show(txt, ch, { bg, who: can ? [gk] : [] });
}

// ===== Флирт =====
function flirt(gk, bg) {
  S.talked[gk] = true; const G = GIRLS[gk], L = LINES[gk];
  const opts = ['joke', 'smart', 'bold'].map(k => ({ k, l: pick(L[k]) })).sort(() => Math.random() - .5);
  const ch = opts.map(o => ({ t: o.l[0], f: () => answer(gk, o, bg) }));

    let c = ''; for (let i = 0; i < 14; i++) { const a = Math.PI * (i / 13), x = 100 - Math.cos(a) * 52, y = 74 - Math.sin(a) * 48; c += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="${i % 2 ? h : hd}"/>`; }

  if (p.look === 'sweater') body += `<path d="M80 168 L120 168 L124 186 Q100 194 76 186 Z" fill="${shade(top, .8)}"/>` + [0, 1, 2, 3].map(i => `<path d="M${40 + i * 4} ${230 + i * 18} Q100 ${240 + i * 18} ${160 - i * 4} ${230 + i * 18}" stroke="${shade(top, .85)}" stroke-width="2" fill="none"/>`).join('');

  // лицо

    return `<ellipse cx="${cx}" cy="100" rx="12" ry="14" fill="#fff"/>
      <ellipse cx="${cx + dx}" cy="${101 + dy}" rx="9" ry="12" fill="url(#ir${id})"/>

  const brow = emo === 'angry' ? `<path d="M70 76 L92 84 M130 76 L108 84" stroke="${hd}" stroke-width="4" stroke-linecap="round"/>` :
    emo === 'shy' || emo === 'sad' ? `<path d="M70 80 Q80 74 92 78 M108 78 Q120 74 130 80" stroke="${hd}" stroke-width="3" fill="none" stroke-linecap="round"/>` :
    `<path d="M70 78 Q80 72 92 76 M108 76 Q120 72 130 78" stroke="${hd}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const mouth = emo === 'happy' ? `<path d="M90 126 Q100 142 110 126 Z" fill="#b8404e"/><path d="M94 132 Q100 138 106 132" fill="#ff8a9a"/>` :
    emo === 'angry' || emo === 'sad' ? `<path d="M93 133 Q100 127 107 133" stroke="#8a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>` :
    emo === 'shy' ? `<path d="M95 131 Q100 128 105 131" stroke="#8a3a3a" stroke-width="2" fill="none" stroke-linecap="round"/>` :
    `<path d="M92 128 Q100 135 108 128" stroke="#8a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  const blush = (emo === 'shy' || emo === 'happy') ? `<g opacity="${emo === 'shy' ? .75 : .45}"><ellipse cx="74" cy="118" rx="11" ry="5" fill="#ff7a9a"/><ellipse cx="126" cy="118" rx="11" ry="5" fill="#ff7a9a"/><path d="M68 116 l3 -4 M74 116 l3 -4 M80 116 l3 -4 M120 116 l3 -4 M126 116 l3 -4 M132 116 l3 -4" stroke="#e0506e" stroke-width="1.5"/></g>` : '';
  if (emo === 'angry') extra += `<g transform="translate(148 44)" stroke="#e23" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-8 -2 Q-2 -2 -2 -8 M8 -2 Q2 -2 2 -8 M-8 2 Q-2 2 -2 8 M8 2 Q2 2 2 8"/></g>`;
  if (emo === 'shy' || emo === 'sad') extra += `<path d="M146 70 Q152 82 146 88 Q140 82 146 70 Z" fill="#8fd0ff" stroke="#5aa8e0" stroke-width="1.5"/>`;
  const glasses = p.glasses ? `<g fill="none" stroke="#3a3048" stroke-width="2.5"><rect x="64" y="88" width="30" height="24" rx="8"/><rect x="106" y="88" width="30" height="24" rx="8"/><path d="M94 98 L106 98"/></g><path d="M70 92 L78 100" stroke="#fff" stroke-width="2" opacity=".6"/>` : '';

function renderChars() {
  const sc = scene, box = $('chars'), who = (sc.who || []).filter(k => GIRLS[k] || NPC[k]);
  $('stage').classList.toggle('curtain', sc.bg === 'curtain');
  box.className = who.length > 1 ? 'two' : '';
  box.innerHTML = who.map((k, i) => `<div class="ch${sc.bg === 'curtain' ? ' sil s' + i : ''}">${portrait(GIRLS[k] || NPC[k], sc.bg === 'curtain' ? 'smile' : (sc.emo && sc.emo[k]) || (k === 'vahta' ? 'angry' : 'smile'), k + i)}</div>`).join('');
  if (sc.bg === 'curtain') requestAnimationFrame(() => requestAnimationFrame(() => box.querySelectorAll('.sil').forEach(el => el.classList.add('close'))));
  if (sc.hearts) for (let i = 0; i < 4 + sc.hearts * 3; i++) setTimeout(() => { const s = document.createElement('span'); s.textContent = pick(['❤', '💕', '💗']); s.style.left = (25 + Math.random() * 50) + '%'; $('fx').appendChild(s); setTimeout(() => s.remove(), 2200); }, i * 180);
}
function fitCanvas() {
  const st = $('stage'), w = st.clientWidth || 1, h = st.clientHeight || 1, H = Math.max(100, Math.round(192 * h / w));
  if (cv.height !== H) cv.height = H;
  const k = Math.max(1, H / 144); g.setTransform(k, 0, 0, k, (192 - 192 * k) / 2, H - 144 * k);
}
addEventListener('resize', fitCanvas);
function draw(t = performance.now()) {
  const sc = scene;
  fitCanvas(); g.clearRect(-400, -400, 1200, 1200);
  if (sc.bg === 'curtain') return curtain(t, sc);
  bg(sc.bg || 'room', t, sc.night || (S.slot === 2 && !sc.morning));
  if (S.slot === 2 && !sc.morning && sc.bg !== 'party') { g.fillStyle = 'rgba(20,10,60,.3)'; g.fillRect(0, 0, 192, 144); }
}
function curtain(t, sc) {   // ТЕНИ ЗА ЗАНАВЕСКОЙ — видно только силуэты (друг, msg 2259); занавеска — слой #curt поверх силуэтов
  const k = Math.min(1, (t - sc.t0) / 4200), lamp = k < .85 ? 1 : Math.max(0, 1 - (k - .85) / .15);
  const grad = g.createRadialGradient(96, 70, 10, 96, 70, 120); grad.addColorStop(0, `rgba(255,190,110,${.95 * lamp})`); grad.addColorStop(1, `rgba(120,50,30,${.9 * lamp})`);
  g.fillStyle = '#120a10'; g.fillRect(0, 0, 192, 144); g.fillStyle = grad; g.fillRect(0, 0, 192, 144);
  $('stage').style.setProperty('--lamp', lamp.toFixed(2));
}
(function loop(t) { draw(t); requestAnimationFrame(loop); })(performance.now());

hud();
if (S.day === 1 && S.slot === 0) intro(); else turn();
