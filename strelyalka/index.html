<script>
'use strict';
// ===== Экран: высота фиксирована, ширина по пропорциям телефона =====
const T = 16, H = 14 * T;
let W = 400;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const port = document.getElementById('port');
const HORROR = !/[?&]light=1/.test(location.search);   // ?light=1 — без темноты
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
function resize() {
  W = Math.max(300, Math.min(520, Math.round(H * innerWidth / innerHeight)));
  cv.width = W; cv.height = H; dark.width = W; dark.height = H;
  ctx.imageSmoothingEnabled = false;
  port.style.display = innerHeight > innerWidth ? 'flex' : 'none';
}
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// ===== Клетки карты =====
// 0 воздух (улица), 1 стена/пол, 2 перекрытие (запрыгнуть снизу), 3 лестница, 4 кислота,
// 5 комната (стена на фоне), 6 запертая дверь, 7 решётка, 8 лаз (проход внутри стены)
// 9 вода (плывёшь, течение сносит), 10 валун (твёрдый, разбивается камнем богомола)
const AIR = 0, SOLID = 1, PLAT = 2, LAD = 3, ACID = 4, BG = 5, DOOR = 6, GRATE = 7, VENT = 8, WATER = 9, ROCK = 10, STICKY = 11, CRUMBLE = 12;
let grid, COLS = 10, ROWS = 10, MAPW = 160, MAPH = 160;
const tile = (cx, cy) => (cx < 0 || cx >= COLS || cy >= ROWS ? SOLID : cy < 0 ? AIR : grid[cy][cx]);
const ROCK_HP = 6; let rockHit = {}, crumb = new Map();   // crumb — осыпающийся пол: ключ клетки → таймеры            // сколько пуль выдерживает валун
const isSolid = t => t === SOLID || t === DOOR || t === GRATE || t === ROCK || t === STICKY || t === CRUMBLE;
const solid = (cx, cy) => isSolid(tile(cx, cy));
const open = t => t === AIR || t === BG || t === LAD || t === VENT || t === WATER;          // сквозь это видно и можно пройти
const oneWay = (t, cx, cy) => t === PLAT || (t === LAD && tile(cx, cy - 1) !== LAD);   // верх лестницы — как пол

// ===== Подуровни города N1 =====

  flat: { bg: '#221a1e', bg2: '#2a2026', pat: 'paper', solid: '#2c2628', floor: '#6a5038' },
  upper: { bg: '#1c1a22', bg2: '#24212c', pat: 'paint', solid: '#29262e', floor: '#4e4a56' },
  attic: { bg: '#24190f', bg2: '#1a1209', pat: 'wood', solid: '#2e2216', floor: '#6a4a2a' },
  roof: { bg: '#17161b', bg2: '#1f1e24', pat: 'block', solid: '#4a3834', floor: '#77706a', road: '#3c3c44', earth: '#26242a' },
  shaft: { bg: '#1e2024', bg2: '#26292e', pat: 'block', solid: '#2e3036', floor: '#5a5e66' },
  forest: { forest: 1, bg: '#1c150e', bg2: '#2a2014', pat: 'root', solid: '#3a2a1a', floor: '#4a8a2a', road: '#3a2a1a', earth: '#2a1e12' },
  nora: { forest: 1, nora: 1, bg: '#140f16', bg2: '#1e1722', pat: 'root', solid: '#2a1f26', floor: '#3a3048', floor2: '#231b2c', blade: '#6a58a8', deep: '#1c141a', road: '#2a1f26', earth: '#1c141a' },
};
const LEVELS = [
  { name: 'УЛИЦА', task: 'Доберись до дома в конце улицы', obj: 'reach', sky: true, day: true, ground: 16, dark: .9,

      B.sign(66, 24, '<'); B.sign(12, 24, '<');

    build(B) {
      B.room(1, 14, 59, 17); B.room(67, 14, 138, 17);                              // коридор, посередине обвал
      B.room(10, 8, 40, 11); B.room(50, 8, 85, 11); B.room(95, 8, 130, 11);         // квартиры

      B.lamp(20, 14); B.lamp(75, 14); B.lamp(110, 14);
      B.nest(25, 18); B.nest(30, 12); B.nest(70, 12); B.nest(105, 18); B.nest(118, 12);
      B.bug(45, 18, 'j'); B.bug(62, 12); B.bug(100, 18, 'R'); B.bug(125, 12, 'j'); B.bug(36, 12);
      B.bug(18, 18, 'c'); B.bug(66, 12, 'c'); B.bug(115, 18, 'c');

  { name: 'ВЕРХНИЕ ЭТАЖИ', task: 'Найди инструменты, чтобы починить лифт', obj: 'tools', ground: 99, dark: .9,

      for (const f of [46, 40, 34, 28, 22, 16]) B.room(1, f - 5, 58, f - 1);
      B.room(1, 4, 58, 9);
      B.lad(56, 40, 45); B.lad(3, 34, 39); B.lad(56, 28, 33); B.lad(3, 22, 27); B.lad(56, 16, 21); B.lad(3, 10, 15);
      B.win(10, 42); B.win(46, 42); B.win(35, 36); B.win(50, 24); B.win(12, 12); B.win(48, 12); B.win(20, 5); B.win(44, 5);
      // этаж 1
      B.fill(20, 44, 21, 45); B.deco('box', 20, 44, 21, 45); B.acid(34, 35, 46); B.crack(28, 43); B.lamp(15, 41); B.bug(44, 46, 'b');
      // этаж 2: кислотная лужа с полкой
      B.acid(20, 27, 40); B.plat(22, 25, 39); B.crack(10, 37); B.bug(40, 40); B.lamp(48, 35); B.bug(30, 40, 'c');
      // этаж 3: низкий потолок — ползком

      // этаж 6
      B.acid(30, 34, 16); B.plat(31, 33, 15); B.crack(45, 13); B.bug(20, 16, 'R'); B.lamp(25, 11); B.sign(6, 13, '^');
      // последний этаж: инструменты, выход к лифту
      B.item('tools', 30, 10); B.exit(55, 10, 'ЛИФТ'); B.lamp(30, 4); B.bug(36, 10, 'b'); B.bug(24, 10, 'c'); B.crack(40, 7);
      B.start(4, 46); B.save(53, 40); B.save(6, 34); B.save(6, 22); B.save(53, 16);
    } },
  { name: 'ГРУЗОВОЙ ЛИФТ', task: 'Почини лифт и продержись, пока он едет наверх', obj: 'lift', fix: 40, ground: 999, dark: .5, power: true,

    tips: ['встань в кабину: 40 секунд чиню лифт — отбивайся!', 'кабина открытая: жуки прыгают в неё из стен', 'стреляй и вверх: крестовина вверх + B'],

      for (let r = 98; r > 10; r -= 12) { B.deco('ldoor', 12, r - 3, 12, r - 1); B.deco('ldoor', 29, r - 3, 29, r - 1); B.lamp(r % 24 ? 14 : 27, r - 9); }

  { name: 'ЧЕРДАК', task: 'Перебей свиту носорога', obj: 'guards', ground: 15, dark: .9,

      B.acid(1, 148, 24); B.fill(0, 25, 149, 25);

      B.fill(54, 14, 75, 23); B.plat(58, 66, 10); B.lad(58, 10, 13); B.deco('tower', 59, 6, 66, 9);

      B.nest(40, 10); B.nest(63, 10); B.nest(85, 11);
      B.bug(20, 12); B.bug(45, 10, 'R'); B.bug(70, 14); B.bug(90, 11); B.bug(95, 11, 'R');

  // ===================== ЛЕС =====================
  { city: 1, name: 'МЕСТО КРУШЕНИЯ', task: 'Найди уцелевшую рацию', obj: 'radio', sky: true, day: true, ground: 18, dark: .9, art: 16,

    centerText([[CITY[L.city || 0], 10, '#8a8a9a', 46], [`${lvlN - cityStart(L.city || 0) + 1} из ${cityCount(L.city || 0)} · ${L.name}`, 20, '#ffd23f', 76], [L.task, 11, '#fff', 102],
      ...L.tips.map((t, i) => [t, 9, '#aab', 128 + i * 14]), [blink ? 'жми A или B' : '', 10, '#fff', 184]]);
  }
  if (state === 'over') centerText([['ТЫ ПОГИБ', 22, '#ff3b3b', 86], [`очки: ${score}`, 12, '#fff', 112], ['нажми — продолжить с сохранения', 10, '#ccc', 140]]);
  if (state === 'win') centerText([[`ПРОЙДЕНО: ${CITY[L.city || 0]}!`, 20, '#ffd23f', 76], ['дальше — к военным. продолжение следует…', 9, '#fff', 98],
    [`очки: ${score}   время: ${Math.floor(playT / 60)}:${String(Math.floor(playT % 60)).padStart(2, '0')}`, 12, '#fff', 122], ['нажми, чтобы выйти в меню', 10, '#ccc', 150]]);
}

// ===== Карта уровня целиком (для проверки) =====
window.__overview = (n, s = 4) => {
  const o = build(LEVELS[n]), c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = COLS * s; c.height = ROWS * s;
  const col = ['#5a6a8a', '#666', '#c9a', '#fd4', '#4f4', '#222', '#f44', '#99f', '#a60', '#38c', '#998', '#a3c', '#c96'];
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) { x.fillStyle = col[grid[cy][cx]]; x.fillRect(cx * s, cy * s, s, s); }
  const dot = (cx, cy, c, h = 1) => { x.fillStyle = c; x.fillRect(cx * s, (cy - h) * s, s, h * s); };
  o.saves.forEach(([a, b]) => dot(a, b, '#39f')); o.nests.forEach(([a, b]) => dot(a, b, '#a52')); o.bugs.forEach(([a, b, g]) => dot(a, b, g ? '#f80' : '#f0f'));
  o.items.forEach(([k, a, b]) => dot(a, b, '#ff0', 2)); o.cracks.forEach(([a, b]) => { x.fillStyle = '#f0f'; x.fillRect(a * s, b * s, s, s); });
  if (o.exit) dot(o.exit[0], o.exit[1], '#0f8', 2); dot(o.start[0], o.start[1], '#fff', 2); if (o.heli) dot(o.heli[0], o.heli[1], '#0ff', 2);
  return c.toDataURL();
};

// ===== Цикл: физика с фиксированным шагом =====
const QC = location.search.match(/[?&]city=(\d+)/), QL = +(location.search.match(/[?&]lvl=(\d+)/)?.[1] || 1);
const START = clamp((QC ? cityStart(+QC[1] - 1) : 0) + QL - 1, 0, LEVELS.length - 1);   // ?city=2&lvl=3 — сразу в подуровень
resetGear(START); startLevel(START); setState('title');
const SIM = +(location.search.match(/[?&]speed=(\d+)/)?.[1] || 1);   // ускорение для проверок
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000) * SIM; last = now;
  while (acc >= 1 / 60) { window.__botTick?.(); update(1 / 60); acc -= 1 / 60; }
  if (!badOn('lag') || fN++ % 7 === 0) draw();      // баг: лаг — картинка дёргается
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__lvl = tile;
window.__gear = { get wpn() { return wpn; }, set wpn(v) { wpn = v; }, get ammo() { return ammo; }, get owned() { return owned; }, get energy() { return energy; }, set energy(v) { energy = v; },
  get good() { return good; }, get bad() { return bad; }, get blasts() { return blasts; }, get bullets() { return bullets; }, startGood, startBad(k) { bad = { k, warn: 1, t: BAD[k].d }; } };
window.__game = { get P() { return P; }, get state() { return state; }, get cam() { return cam; }, get camY() { return camY; }, get boss() { return boss; },
  get enemies() { return enemies; }, get lvl() { return lvlN; }, get done() { return done; }, get exit() { return exit; }, get items() { return items; },
  get heli() { return heli; }, get L() { return L; }, get lv() { return lv; }, get lift() { return lift; }, get cart() { return cart; }, get swarm() { return swarm; }, get rocks() { return rocks; }, get ebullets() { return ebullets; }, get movers() { return movers; },
  startLevel, setState, T, cityStart };
</script>
