  olx.setTransform(1, 0, 0, 1, 0, 0); olx.clearRect(0, 0, OL.width, OL.height); olx.setTransform(t);

}

addEventListener('resize', resize); resize();

// 0 воздух (улица), 1 стена/пол, 2 перекрытие (запрыгнуть снизу), 3 лестница, 4 кислота,

let grid, COLS = 10, ROWS = 10, MAPW = 160, MAPH = 160;
const tile = (cx, cy) => (cx < 0 || cx >= COLS || cy >= ROWS ? SOLID : cy < 0 ? AIR : grid[cy][cx]);

function slopeY(cx, cy, px) { const lx = clamp(px - cx * T, 0, T); return cy * T + (tile(cx, cy) === SLR ? T - lx : lx); }   // высота поверхности наклона
const inSlope = (px, py) => { const cx = Math.floor(px / T), cy = Math.floor(py / T); return isSlope(tile(cx, cy)) && py >= slopeY(cx, cy, px); };
const underSlope = (cx, cy) => isSlope(tile(cx, cy - 1));                 // твёрдая клетка под наклоном — её роль играет сам наклон
const open = t => t === AIR || t === BG || t === LAD || t === VENT || t === WATER;          // сквозь это видно и можно пройти

// ===== Меню разработки: выбор уровня и бессмертие (пока делаем игру) =====
let menuOpen = false, IMMORTAL = false;
try { IMMORTAL = localStorage.getItem('strel-god') === '1'; } catch (e) {}
const menuEl = document.getElementById('menu'), mBtn = document.getElementById('m'), godBtn = document.getElementById('god');
function godLabel() { godBtn.textContent = `БЕССМЕРТИЕ: ${IMMORTAL ? 'ВКЛ' : 'ВЫКЛ'}`; godBtn.classList.toggle('on', IMMORTAL); }
function openMenu(on) {
  menuOpen = on; menuEl.style.display = on ? 'block' : 'none'; releaseAll();
  if (!on) return;
  const box = document.getElementById('lvls'); box.innerHTML = '';
  CITY.forEach((name, c) => {
    const h = document.createElement('h3'); h.textContent = name; box.appendChild(h);
    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);
    for (let i = 0; i < cityCount(c); i++) {
      const n = cityStart(c) + i, b = document.createElement('button');
      b.textContent = `${i + 1}. ${LEVELS[n].name}`; if (n === lvlN && state !== 'title') b.className = 'cur';
      b.onclick = () => { openMenu(false); score = 0; playT = 0; lives = 3; resetGear(n); startLevel(n); };
      row.appendChild(b);
    }
  });
  godLabel(); document.getElementById('back').style.display = state === 'play' ? '' : 'none';
}
for (const el of [menuEl, mBtn]) for (const t of ['pointerdown', 'pointerup', 'pointermove', 'touchstart', 'touchmove', 'touchend']) el.addEventListener(t, e => e.stopPropagation());   // мимо управления игрой
mBtn.onclick = () => openMenu(true);
document.getElementById('close').onclick = () => openMenu(false);
document.getElementById('back').onclick = () => {   // застрял — вернуться к последней дискете (друг, 11.11)
  openMenu(false); if (state !== 'play' || P.dead) return;
  respawn(); showToast('↩ вернулся к последней дискете', 1.8); beep(1500, 300, .2, 'square', .03);
};
godBtn.onclick = () => { IMMORTAL = !IMMORTAL; try { localStorage.setItem('strel-god', IMMORTAL ? '1' : '0'); } catch (e) {} godLabel(); };

// ===== Цикл: физика с фиксированным шагом =====
const QC = location.search.match(/[?&]city=(\d+)/), QL = +(location.search.match(/[?&]lvl=(\d+)/)?.[1] || 1);
const START = clamp((QC ? cityStart(+QC[1] - 1) : 0) + QL - 1, 0, LEVELS.length - 1);   // ?city=2&lvl=3 — сразу в подуровень
resetGear(START); startLevel(START); setState('title');
const SIM = +(location.search.match(/[?&]speed=(\d+)/)?.[1] || 1);   // ускорение для проверок
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000) * SIM; last = now;
  while (acc >= 1 / 60) { window.__botTick?.(); update(1 / 60); acc -= 1 / 60; }
  if (!badOn('lag') || fN++ % 7 === 0) draw();      // баг: лаг — картинка дёргается
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__lvl = tile;
window.__gear = { get wpn() { return wpn; }, set wpn(v) { wpn = v; }, get ammo() { return ammo; }, get owned() { return owned; }, get energy() { return energy; }, set energy(v) { energy = v; },
  get good() { return good; }, get bad() { return bad; }, get blasts() { return blasts; }, get bullets() { return bullets; }, startGood, startBad(k) { bad = { k, warn: 1, t: BAD[k].d }; } };
window.__game = { get P() { return P; }, get state() { return state; }, get cam() { return cam; }, get camY() { return camY; }, get boss() { return boss; },
  get enemies() { return enemies; }, get lvl() { return lvlN; }, get done() { return done; }, get exit() { return exit; }, get items() { return items; },
  get heli() { return heli; }, get L() { return L; }, get allies() { return allies; }, get infected() { return infected; }, target: () => target(), ambEnd() { startAmbush(); amb.t = .01; }, get lv() { return lv; }, get lift() { return lift; }, get cart() { return cart; }, get swarm() { return swarm; }, get rocks() { return rocks; }, get ebullets() { return ebullets; }, get movers() { return movers; },
  startLevel, setState, T, cityStart, stageOn, get stg() { return stg; } };
</script>
