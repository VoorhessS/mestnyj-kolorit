<style>

  #g.full { background: #9b3dff; opacity: .85; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.1); } }
  .lbl { position: absolute; left: 0; right: 0; top: 74px; font: 600 11px system-ui, sans-serif; color: #fff; opacity: .9; }
  /* Меню разработки: выбор уровня и бессмертие */
  #m { position: fixed; top: calc(env(safe-area-inset-top) + 40px); right: calc(env(safe-area-inset-right) + 10px); width: 40px; height: 32px;
    border-radius: 8px; background: #2a2a34; border: 2px solid #555; color: #fff; font: bold 18px/28px system-ui, sans-serif; text-align: center; opacity: .55; }

    justify-content: center; flex-direction: column; font: 600 20px system-ui, sans-serif; text-align: center; gap: 14px; }
  #port .ic { font-size: 54px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 50% { transform: rotate(90deg); } }

<script>
'use strict';
// ===== Экран: высота фиксирована, ширина по пропорциям телефона =====
const T = 16, H = 14 * T;
let W = 400;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const port = document.getElementById('port');
const HORROR = !/[?&]light=1/.test(location.search);   // ?light=1 — без темноты
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
function resize() {
  W = Math.max(300, Math.min(520, Math.round(H * innerWidth / innerHeight)));
  cv.width = W; cv.height = H; dark.width = W; dark.height = H;
  ctx.imageSmoothingEnabled = false;
  port.style.display = innerHeight > innerWidth ? 'flex' : 'none';
}
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// ===== Клетки карты =====
// 0 воздух (улица), 1 стена/пол, 2 перекрытие (запрыгнуть снизу), 3 лестница, 4 кислота,
// 5 комната (стена на фоне), 6 запертая дверь, 7 решётка, 8 лаз (проход внутри стены)
// 9 вода (плывёшь, течение сносит), 10 валун (твёрдый, разбивается камнем богомола)
const AIR = 0, SOLID = 1, PLAT = 2, LAD = 3, ACID = 4, BG = 5, DOOR = 6, GRATE = 7, VENT = 8, WATER = 9, ROCK = 10, STICKY = 11, CRUMBLE = 12;
let grid, COLS = 10, ROWS = 10, MAPW = 160, MAPH = 160;
const tile = (cx, cy) => (cx < 0 || cx >= COLS || cy >= ROWS ? SOLID : cy < 0 ? AIR : grid[cy][cx]);
const ROCK_HP = 6; let rockHit = {}, crumb = new Map();   // crumb — осыпающийся пол: ключ клетки → таймеры            // сколько пуль выдерживает валун
const isSolid = t => t === SOLID || t === DOOR || t === GRATE || t === ROCK || t === STICKY || t === CRUMBLE;
const solid = (cx, cy) => isSolid(tile(cx, cy));
const open = t => t === AIR || t === BG || t === LAD || t === VENT || t === WATER;          // сквозь это видно и можно пройти
const oneWay = (t, cx, cy) => t === PLAT || (t === LAD && tile(cx, cy - 1) !== LAD);   // верх лестницы — как пол

// ===== Подуровни города N1 =====
// Координаты в клетках. Предмет стоит на клетке-полу (x, y).
const PAL = {
  street: { bg: '#17161b', bg2: '#1f1e24', pat: 'block', solid: '#4a3a36', floor: '#77767e', road: '#3c3c44', earth: '#26242a' },
  lobby: { bg: '#18221c', bg2: '#121a15', pat: 'paint', solid: '#2a2a2c', floor: '#5a5048' },
  flat: { bg: '#221a1e', bg2: '#2a2026', pat: 'paper', solid: '#2c2628', floor: '#6a5038' },
  upper: { bg: '#1c1a22', bg2: '#24212c', pat: 'paint', solid: '#29262e', floor: '#4e4a56' },
  attic: { bg: '#24190f', bg2: '#1a1209', pat: 'wood', solid: '#2e2216', floor: '#6a4a2a' },
  roof: { bg: '#17161b', bg2: '#1f1e24', pat: 'block', solid: '#4a3834', floor: '#77706a', road: '#3c3c44', earth: '#26242a' },
  shaft: { bg: '#1e2024', bg2: '#26292e', pat: 'block', solid: '#2e3036', floor: '#5a5e66' },
  forest: { forest: 1, bg: '#1c150e', bg2: '#2a2014', pat: 'root', solid: '#3a2a1a', floor: '#4a8a2a', road: '#3a2a1a', earth: '#2a1e12' },
  nora: { forest: 1, nora: 1, bg: '#140f16', bg2: '#1e1722', pat: 'root', solid: '#2a1f26', floor: '#3a3048', floor2: '#231b2c', blade: '#6a58a8', deep: '#1c141a', road: '#2a1f26', earth: '#1c141a' },
  tunnel: { lab: 1, bg: '#16171a', bg2: '#1e2024', pat: 'block', solid: '#34353a', floor: '#5e5f64' },
  lab: { lab: 1, bg: '#151b1d', bg2: '#1c2427', pat: 'tile', solid: '#283034', floor: '#56666a' },
};
const LEVELS = [
  { name: 'УЛИЦА', task: 'Доберись до дома в конце улицы', obj: 'reach', sky: true, day: true, ground: 16, dark: .9,
    cols: 170, rows: 26, base: AIR, pal: PAL.street, spawn: ['r', 'r', 'm'],
    tips: ['на улице день, а в подвале света нет', 'завал поверху не перелезть — ищи спуск в подвал', 'лестница: встань у неё и жми вверх или вниз'],
    build(B) {
      B.fill(0, 16, 169, 25);
      B.car(20, 24, 15); B.car(38, 41, 15); B.fill(53, 15, 54, 15); B.deco('box', 53, 15, 54, 15); B.bus(55, 64, 15);
      B.fill(68, 7, 79, 7); B.fill(68, 7, 68, 12); B.room(69, 8, 79, 15);            // магазин
      B.deco('sign', 70, 9, 77, 10);
      B.fill(80, 3, 85, 15); B.deco('rubble', 80, 3, 85, 15);                       // завал перекрыл улицу
      B.room(70, 17, 100, 22); B.lad(76, 16, 22); B.lad(98, 16, 22);               // подвал магазина
      B.acid(86, 88, 23); B.sign(73, 19, '>'); B.sign(92, 19, '>'); B.sign(97, 18, '^'); B.lamp(84, 17);
      B.nest(91, 23); B.bug(81, 23);
      B.car(110, 113, 15); B.fill(125, 13, 126, 15); B.deco('box', 125, 13, 126, 15); B.car(136, 139, 15);
      B.fill(155, 2, 168, 13); B.room(156, 14, 168, 15); B.exit(160, 16, 'ПОДЪЕЗД');  // дом
      B.lamp(34, 9, true); B.lamp(108, 9, true); B.lamp(146, 9, true);
      B.fill(44, 3, 49, 15); B.room(44, 13, 49, 15); B.shaft(46, 3, 12); B.item('life', 44, 3); B.sign(46, 12, '^');   // дом с вентшахтой: секрет на крыше
      B.nest(30, 16); B.bug(53, 16); B.nest(118, 16); B.bug(150, 16);
      B.bug(104, 16, 'm'); B.bug(105, 16, 'm'); B.bug(106, 16, 'm'); B.bug(132, 16, 'm'); B.bug(133, 16, 'm');
      B.start(4, 16); B.save(101, 16);
    } },
  { name: 'ПОДЪЕЗД', task: 'Найди ключ от двери на лестницу', obj: 'key', ground: 13, dark: .9,
    cols: 104, rows: 30, base: SOLID, pal: PAL.lobby, spawn: ['r', 'm', 'R'],
    tips: ['жуки перегрызли провода: светло только у окон', 'лаз в стене: зажми вниз и ползи вбок', 'берегись потолочников — падают сверху'],
    build(B) {
      B.room(1, 8, 70, 11); B.door(62, 8, 11); B.exit(67, 12, 'ЛЕСТНИЦА');
      B.win(5, 9); B.win(27, 9); B.win(47, 9);
      B.lamp(14, 8); B.lamp(40, 8); B.lamp(66, 8);
      B.room(4, 15, 96, 18); B.lad(20, 12, 18);                                    // подвал, верхний ярус
      B.fill(56, 15, 60, 17); B.deco('rubble', 56, 15, 60, 17); B.vent(56, 60, 18);
      B.acid(40, 41, 19); B.sign(51, 17, '>'); B.lamp(30, 15);
      B.room(4, 20, 100, 26); B.fill(39, 20, 42, 20); B.lad(92, 19, 26);            // нижний ярус, затоплен кислотой; потолок выше
      B.acid(50, 62, 27); B.plat(51, 54, 25); B.plat(56, 59, 25); B.plat(61, 62, 25);
      B.sign(66, 24, '<'); B.sign(12, 24, '<');
      B.room(3, 25, 3, 26); B.lad(2, 13, 26); B.door(2, 12, 12, LAD);              // шахта с люком в холл
      B.item('key', 40, 27);
      B.nest(30, 19); B.nest(75, 19); B.nest(20, 27);
      B.bug(70, 27); B.bug(30, 27, 'R'); B.bug(85, 19);
      B.bug(36, 12, 'c'); B.bug(46, 19, 'c'); B.bug(41, 27, 'c'); B.bug(80, 27, 'c');
      B.start(10, 12); B.save(88, 19); B.save(84, 27);
    } },
  { name: 'ВТОРОЙ ЭТАЖ', task: 'Уничтожь все гнёзда на этаже', obj: 'nests', ground: 99, dark: .9,
    cols: 140, rows: 22, base: SOLID, pal: PAL.flat, spawn: ['r', 'm', 'j'],
    tips: ['у окон светло, в коридоре темнота', 'пока живо хоть одно гнездо, дверь не откроется', 'щелкуны прыгают — стреляй, пока летят'],
    build(B) {
      B.room(1, 14, 59, 17); B.room(67, 14, 138, 17);                              // коридор, посередине обвал
      B.room(10, 8, 40, 11); B.room(50, 8, 85, 11); B.room(95, 8, 130, 11);         // квартиры
      B.win(16, 9); B.win(30, 9); B.win(58, 9); B.win(74, 9); B.win(104, 9); B.win(121, 9);
      B.vent(41, 49, 11); B.vent(86, 94, 11);
      B.lad(12, 12, 17); B.lad(52, 12, 17); B.lad(80, 12, 17); B.lad(97, 12, 17);
      B.acid(90, 91, 18); B.door(133, 14, 17); B.exit(136, 18, 'ВВЕРХ');
      B.sign(38, 10, '>'); B.sign(83, 10, '>'); B.sign(56, 16, '^');
      B.lamp(20, 14); B.lamp(75, 14); B.lamp(110, 14);
      B.nest(25, 18); B.nest(30, 12); B.nest(70, 12); B.nest(105, 18); B.nest(118, 12);
      B.bug(45, 18, 'j'); B.bug(62, 12); B.bug(100, 18, 'R'); B.bug(125, 12, 'j'); B.bug(36, 12);
      B.bug(18, 18, 'c'); B.bug(66, 12, 'c'); B.bug(115, 18, 'c');
      B.start(4, 18); B.save(75, 18); B.save(99, 12);
    } },
  { name: 'ВЕРХНИЕ ЭТАЖИ', task: 'Найди инструменты, чтобы починить лифт', obj: 'tools', ground: 99, dark: .9,
    cols: 60, rows: 48, base: SOLID, pal: PAL.upper, spawn: ['r', 'j', 'b', 'R', 'm'],
    tips: ['ящик с инструментами — на последнем этаже', 'бомбардир брызгает кислотой — не подходи близко', 'жуки лезут из трещин в стенах'],
    build(B) {
      for (const f of [46, 40, 34, 28, 22, 16]) B.room(1, f - 5, 58, f - 1);
      B.room(1, 4, 58, 9);
      B.lad(56, 40, 45); B.lad(3, 34, 39); B.lad(56, 28, 33); B.lad(3, 22, 27); B.lad(56, 16, 21); B.lad(3, 10, 15);
      B.win(10, 42); B.win(46, 42); B.win(35, 36); B.win(50, 24); B.win(12, 12); B.win(48, 12); B.win(20, 5); B.win(44, 5);
      // этаж 1
      B.fill(20, 44, 21, 45); B.deco('box', 20, 44, 21, 45); B.acid(34, 35, 46); B.crack(28, 43); B.lamp(15, 41); B.bug(44, 46, 'b');
      // этаж 2: кислотная лужа с полкой
      B.acid(20, 27, 40); B.plat(22, 25, 39); B.crack(10, 37); B.bug(40, 40); B.lamp(48, 35); B.bug(30, 40, 'c');
      // этаж 3: низкий потолок — ползком
      B.fill(25, 29, 32, 32); B.deco('rubble', 25, 29, 32, 32); B.vent(25, 32, 33); B.nest(45, 34); B.lamp(40, 29); B.sign(22, 32, '>');
      B.bug(50, 34, 'c');
      // этаж 4
      B.fill(40, 26, 41, 27); B.deco('box', 40, 26, 41, 27); B.fill(20, 25, 22, 27); B.deco('box', 20, 25, 22, 27);
      B.bug(30, 28, 'R'); B.crack(48, 25); B.acid(10, 11, 28);
      // этаж 5: ни окон, ни света, только указатели
      B.sign(20, 19, '>'); B.sign(40, 19, '>'); B.sign(54, 19, '^'); B.bug(25, 22, 'b'); B.bug(35, 22, 'j'); B.nest(50, 22); B.crack(15, 19);
      // этаж 6
      B.acid(30, 34, 16); B.plat(31, 33, 15); B.crack(45, 13); B.bug(20, 16, 'R'); B.lamp(25, 11); B.sign(6, 13, '^');
      // последний этаж: инструменты, выход к лифту
      B.item('tools', 30, 10); B.exit(55, 10, 'ЛИФТ'); B.lamp(30, 4); B.bug(36, 10, 'b'); B.bug(24, 10, 'c'); B.crack(40, 7);
      B.start(4, 46); B.save(53, 40); B.save(6, 34); B.save(6, 22); B.save(53, 16);
    } },
  { name: 'ГРУЗОВОЙ ЛИФТ', task: 'Почини лифт и продержись, пока он едет наверх', obj: 'lift', fix: 40, ground: 999, dark: .5, power: true,
    cols: 42, rows: 112, base: SOLID, pal: PAL.shaft, spawn: ['r', 'm', 'j', 'b', 'R'], crackCd: 1.2, crackN: 2, crackRange: 110,
    tips: ['встань в кабину: 40 секунд чиню лифт — отбивайся!', 'кабина открытая: жуки прыгают в неё из стен', 'стреляй и вверх: крестовина вверх + B'],
    build(B) {
      B.room(1, 103, 28, 108);                                                     // машинный зал и низ шахты
      B.room(13, 3, 28, 102);                                                      // шахта
      B.room(29, 3, 38, 6); B.exit(36, 7, 'ЧЕРДАК');                               // выход наверху
      B.lift(13, 28, 109, 7);
      for (let r = 98; r > 10; r -= 12) { B.deco('ldoor', 12, r - 3, 12, r - 1); B.deco('ldoor', 29, r - 3, 29, r - 1); B.lamp(r % 24 ? 14 : 27, r - 9); }
      for (let r = 99, i = 0; r >= 12; r -= 7, i++) B.crack(i % 2 ? 28 : 13, r);
      B.lamp(5, 103); B.lamp(20, 103); B.sign(10, 105, '>');
      B.start(4, 109);
    } },
  { name: 'ЧЕРДАК', task: 'Перебей свиту носорога', obj: 'guards', ground: 15, dark: .9,
    cols: 130, rows: 22, base: SOLID, pal: PAL.attic, spawn: ['r', 'R', 'j', 'b', 'm'],
    tips: ['свита — охрана носорога: щит спереди, рывок, плевок', 'бей стража, когда он оглушён после рывка, или сзади', 'перебей свиту — откроется люк на крышу'],
    build(B) {
      B.room(1, 9, 128, 13); B.door(9, 9, 13); B.exit(5, 14, 'КРЫША');
      B.win(17, 10); B.win(91, 10); B.win(117, 10);
      B.fill(30, 9, 40, 12); B.deco('beam', 30, 9, 40, 12); B.vent(30, 40, 13);
      B.fill(55, 9, 62, 13); B.deco('rubble', 55, 9, 62, 13);
      B.room(42, 15, 68, 18); B.lad(49, 14, 18); B.lad(66, 14, 18);               // обход завала через квартиру под чердаком
      B.fill(72, 9, 86, 12); B.deco('beam', 72, 9, 86, 12); B.vent(72, 86, 13);
      B.plat(100, 104, 11); B.plat(108, 112, 11);
      B.sign(28, 12, '>'); B.sign(46, 16, '>'); B.sign(70, 12, '>'); B.sign(115, 11, '<'); B.sign(88, 11, '<'); B.sign(20, 11, '<');
      B.lamp(20, 9); B.lamp(100, 9); B.lamp(58, 15);
      B.bug(97, 14, 's'); B.bug(112, 14, 's'); B.bug(123, 14, 's');
      B.nest(55, 19); B.nest(95, 14); B.bug(45, 19); B.bug(64, 14, 'b'); B.bug(52, 19, 'c'); B.bug(25, 14, 'c'); B.bug(106, 14, 'j');
      B.crack(110, 11); B.crack(60, 16); B.crack(47, 11);
      B.start(13, 14); B.save(66, 14); B.save(90, 14);
    } },
  { name: 'КРЫША', task: 'Убей жука-носорога и улетай', obj: 'boss', sky: true, day: true, ground: 24, dark: .9,
    cols: 150, rows: 26, base: AIR, pal: PAL.roof, spawn: ['r', 'R'],
    tips: ['прыгай с крыши на крышу, внизу кислота', 'носорог таранит — перепрыгивай его'],

  drawPlayer();
  if (fume) drawFume();
  drawWater(); drawFore();
  if (swarm) drawSwarm();
  drawVents();
  for (const b of bullets) {
    const x = b.x - cam;
    if (b.ghost) { rect(x + 1, b.y, 4, 4, '#0ff'); rect(x, b.y, 4, 4, '#f0f'); }
    else if (b.k === 'gren') { rect(x, b.y, 5, 5, '#5a7a2a'); rect(x + 1, b.y + 1, 2, 2, Math.floor(time * 10) % 2 ? '#ff3b3b' : '#9be22d'); }
    else if (b.k === 'rifle') { ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 2, b.y + 2); ctx.lineTo(x + 2 - b.vx * .02, b.y + 2 - b.vy * .02); ctx.stroke(); }
    else if (b.k === 'pel') rect(x, b.y, 3, 3, '#ffd8a0');
    else if (b.k === 'cl') rect(x, b.y, 4, 4, '#7fe8ff');
    else rect(x, b.y, 4, 4, '#fff');
  }
  for (const b of blasts) { ctx.strokeStyle = `rgba(255,210,63,${Math.min(1, b.t * 3)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x - cam, b.y, 42 * (1 - b.t / .35) + 6, 0, 7); ctx.stroke(); }
  for (const p of parts) rect(p.x - cam, p.y, 3, 3, p.col);
  ctx.restore();
  if (HORROR) drawDark();
  if (L.alarm && state === 'play') { ctx.fillStyle = `rgba(255,20,20,${.06 + .06 * Math.sin(time * 5)})`; ctx.fillRect(0, 0, W, H); }   // тревога: красная мигалка
  ctx.save(); ctx.translate(0, -Math.round(camY)); drawSigns(); if (HORROR) drawEyes(); ctx.restore();
  drawHud();
  if (state === 'play' && ((bad && bad.warn > 0) || roul > 0 || (bad && Math.random() < .1) || (good && Math.random() < .06))) {   // помехи на экране
    for (let i = 0; i < 14; i++) { ctx.globalAlpha = Math.random() * .7; ctx.fillStyle = pick(['#f0f', '#0ff', '#fff', '#0f0']); ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 3); }
    if (bad && bad.warn > 0) { const y = Math.random() * H, h = 6 + Math.random() * 20; ctx.globalAlpha = 1; ctx.drawImage(cv, 0, y, W, h, rnd(-12, 12), y, W, h); }
    ctx.globalAlpha = 1;
  }
  if (state === 'card') {
    const blink = Math.floor(time * 2) % 2;
    centerText([[CITY[L.city || 0], 10, '#8a8a9a', 46], [`${lvlN - cityStart(L.city || 0) + 1} из ${cityCount(L.city || 0)} · ${L.name}`, 20, '#ffd23f', 76], [L.task, 11, '#fff', 102],
      ...L.tips.map((t, i) => [t, 9, '#aab', 128 + i * 14]), [blink ? 'жми A или B' : '', 10, '#fff', 184]]);
  }
  if (state === 'over') centerText([['ТЫ ПОГИБ', 22, '#ff3b3b', 86], [`очки: ${score}`, 12, '#fff', 112], ['нажми — продолжить с сохранения', 10, '#ccc', 140]]);
  if (state === 'win') centerText([[`ПРОЙДЕНО: ${CITY[L.city || 0]}!`, 20, '#ffd23f', 76], ['дальше — военная база. продолжение следует…', 9, '#fff', 98],
    [`очки: ${score}   время: ${Math.floor(playT / 60)}:${String(Math.floor(playT % 60)).padStart(2, '0')}`, 12, '#fff', 122], ['нажми, чтобы выйти в меню', 10, '#ccc', 150]]);
}

// ===== Карта уровня целиком (для проверки) =====
window.__overview = (n, s = 4) => {
  const o = build(LEVELS[n]), c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = COLS * s; c.height = ROWS * s;
  const col = ['#5a6a8a', '#666', '#c9a', '#fd4', '#4f4', '#222', '#f44', '#99f', '#a60', '#38c', '#998', '#a3c', '#c96'];
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) { x.fillStyle = col[grid[cy][cx]]; x.fillRect(cx * s, cy * s, s, s); }
  const dot = (cx, cy, c, h = 1) => { x.fillStyle = c; x.fillRect(cx * s, (cy - h) * s, s, h * s); };
  o.saves.forEach(([a, b]) => { x.fillStyle = '#ff0'; x.fillRect((a - 1) * s, (b - 3) * s, 3 * s, 3 * s); x.fillStyle = '#00f'; x.fillRect(a * s, (b - 2) * s, s, s); }); o.nests.forEach(([a, b]) => dot(a, b, '#a52')); o.bugs.forEach(([a, b, g]) => dot(a, b, g ? '#f80' : '#f0f'));
  o.items.forEach(([k, a, b]) => dot(a, b, '#ff0', 2)); o.cracks.forEach(([a, b]) => { x.fillStyle = '#f0f'; x.fillRect(a * s, b * s, s, s); });
  if (o.exit) dot(o.exit[0], o.exit[1], '#0f8', 2); dot(o.start[0], o.start[1], '#fff', 2); if (o.heli) dot(o.heli[0], o.heli[1], '#0ff', 2);
  return c.toDataURL();
};

// ===== Меню разработки: выбор уровня и бессмертие (пока делаем игру) =====
let menuOpen = false, IMMORTAL = false;
try { IMMORTAL = localStorage.getItem('strel-god') === '1'; } catch (e) {}
const menuEl = document.getElementById('menu'), mBtn = document.getElementById('m'), godBtn = document.getElementById('god');
function godLabel() { godBtn.textContent = `БЕССМЕРТИЕ: ${IMMORTAL ? 'ВКЛ' : 'ВЫКЛ'}`; godBtn.classList.toggle('on', IMMORTAL); }
function openMenu(on) {
  menuOpen = on; menuEl.style.display = on ? 'block' : 'none'; releaseAll();
  if (!on) return;
  const box = document.getElementById('lvls'); box.innerHTML = '';
  CITY.forEach((name, c) => {
    const h = document.createElement('h3'); h.textContent = name; box.appendChild(h);
    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);
    for (let i = 0; i < cityCount(c); i++) {
      const n = cityStart(c) + i, b = document.createElement('button');
      b.textContent = `${i + 1}. ${LEVELS[n].name}`; if (n === lvlN && state !== 'title') b.className = 'cur';
      b.onclick = () => { openMenu(false); score = 0; playT = 0; lives = 3; resetGear(n); startLevel(n); };
      row.appendChild(b);
    }
  });
  godLabel();
}
for (const el of [menuEl, mBtn]) for (const t of ['pointerdown', 'pointerup', 'pointermove', 'touchstart', 'touchmove', 'touchend']) el.addEventListener(t, e => e.stopPropagation());   // мимо управления игрой
mBtn.onclick = () => openMenu(true);
document.getElementById('close').onclick = () => openMenu(false);
godBtn.onclick = () => { IMMORTAL = !IMMORTAL; try { localStorage.setItem('strel-god', IMMORTAL ? '1' : '0'); } catch (e) {} godLabel(); };

// ===== Цикл: физика с фиксированным шагом =====
const QC = location.search.match(/[?&]city=(\d+)/), QL = +(location.search.match(/[?&]lvl=(\d+)/)?.[1] || 1);
const START = clamp((QC ? cityStart(+QC[1] - 1) : 0) + QL - 1, 0, LEVELS.length - 1);   // ?city=2&lvl=3 — сразу в подуровень
resetGear(START); startLevel(START); setState('title');
const SIM = +(location.search.match(/[?&]speed=(\d+)/)?.[1] || 1);   // ускорение для проверок
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000) * SIM; last = now;
  while (acc >= 1 / 60) { window.__botTick?.(); update(1 / 60); acc -= 1 / 60; }
  if (!badOn('lag') || fN++ % 7 === 0) draw();      // баг: лаг — картинка дёргается
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__lvl = tile;
window.__gear = { get wpn() { return wpn; }, set wpn(v) { wpn = v; }, get ammo() { return ammo; }, get owned() { return owned; }, get energy() { return energy; }, set energy(v) { energy = v; },
  get good() { return good; }, get bad() { return bad; }, get blasts() { return blasts; }, get bullets() { return bullets; }, startGood, startBad(k) { bad = { k, warn: 1, t: BAD[k].d }; } };
window.__game = { get P() { return P; }, get state() { return state; }, get cam() { return cam; }, get camY() { return camY; }, get boss() { return boss; },
  get enemies() { return enemies; }, get lvl() { return lvlN; }, get done() { return done; }, get exit() { return exit; }, get items() { return items; },
  get heli() { return heli; }, get L() { return L; }, get lv() { return lv; }, get lift() { return lift; }, get cart() { return cart; }, get swarm() { return swarm; }, get rocks() { return rocks; }, get ebullets() { return ebullets; }, get movers() { return movers; },
  startLevel, setState, T, cityStart };
</script>
