<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>Местный колорит</title>
<!-- Установка на экран «Домой»: иконка, имя, запуск без адресной строки -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Колорит">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --p0: #2f7dd1;      /* нижний игрок — синий */
    --p1: #d1453b;      /* верхний игрок — красный */
    --ink: #fff8ec;
    --pot: #3a3f47;
    --water: #8fc7e8;
    --win: #3fae5a;
    --lose: #4a4a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #2b1d14;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* Половины экрана: верхняя повёрнута, чтобы второй игрок читал со своей стороны */
  .half {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(21vmin + 12px) 16px 44px;
    transition: background .25s;
  }
  .half.p0 { background: var(--p0); }
  .half.p1 { background: var(--p1); transform: rotate(180deg); }
  .half.flash-win  { background: var(--win); }
  .half.flash-lose { background: var(--lose); }
  body.menu .half { padding-top: calc(13vmin + 8px); padding-bottom: 12px; }

  .hud {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    font-size: 15px;
    opacity: .9;
  }
  .hud .score { flex: 1; text-align: right; font-size: 20px; letter-spacing: 2px; }
  .hud .quit {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,.25);
    display: grid; place-items: center;
    font-size: 14px;
  }
  body.menu .hud { display: none; }

  .msg { width: 100%; text-align: center; line-height: 1.25; }
  .msg h1 { font-size: clamp(24px, 7vmin, 40px); margin-bottom: 6px; }
  .msg h2 { font-size: clamp(20px, 6vmin, 32px); margin-bottom: 4px; }
  .msg p  { font-size: clamp(15px, 4.2vmin, 20px); opacity: .95; }
  .msg .big { font-size: clamp(40px, 14vmin, 80px); line-height: 1; font-weight: 800; }

  /* Итог раунда: крупный вердикт и строки обоих игроков */
  .msg h1.verdict { letter-spacing: 1px; }
  .msg h1.verdict.v-lose { opacity: .8; }
  .res { width: min(88%, 320px); margin: 6px auto 8px; display: grid; gap: 5px; }
  .res div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-radius: 10px;
    background: rgba(0,0,0,.18); font-size: clamp(14px, 4vmin, 18px); text-align: left; }
  .res div.me { background: rgba(255,255,255,.22); }
  .res b { font-weight: 700; }
  .res div.won b::after { content: ' 🏆'; }
  body.skin-win98 .res div { background: #fff; border-radius: 0; box-shadow: var(--sunken); color: #000; }
  body.skin-win98 .res div.me { background: #ffffe1; }
  body:is(.skin-nokia, .skin-arcade) .res div { font-size: 10px; line-height: 1.5; padding: 6px 8px; }
  body.skin-nokia .res div { background: rgba(0,0,0,.08); border-radius: 0; border: 2px solid currentColor; }
  body.skin-nokia .res div.me { background: rgba(0,0,0,.18); }
  body.skin-arcade .res div { background: rgba(0,0,0,.35); border: 1px solid rgba(109,255,138,.5); color: #b8ffc6; }
  body.skin-arcade .res div.me { border-color: #6dff8a; color: #6dff8a; }
  body.skin-poster .res div { background: #f1e2c0; color: #2b2522; border-radius: 0; box-shadow: 3px 3px 0 #2b2522; }
  body.skin-poster .res div.me { background: #fff6dd; }
  /* Маленький экран: итог с рекордом и счётом должен влезть в половину */
  @media (max-height: 720px) {
    body .msg h1.verdict { font-size: 24px; margin-bottom: 2px; }
    body.skin-win98 .msg h1.verdict { font-size: 15px; margin-bottom: 4px; }
    .res { margin: 3px auto 4px; gap: 3px; }
    .res div { padding: 4px 10px; font-size: 14px; }
    body:is(.skin-nokia, .skin-arcade) .res div { padding: 4px 8px; }
  }

  .btn {
    display: inline-block;
    margin: 10px 4px 0;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(0,0,0,.25);
    font-size: 17px;
  }
  .btn.on { background: var(--win); }

  /* Меню выбора мини-игры */
  .modes { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .mode {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-radius: 14px;
    background: rgba(0,0,0,.22);
    text-align: left;
  }
  .mode:active { background: rgba(0,0,0,.4); }
  .mode .e { font-size: 28px; }
  .mode b { display: block; font-size: 17px; }
  .mode small { font-size: 13px; opacity: .85; }
  body.rules-open .half { padding: 12px 16px; }
  /* Большая кнопка игрока: засчитываются только нажатия на неё */
  .grab {
    width: min(82%, 320px);
    margin: 14px auto 0;
    padding: 18px 0;
    border-radius: 22px;
    background: rgba(0,0,0,.28);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.25);
    font-size: clamp(22px, 7vmin, 30px);
    font-weight: 800;
  }
  .grab:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .grab.hot { background: #ffd23f; color: #3a2400; animation: hot .35s infinite alternate; }
  .grab.done { opacity: .45; }
  .grab.held { background: #1d2747; color: #cfdcff; transform: translateY(3px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
  @keyframes hot { from { transform: scale(1); } to { transform: scale(1.05); } }
  .status { min-height: 64px; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 2px; }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; }
  .tools .btn { margin: 8px 3px 0; padding: 8px 12px; font-size: 15px; }
  .name-input {
    display: block;
    width: min(80%, 300px);
    margin: 10px auto 0;
    padding: 12px 14px;
    border: 0;
    border-radius: 14px;
    background: rgba(255,255,255,.92);
    color: #222;
    font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
  }
  /* На невысоких телефонах в меню остаются только эмодзи и названия */
  @media (max-height: 720px) {
    .modes.grid .mode small { display: none; }
    .modes.grid .mode { padding: 8px 6px; }
  }
  .pager .page { margin: 10px 6px 0; font-size: 15px; opacity: .85; }

  /* Две кнопки рядом */
  .row { display: flex; gap: 10px; width: min(92%, 360px); margin: 0 auto; }
  .row .grab { width: auto; flex: 1; margin-top: 12px; padding: 16px 0; font-size: clamp(17px, 5vmin, 22px); }

  /* Игры без картинки в центре: контент поднимаем к центру экрана */
  body.no-stage .half { padding-top: 14px; }

  /* --- Кто платит --- */
  .bill {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 16vmin;
    line-height: 1;
    /* Двигаем отдельным слоем через transform: при перерисовке через top айфон
       оставлял след чека под полосками «Автомата». */
    will-change: transform;
    transition: transform .35s ease-in-out;
  }

  /* --- Рыбалка --- */
  .pond {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #6fb6d8, #2e7aa3 70%);
    box-shadow: 0 0 0 6px #3d6b3a, 0 6px 24px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .ring {
    position: absolute; left: 50%; top: 50%;
    width: 20%; height: 20%;
    margin: -10% 0 0 -10%;
    border: 2px solid rgba(255,255,255,.5);
    border-radius: 50%;
    animation: ring 2.4s infinite ease-out;
  }
  @keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
  .float {
    position: absolute; left: 50%; top: 50%;
    width: 8vmin; height: 11vmin;
    margin: -5.5vmin 0 0 -4vmin;
    border-radius: 50% 50% 45% 45%;
    background: linear-gradient(#e8382d 52%, #fff 52%);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    transition: transform .12s, opacity .12s;
  }
  .float.twitch { transform: translateY(-1.4vmin) rotate(10deg); }
  .float.dip { transform: translateY(6vmin) scale(.65); opacity: .3; }

  /* --- Засолка --- */
  .track {
    position: relative;
    width: 86%;
    height: 34px;
    margin: 8px auto 0;
    border-radius: 17px;
    background: rgba(0,0,0,.28);
    overflow: hidden;
  }
  .track .zone { position: absolute; top: 0; bottom: 0; left: 42%; width: 16%; background: rgba(120,255,150,.55); }
  .track .dot { position: absolute; top: 4px; bottom: 4px; width: 26px; margin-left: -13px; border-radius: 13px; background: #fff; will-change: transform; }

  /* --- Перфоратор --- */
  .wins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(84%, 320px); margin: 6px auto 0; }
  .win {
    aspect-ratio: 1.5;
    border-radius: 10px;
    background: rgba(255,240,190,.9);
    display: grid; place-items: center;
    font-size: clamp(22px, 7vmin, 32px);
  }
  .win.drill { background: #ff8a3d; animation: shake .08s infinite alternate; }
  @keyframes shake { from { transform: translateX(-2px) rotate(-2deg); } to { transform: translateX(2px) rotate(2deg); } }
  .rules { text-align: left; margin-top: 4px; }
  .rules p { font-size: clamp(13px, 3.6vmin, 15px); margin-bottom: 5px; line-height: 1.3; }
  .modes.grid { display: grid; grid-template-columns: 1fr 1fr; }
  .modes.grid .mode { flex-direction: column; gap: 4px; padding: 10px 8px; text-align: center; }
  .modes.grid .mode b { font-size: 15px; }
  .modes.grid .mode small { display: block; font-size: 12px; line-height: 1.2; }

  /* Слой поверх половин; тапы проходят сквозь него */
  #stage, #arena { position: absolute; pointer-events: none; }
  #arena { inset: 0; z-index: 2; }
  #stage {
    left: 50%; top: 50%;
    width: 42vmin; height: 42vmin;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  body.menu #stage { width: 24vmin; height: 24vmin; }
  /* Без CSS-фильтров на эмодзи: iOS Safari рисует их чёрными прямоугольниками */
  .logo { font-size: 18vmin; line-height: 1; font-weight: 800; text-shadow: 0 4px 10px rgba(0,0,0,.35); }
  body.menu .logo { font-size: 14vmin; }

  /* --- Последний пельмень --- */
  .pot {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--pot);
    box-shadow: 0 0 0 6px #23262b, 0 6px 24px rgba(0,0,0,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .water {
    position: absolute; inset: 8%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #b9e1f5, var(--water) 60%, #5d9fc4);
  }
  .bubble {
    position: absolute;
    width: 8%; height: 8%;
    border-radius: 50%;
    background: rgba(255,255,255,.7);
    animation: bubble 1.2s infinite ease-in;
  }
  @keyframes bubble {
    0%   { transform: scale(.2); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .pelmen {
    position: relative;
    font-size: 20vmin;
    line-height: 1;
    transition: transform .25s ease-out, opacity .25s;
    transform: scale(.45);
    opacity: .25;
  }
  .pelmen.peek { transform: scale(.75); opacity: .55; }
  .pelmen.up   { transform: scale(1.15); opacity: 1; }
  .pelmen.gone { transform: scale(0); opacity: 0; }
  .steam {
    position: absolute;
    top: 4%;
    font-size: 8vmin;
    opacity: 0;
    transition: opacity .2s;
  }
  .pelmen.up ~ .steam { opacity: 1; animation: steam 1s infinite alternate; }
  @keyframes steam { from { transform: translateY(0); } to { transform: translateY(-1.5vmin); } }

  /* --- Битва за пульт --- */
  .remote {
    position: absolute;
    left: 50%; top: 50%;
    width: 15vmin; height: 34vmin;
    transform: translate(-50%, -50%);
    border-radius: 4vmin;
    background: linear-gradient(90deg, #2a2d33, #444952 50%, #2a2d33);
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-content: start;
    gap: 1.6vmin;
    padding: 3vmin 2.4vmin;
    will-change: transform;
    transition: top .08s linear;
  }
  .remote i { aspect-ratio: 1; border-radius: 50%; background: #6b717c; }
  .remote i.power { grid-column: 2; background: #e0453b; }
  .remote i.wide { grid-column: span 3; aspect-ratio: auto; height: 3vmin; border-radius: 2vmin; background: #5b8fd6; }

  /* --- Бабушкина добавка --- */
  .gauge {
    position: relative;
    width: 86%;
    height: 34px;
    margin: 12px auto 8px;
    border-radius: 17px;
    background: rgba(0,0,0,.28);
    overflow: hidden;
  }
  .gauge .zone { position: absolute; top: 0; bottom: 0; left: 72%; width: 8%; background: rgba(120,255,150,.45); }
  .gauge .mark { position: absolute; top: 0; bottom: 0; left: 80%; width: 3px; background: #fff; }
  .gauge .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: #ffcf70; }
  .gauge.over .fill { background: #7a3ce0; }
  .gauge .zone, .gauge .mark { z-index: 1; }

  /* --- Экран «как играть»: анимация с пальцем, правило, «Начать» --- */
  .demo { position: relative; width: min(86%, 320px); margin: 6px auto 4px; padding: 8px 10px 6px; border-radius: 16px; background: rgba(0,0,0,.18); }
  .demo-pic { position: relative; display: inline-block; height: 42px; font-size: 36px; line-height: 1.15; }
  .demo-bar { position: relative; height: 14px; margin: 4px auto 0; border-radius: 7px; background: rgba(0,0,0,.28); overflow: hidden; }
  .demo-bar b { position: absolute; top: 0; bottom: 0; background: rgba(120,255,150,.55); }
  .demo-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ffcf70; transition: width .6s; }
  .demo-bar s { position: absolute; top: 2px; bottom: 2px; width: 14px; margin-left: -7px; border-radius: 7px; background: #fff; transition: left .6s; }
  .demo .demo-btn { position: relative; display: inline-block; width: auto; margin: 8px auto 0; padding: 8px 18px; font-size: 16px; }
  .demo-cap { min-height: 2.6em; margin-top: 12px; font-size: 13px; line-height: 1.3; }
  .msg .demo-rule { font-size: 13px; line-height: 1.3; opacity: .85; }
  .msg .demo-progress { font-size: 12px; opacity: .8; }
  .go .btn { margin-top: 8px; }
  .demo.finger-btn .demo-btn::after, .demo.finger-pic .demo-pic::after {
    content: '👆'; position: absolute; right: -24px; bottom: -8px; font-size: 26px; line-height: 1;
    animation: press .5s ease-in-out infinite alternate;
  }
  .demo.act-rapid :is(.demo-btn, .demo-pic)::after { animation-duration: .12s; }
  .demo.act-hold .demo-btn::after { animation: none; transform: translateY(-4px); }
  @keyframes press { from { transform: translateY(8px); } to { transform: translateY(-4px); } }
  @media (max-height: 760px) {
    body.intro .half { padding-bottom: 36px; }
    body.intro .msg h2 { font-size: 20px; margin-bottom: 0; }
    .demo { margin: 4px auto 2px; padding: 4px 8px; }
    .demo-pic { height: 30px; font-size: 26px; }
    .demo-bar { height: 10px; }
    .demo .demo-btn { margin-top: 4px; padding: 6px 14px; font-size: 14px; }
    .demo-cap { margin-top: 6px; font-size: 12px; }
    .msg .demo-rule { font-size: 12px; line-height: 1.25; }
    .go .btn { margin-top: 4px; padding: 8px 18px; }
  }
  body.skin-win98 .demo { background: #fff; border-radius: 0; box-shadow: var(--sunken); }
  body.skin-nokia .demo { background: rgba(0,0,0,.06); border: 2px solid currentColor; border-radius: 0; }
  body:is(.skin-nokia, .skin-arcade) .demo-cap { font-size: 9px; line-height: 1.5; }
  body.skin-arcade .demo-cap { color: #b8ffc6; }
  body:is(.skin-nokia, .skin-arcade) .msg .demo-rule { font-size: 9px; line-height: 1.5; }

  /* Выбор стиля: карточки в строку — иконка слева, название справа */
  .modes.skins .mode { flex-direction: row; gap: 8px; padding: 8px 10px; text-align: left; }
  .modes.skins .mode .e { font-size: 24px; }

  /* Невысокие экраны (iPhone SE/8, Safari с панелями): меню компактное — логотип меньше, карточки в строку, без подписей */
  @media (max-height: 760px) {
    body.menu #stage { width: 16vmin; height: 16vmin; }
    body.menu .half { padding-top: calc(8vmin + 6px); }
    .msg h1 { font-size: 26px; }
    .modes { gap: 6px; margin-top: 6px; }
    .modes .mode small { display: none; }
    .modes.grid .mode { flex-direction: row; gap: 8px; padding: 6px 8px; text-align: left; }
    .modes.grid .mode .e { font-size: 22px; }
    .modes.grid .mode b { font-size: 14px; }
    .pager .btn, .tools .btn { margin-top: 6px; }
  }

  /* Логотип на стартовом экране — иконка игры */
  .logo-img { width: 100%; height: 100%; border-radius: 22%; box-shadow: 0 4px 14px rgba(0,0,0,.4); }

  /* ================= Скины =================
     Скин — класс skin-* на body, выбирается кнопкой «🎨 Стиль».
     Цвета игроков и вспышек меняем через переменные, чтобы вспышки победы работали в любом скине.
     Узоры на половинах — полупрозрачные, поверх цвета. */
  @font-face { font-family: 'Press Start 2P'; font-display: swap; src: url(fonts/pixel-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: 'Press Start 2P'; font-display: swap; src: url(fonts/pixel-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193; }
  @font-face { font-family: 'Ruslan Display'; font-display: swap; src: url(fonts/ruslan-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: 'Ruslan Display'; font-display: swap; src: url(fonts/ruslan-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'Rubik'; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-cyr.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: 'Rubik'; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }

  /* --- Windows 98: компьютерный класс, серые объёмные окна --- */
  body.skin-win98 {
    --p0: #3a6ea5; --p1: #8a2b2b; --win: #2e8b57; --lose: #555;
    --bevel: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    --sunken: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
    background: #008080;
    font-family: Tahoma, Verdana, "Segoe UI", sans-serif;
  }
  body.skin-win98 #app::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 8px; margin-top: -4px;
    background: #c0c0c0; box-shadow: var(--bevel); z-index: 1; pointer-events: none;
  }
  /* Сообщение каждого игрока — окно с синей (у красного — бордовой) полосой заголовка */
  body.skin-win98 .msg { background: #c0c0c0; color: #000; box-shadow: var(--bevel); padding: 3px 4px 10px; }

<body class="menu">
<div id="app">
  <div class="half p1" data-p="1">
    <div class="hud"><span class="name"></span><span class="score"></span><span class="quit">✕</span></div>
    <div class="msg"></div>
  </div>
  <div class="half p0" data-p="0">
    <div class="hud"><span class="name"></span><span class="score"></span><span class="quit">✕</span></div>
    <div class="msg"></div>
  </div>
  <div id="arena"></div>
  <div id="stage"></div>
</div>

<script>
// ---------- память телефона: имена и рекорды ----------
// В приватном режиме хранилище может быть недоступно — тогда просто не запоминаем.

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}

function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* не запомнили — не страшно */ }
}

// Язык: русский или английский. По умолчанию — по языку телефона, выбор запоминается.
// Переключение — кнопка на стартовом экране, после неё страница перезагружается.
let lang = load('kolorit-lang', /^ru|^uk|^be|^kk/i.test(navigator.language || '') ? 'ru' : 'en');
if (lang !== 'en') lang = 'ru';
function t(ru, en) { return lang === 'en' ? en : ru; }

// Название игры: в английской версии своё
const TITLE = t('Местный колорит', 'Babushka Battles');
document.documentElement.lang = lang;
document.title = TITLE;
document.querySelector('meta[name=apple-mobile-web-app-title]').content = t('Колорит', 'Babushka');

// ---------- реклама ----------
// Рекламу дают только площадки: Яндекс Игры и VK Mini Apps. Игра сама понимает, где
// запущена, и зовёт их SDK. На своём сайте рекламы нет; с ?ads=test вместо неё заглушка.
const ADS = {
  kind: null,  // 'yandex', 'vk', 'test' или null — рекламы нет
  sdk: null,
  GAP: 120000,  // между рекламами не меньше двух минут, отсчёт и от запуска игры
  lastAt: performance.now(),
  init() {
    const q = new URLSearchParams(location.search);
    if (q.get('ads') === 'test') this.kind = 'test';
    else if (q.has('vk_app_id')) this.kind = 'vk';
    else if (/(^|\.)(yandex\.(net|ru|com)|playhop\.com)$/.test(location.hostname)) this.kind = 'yandex';
    if (this.kind === 'vk') this.script('https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js', () => {
      this.sdk = window.vkBridge;
      this.sdk.send('VKWebAppInit');
    });
    // Яндекс отдаёт SDK со своего же сервера по этому адресу
    if (this.kind === 'yandex') this.script('/sdk.js', () => window.YaGames.init().then(sdk => {
      this.sdk = sdk;
      // Язык на Яндексе — как у игрока на площадке, пока он сам не переключил
      const want = /^(ru|be|kk|uk|uz)$/.test(sdk.environment?.i18n?.lang) ? 'ru' : 'en';
      if (localStorage.getItem('kolorit-lang') === null && want !== lang) {
        save('kolorit-lang', want);
        location.reload();
        return;
      }
      sdk.features.LoadingAPI?.ready();
    }));
  },
  script(src, onload) {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => { try { onload(); } catch { /* без SDK играем без рекламы */ } };
    document.head.append(s);
  },
  // Есть ли где взять рекламу за награду: без неё скины не закрываем
  get rewards() { return this.kind !== null; },
  // Яндекс просит отмечать, когда идёт сама игра, а когда меню и пауза
  playing(on) {
    if (this.kind === 'yandex') this.sdk?.features.GameplayAPI?.[on ? 'start' : 'stop']();
  },
  // Звук на время рекламы выключаем — этого требуют площадки
  busy: false,
  hush(on) {
    this.busy = on;
    if (on) { music.stop(); audio?.suspend(); } else if (soundMode && !document.hidden) audio?.resume();
  },
  // Реклама между матчами. Ответ приходит, когда её закрыли или если показывать не стали
  async between() {
    if (!this.kind || performance.now() - this.lastAt < this.GAP) return;
    if (this.kind !== 'test' && !this.sdk) return;
    this.lastAt = performance.now();
    this.hush(true);
    try { await this.show(false); } catch { /* не показалась — играем дальше */ }
    this.hush(false);
  },
  // Реклама за награду: true, если досмотрели до конца
  async reward() {
    if (!this.kind || (this.kind !== 'test' && !this.sdk)) return false;
    this.hush(true);
    let ok = false;
    try { ok = await this.show(true); } catch { ok = false; }
    this.hush(false);
    // После рекламы за награду обычную сразу не показываем
    this.lastAt = performance.now();
    return ok;
  },
  show(rewarded) {
    if (this.kind === 'test') return this.fake(rewarded);
    if (this.kind === 'vk') {
      return this.sdk.send('VKWebAppShowNativeAds', { ad_format: rewarded ? 'reward' : 'interstitial' })
        .then(data => Boolean(data && data.result));
    }
    return new Promise(done => {
      let got = false;
      const callbacks = {
        onRewarded: () => { got = true; },
        onClose: () => done(got),
        onError: () => done(false),
      };
      if (rewarded) this.sdk.adv.showRewardedVideo({ callbacks });
      else this.sdk.adv.showFullscreenAdv({ callbacks: { onClose: () => done(true), onError: () => done(false) } });
    });
  },
  // Заглушка для проверки: экран «тут будет реклама» с отсчётом
  fake(rewarded) {
    return new Promise(done => {
      const box = document.createElement('div');
      box.className = 'ad-fake';
      let left = rewarded ? 5 : 3;
      const draw = () => {
        const btn = left
          ? (rewarded ? `<span class="ad-btn" data-ad="skip">${t('Пропустить', 'Skip')} · ${left}</span>` : `<span class="ad-btn off">${left}</span>`)
          : `<span class="ad-btn" data-ad="${rewarded ? 'take' : 'close'}">${rewarded ? t('Забрать 🎁', 'Claim 🎁') : t('✕ Закрыть', '✕ Close')}</span>`;
        box.innerHTML = `<div><b>📺 ${t('Здесь будет реклама', 'An ad plays here')}</b>
          <small>${t('Тестовая заглушка: на Яндекс Играх и в VK тут покажут настоящую', 'Test stub: Yandex Games and VK show a real ad here')}</small>${btn}</div>`;
      };
      draw();
      document.body.append(box);
      const timer = setInterval(() => { left--; draw(); if (!left) clearInterval(timer); }, 1000);
      box.addEventListener('pointerdown', e => {
        e.preventDefault();
        const act = e.target.closest('[data-ad]')?.dataset.ad;
        if (!act) return;
        clearInterval(timer);
        box.remove();
        done(act === 'take');
      });
    });
  },
};
ADS.init();

const RU_NAMES = ['Синий', 'Красный'];
const EN_NAMES = ['Blue', 'Red'];
const DEFAULT_NAMES = t(RU_NAMES, EN_NAMES);
// Имена по умолчанию, сохранённые на другом языке, переводим вместе с игрой
const NAMES = load('kolorit-names', DEFAULT_NAMES).slice(0, 2)
  .map((n, i) => n === RU_NAMES[i] || n === EN_NAMES[i] ? DEFAULT_NAMES[i] : n);

// Скины: оформление меняется классом skin-* на body, выбор запоминается
const SKINS = [
  { id: 'classic', emoji: '🎨', title: t('Обычный', 'Classic'), sub: t('Как было', 'The original') },
  { id: 'win98', emoji: '💾', title: 'Windows 98', sub: t('Компьютерный класс 90-х', '90s school computer lab') },
  { id: 'nokia', emoji: '🐍', title: t('Нокиа', 'Nokia'), sub: t('Кнопочный телефон 00-х', '2000s brick phone') },
  { id: 'poster', emoji: '🪆', title: t('Плакат', 'Poster'), sub: t('Советская игрушка', 'Soviet toy box') },
  { id: 'arcade', emoji: '🕹️', title: t('Автомат', 'Arcade'), sub: t('Игровой зал 80-х', '80s game hall') },
];

function applySkin(id) {
  const skin = SKINS.find(s => s.id === id) || SKINS[0];
  for (const s of SKINS) document.body.classList.toggle(`skin-${s.id}`, s.id === skin.id && s.id !== 'classic');
  save('kolorit-skin', skin.id);
  return skin.id;
}

// Там, где есть реклама, стили кроме обычного открываются за просмотр — один раз и навсегда
const unlocked = new Set(load('kolorit-unlocked', ['classic']));
const isLocked = id => ADS.rewards && !unlocked.has(id);

let currentSkin = applySkin(isLocked(load('kolorit-skin', 'classic')) ? 'classic' : load('kolorit-skin', 'classic'));

const halves = [...document.querySelectorAll('.half')].sort((a, b) => a.dataset.p - b.dataset.p);
const stage = document.getElementById('stage');
const arena = document.getElementById('arena');

const state = {
  mode: null,
  wins: [0, 0],
  round: 0,
  game: null,       // мини-игра текущего раунда
  queue: [],        // порядок игр в турнире
  newRec: [null, null],
  onTap: null,      // обработчик тапа текущего экрана: (игрок, элемент) => void
  timers: [],
  frame: 0,
};

// ---------- помощники ----------

function say(html, p) {
  const targets = p === undefined ? [0, 1] : [p];
  for (const i of targets) halves[i].querySelector('.msg').innerHTML = html;
}

function sayEach(fn) { say(fn(0), 0); say(fn(1), 1); }

// Рекорд с единицей: «7 шт», по-английски «1 bag», «7 bags»
function recText(rec, value) { return `${value}${value === 1 && rec.one ? rec.one : rec.unit}`; }

// Игра сообщает результат игрока; если он лучше сохранённого — это новый рекорд
function noteRecord(p, value) {
  const mode = MODES.find(m => m.game === state.game);
  if (!mode?.rec) return;
  const all = load('kolorit-records', {});
  const cur = all[mode.id];
  const better = !cur || (mode.rec.lower ? value < cur.value : value > cur.value);
  if (!better) return;
  all[mode.id] = { value, name: NAMES[p] };
  save('kolorit-records', all);
  state.newRec[p] = recText(mode.rec, value);
}

// Экран с большой кнопкой: строка статуса сверху, кнопка снизу
function grabUI(label) { return `<div class="status"></div><div class="grab">${label}</div>`; }

function setStatus(html, p) {
  const targets = p === undefined ? [0, 1] : [p];
  for (const i of targets) $p(i, '.status').innerHTML = html;
}

function $p(p, sel) { return halves[p].querySelector(sel); }

function updateHud() {
  for (const p of [0, 1]) {
    $p(p, '.name').textContent = NAMES[p];
    $p(p, '.score').textContent = '⭐'.repeat(state.wins[p]) || '—';
  }
}

function later(ms, fn) { state.timers.push(setTimeout(fn, ms)); }

function stopAll() {
  state.timers.forEach(clearTimeout);
  state.timers = [];
  cancelAnimationFrame(state.frame);
  state.onTap = null;
  state.onRelease = null;
}

function flash(p, kind) {
  halves[p].classList.add('flash-' + kind);
  later(900, () => halves[p].classList.remove('flash-' + kind));
}

function flashResult(winner) {
  if (winner === null) return;
  flash(winner, 'win');
  flash(1 - winner, 'lose');
}

// ---------- звук: всё синтезируется на лету, как в старых приставках, без файлов ----------

// Режим звука: 2 — эффекты и музыка, 1 — только эффекты, 0 — тишина
let soundMode = load('kolorit-sound', 2);
const SOUND_ICONS = ['🔇', '🔈', '🔊'];
let audio = null;

// Звук на телефоне можно включить только после касания экрана
function audioCtx() {
  if (!audio) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audio = new Ctx();
  }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

// Тембр эффектов под стиль: у Windows мягко, у Нокиа всё пищит, у Плаката — медь
const VOICES = {
  win98: { square: 'sine', sawtooth: 'triangle', vol: 1.5 },
  nokia: { triangle: 'square', sawtooth: 'square', pitch: 2 },
  poster: { square: 'sawtooth', vol: .7 },
};

// Одна нота: частота, длительность, форма волны, громкость, через сколько секунд начать.
// raw — без подстройки под стиль (мелодии уже написаны под свой стиль)
function tone(freq, dur, type = 'square', vol = .12, at = 0, slide = 0, raw = false) {
  const ctx = audioCtx();
  if (!ctx) return;
  const voice = !raw && VOICES[currentSkin];
  if (voice) {
    type = voice[type] || type;
    vol *= voice.vol || 1;
    if (voice.pitch) { freq *= voice.pitch; slide *= voice.pitch; }
  }
  const t = ctx.currentTime + at;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + dur + .02);
}

const NOTE = n => 440 * 2 ** ((n - 69) / 12);  // номер MIDI-ноты → герцы
const SFX = {
  tick: () => tone(1400, .03, 'square', .05),
  tap: () => tone(880, .05, 'square', .08),
  hit: () => { tone(660, .05); tone(990, .07, 'square', .1, .05); },
  alert: () => tone(520, .15, 'triangle', .2, 0, 780),
  go: () => { tone(784, .08, 'square', .14); tone(1175, .18, 'square', .14, .08); },
  good: () => [72, 76, 79, 84].forEach((n, i) => tone(NOTE(n), .09, 'square', .1, i * .06)),
  bad: () => tone(220, .35, 'sawtooth', .12, 0, 90),
  pop: () => { tone(160, .2, 'sawtooth', .15, 0, 50); tone(2000, .05, 'square', .06); },
  beep: () => tone(660, .12, 'square', .1),
  start: () => tone(1320, .3, 'square', .12),
  round: () => [67, 72, 76, 79].forEach((n, i) => tone(NOTE(n), .14, 'triangle', .22, i * .09)),
  draw: () => [67, 64].forEach((n, i) => tone(NOTE(n), .2, 'triangle', .2, i * .16)),
  fanfare: () => [60, 64, 67, 72, 67, 72].forEach((n, i) => tone(NOTE(n), i === 5 ? .5 : .13, 'square', .11, i * .12)),
};
function sfx(name) { if (soundMode > 0 && SFX[name]) SFX[name](); }

// Фоновые мелодии меню, у каждого стиля своя. Восемь тактов по кругу.
// Ноты MIDI, 0 — пауза, шаг — восьмая; басовая нота звучит раз в bassEvery восьмых.
const TUNES = {
  classic: {
    bpm: 132, lead: [76, 0, 79, 76, 74, 0, 72, 0,  74, 0, 76, 0, 67, 0, 0, 0,
                     69, 0, 72, 69, 67, 0, 64, 0,  67, 0, 69, 72, 74, 0, 0, 0,
                     76, 0, 79, 81, 79, 0, 76, 0,  74, 76, 74, 72, 69, 0, 0, 0,
                     72, 0, 74, 76, 79, 0, 76, 74, 72, 0, 0, 0, 0, 0, 0, 0],
    bass: [48, 43, 41, 48, 45, 40, 43, 50, 48, 43, 41, 43, 45, 41, 43, 48], bassEvery: 4,
  },
  // Windows 98: неторопливые мягкие «системные» переливы
  win98: {
    bpm: 100, leadWave: 'sine', leadVol: .07,
    lead: [72, 0, 0, 79, 0, 0, 76, 0,  74, 0, 0, 0, 0, 0, 0, 0,
           69, 0, 0, 76, 0, 0, 74, 0,  72, 0, 0, 0, 0, 0, 0, 0,
           77, 0, 0, 76, 0, 0, 74, 0,  72, 0, 74, 0, 76, 0, 0, 0,
           74, 0, 0, 72, 0, 0, 67, 0,  72, 0, 0, 0, 0, 0, 0, 0],
    bass: [48, 48, 45, 45, 41, 41, 43, 43, 41, 41, 43, 43, 43, 43, 48, 48], bassEvery: 4,
  },
  // Нокиа: быстрая высокая пищалка, один голос, как у кнопочного телефона
  nokia: {
    bpm: 160, leadVol: .05,
    lead: [84, 0, 84, 88, 91, 0, 88, 0,  86, 0, 83, 0, 79, 0, 0, 0,
           81, 0, 81, 84, 88, 0, 86, 84, 83, 0, 79, 0, 83, 0, 0, 0,
           84, 0, 84, 88, 91, 0, 93, 91, 88, 0, 86, 0, 84, 0, 83, 81,
           79, 0, 83, 0, 86, 0, 83, 0,  84, 0, 0, 0, 0, 0, 0, 0],
    bass: null,
  },
  // Плакат: бодрый марш, бас «умпа-умпа»
  poster: {
    bpm: 116, leadWave: 'sawtooth', leadVol: .03,
    lead: [67, 0, 72, 0, 72, 74, 76, 0,  76, 0, 74, 72, 74, 0, 0, 0,
           69, 0, 74, 0, 74, 76, 77, 0,  77, 0, 76, 74, 76, 0, 0, 0,
           79, 0, 79, 77, 76, 0, 74, 0,  72, 0, 76, 0, 79, 0, 0, 0,
           77, 0, 76, 0, 74, 0, 71, 0,  72, 0, 0, 0, 0, 0, 0, 0],
    bass: [48, 55, 48, 55, 43, 50, 43, 50, 45, 52, 45, 52, 43, 50, 43, 50,
           41, 48, 41, 48, 43, 50, 43, 50, 48, 55, 43, 50, 48, 55, 48, 0], bassEvery: 2, bassLen: 1.6,
  },
  // Автомат: быстрый 8-бит с бегающим арпеджио в басу
  arcade: {
    bpm: 150, leadVol: .04,
    lead: [72, 0, 76, 79, 84, 0, 79, 76, 72, 0, 76, 79, 81, 0, 79, 0,
           69, 0, 72, 76, 81, 0, 76, 72, 69, 0, 72, 76, 79, 0, 76, 0,
           65, 0, 69, 72, 77, 0, 72, 69, 67, 0, 71, 74, 79, 0, 77, 74,
           72, 0, 76, 79, 84, 0, 0, 79, 76, 0, 74, 0, 72, 0, 0, 0],
    bass: [48, 55, 60, 55, 48, 55, 60, 55, 45, 52, 57, 52, 45, 52, 57, 52,
           41, 48, 53, 48, 41, 48, 53, 48, 43, 50, 55, 50, 43, 50, 55, 50],
    bassEvery: 2, bassWave: 'square', bassVol: .035, bassLen: 1.7,
  },
};
const tune = () => TUNES[currentSkin] || TUNES.classic;
const music = {
  timer: null, step: 0, next: 0,
  start() {
    if (this.timer || soundMode < 2) return;
    const ctx = audioCtx();
    if (!ctx) return;
    this.step = 0;
    this.next = ctx.currentTime + .1;
    this.timer = setInterval(() => this.schedule(), 100);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  // Другой стиль — мелодия с начала
  restart() { if (this.timer) { this.stop(); this.start(); } },
  // Планируем ноты чуть вперёд, чтобы мелодия не спотыкалась
  schedule() {
    const t = tune();
    const eighth = 30 / t.bpm;
    const every = t.bassEvery || 4;
    while (this.next < audio.currentTime + .3) {
      const at = this.next - audio.currentTime;
      const n = t.lead[this.step % t.lead.length];
      if (n) tone(NOTE(n), eighth * .9, t.leadWave || 'square', t.leadVol || .035, at, 0, true);
      const b = t.bass && this.step % every === 0 && t.bass[(this.step / every) % t.bass.length];
      if (b) tone(NOTE(b), eighth * every * (t.bassLen ? t.bassLen / 2 : .9), t.bassWave || 'triangle', t.bassVol || .08, at, 0, true);
      this.step++;
      this.next += eighth;
    }
  },
};

// Переключатель: 🔊 → 🔈 → 🔇 → 🔊
function toggleSound() {
  soundMode = (soundMode + 2) % 3;
  localStorage.setItem('kolorit-sound', JSON.stringify(soundMode));
  if (soundMode === 2) music.start(); else music.stop();
  sfx('tap');
}

// Вибрация и звук идут вместе: по рисунку вибрации понятно, что случилось
function buzz(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
  const key = Array.isArray(pattern) ? pattern.join(',') : pattern;
  const name = {
    '40,40,40': 'bad', '30,30,30': 'bad', '60,30,60': 'pop',
    8: 'tick', 10: 'tap', 15: 'tap', 20: 'tap', 25: 'tap', 30: 'hit', 40: 'alert', 60: 'go', 80: 'good',
  }[key];
  if (name) sfx(name);
}

function rand(a, b) { return a + Math.random() * (b - a); }

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// Итоги обоих игроков для экрана результата: [нижний, верхний]
// 1 пакет, 2 пакета, 5 пакетов
function plural(n, one, few, many) {
  const d = n % 10, h = n % 100;
  return `${n} ${d === 1 && h !== 11 ? one : d >= 2 && d <= 4 && (h < 12 || h > 14) ? few : many}`;
}

// По-английски: 1 bag, 2 bags
function bagsEn(n) { return `${n} bag${n === 1 ? '' : 's'}`; }

function pair(p, mine, theirs) { return p === 0 ? [mine, theirs] : [theirs, mine]; }

for (const half of halves) {
  half.addEventListener('pointerdown', e => {
    if (e.target.closest('input')) return;  // поле ввода имени должно получить фокус
    e.preventDefault();
    if (soundMode) audioCtx();
    if (e.target.closest('.quit')) { buzz(20); showMenu(); return; }
    const p = Number(half.dataset.p);
    pointers.set(e.pointerId, p);
    if (state.onTap) state.onTap(p, e.target);
  });
}

// Какой игрок держит какой палец — чтобы понять, чей палец отпустили (для игр с удержанием)
const pointers = new Map();
for (const type of ['pointerup', 'pointercancel']) {
  document.addEventListener(type, e => {
    const p = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    if (p !== undefined && state.onRelease) state.onRelease(p);
  });
}

const REMOTE = {
  emoji: '📺',
  title: t('Битва за пульт', 'Remote Wars'),

  play(done) {

    const LIMIT_MS = 12000;
    stage.innerHTML = '';

    let pos = 0;       // от -1 (у красного, сверху) до 1 (у синего, снизу)

    const draw = () => { remote.style.top = `${50 + pos * 36}%`; };
    const tick = () => sayEach(() => t(`<div class="big">ТЯНИ!!!</div><p>${left} с</p>`, `<div class="big">PULL!!!</div><p>${left} s</p>`));

      pos += p === 0 ? STEP : -STEP;

    sayEach(p => `<div class="gauge" id="g${p}"><div class="zone"></div><div class="mark"></div><div class="fill"></div></div>
      <p id="t${p}">${PHRASES[0]}</p>
      <div class="grab">${t('✋ Хватит!', '✋ Enough!')}</div>`);

    let v = 0;
    let speed = rand(20, 45);
    let last = performance.now();
    const stopped = [null, null];
    let over = false;

    const setGauge = (p, value) => {
      const g = document.getElementById('g' + p);
      g.querySelector('.fill').style.width = `${Math.min(value, MAX) / MAX * 100}%`;
      g.classList.toggle('over', value > 100);
    };

    // Бабушка то не спешит, то подкладывает от души
    const changeSpeed = () => { speed = pick([rand(12, 25), rand(25, 45), rand(45, 80)]); later(rand(250, 550), changeSpeed); };
    later(400, changeSpeed);
    const chatter = () => {
      for (const p of [0, 1]) if (stopped[p] === null) document.getElementById('t' + p).textContent = pick(PHRASES);
      later(1100, chatter);
    };
    later(1100, chatter);

    const result = () => {
      over = true;
      const score = stopped.map(s => (s === null || s > 100) ? -1 : s);
      let winner = null;
      if (score[0] !== score[1]) winner = score[0] > score[1] ? 0 : 1;
      if (score[0] < 0 && score[1] < 0) winner = null;
      if (winner !== null) noteRecord(winner, Math.round(stopped[winner]));
      stopAll();
      flashResult(winner);
      for (const p of [0, 1]) {
        const s = stopped[p];
        const verdict = s === null || s > 100 ? t('Объелся 🤢', 'Stuffed 🤢') : winner === p ? t('Бабушка гордится! 🥰', 'Grandma is proud! 🥰') : t('Маловато… 😒', 'Too little… 😒');
        say(`<h2>${verdict}</h2><p>${s === null ? t('Так и не сказал «Хватит!»', 'Never said “Enough!”') : t(`Тарелка на ${Math.round(s)}%`, `Plate ${Math.round(s)}% full`)}</p>`, p);
      }
      const text = winner === null
        ? (score[0] < 0 ? t('Оба объелись — ничья', 'Both stuffed — draw') : t('Одинаково — ничья', 'Dead even — draw'))
        : t(`${NAMES[winner]} остановился на ${Math.round(stopped[winner])}%`, `${NAMES[winner]} stopped at ${Math.round(stopped[winner])}%`);
      const stats = stopped.map(v => v === null ? t('не остановил', 'never stopped') : v > 100 ? t('объелся 🤢', 'stuffed 🤢') : `${Math.round(v)}%`);
      later(2000, () => done(winner, text, stats));
    };

    const loop = now => {
      if (over) return;
      v += speed * (now - last) / 1000;
      last = now;
      for (const p of [0, 1]) setGauge(p, stopped[p] ?? v);
      if (v >= MAX) { result(); return; }
      state.frame = requestAnimationFrame(loop);
    };
    state.frame = requestAnimationFrame(loop);

    state.onTap = (p, el) => {
      if (!el.closest('.grab') || stopped[p] !== null) return;
      stopped[p] = v;
      $p(p, '.grab').classList.add('done');
      buzz(40);
      document.getElementById('t' + p).textContent = v > 100 ? t('Поздно, уже объелся 🤢', 'Too late, already stuffed 🤢') : t(`Хватит! Стоп на ${Math.round(v)}%`, `Enough! Stopped at ${Math.round(v)}%`);
      if (stopped[0] !== null && stopped[1] !== null) result();
    };
  },
};

const MOM = {
  emoji: '😴',
  title: t('Ещё 5 минут', '5 More Minutes'),
  rule: t('Держи свою кнопку — спишь и копишь минуты.<br>Отпусти, пока мама не ворвалась.<br>Попался под одеялом — проиграл.',
    'Hold your button to sleep and bank minutes.<br>Let go before Mom bursts in.<br>Caught under the blanket — you lose.'),
  // Держишь кнопку — спишь. Мама кричит из коридора (иногда блефует), перед входом скрипит дверь.
  // Кто под одеялом, когда она вошла, — попался. Из вставших побеждает тот, кто поспал дольше.
  play(done) {
    const RATE = 5;  // минут сна за секунду удержания
    const WARNINGS = t(['Вставай, в школу проспишь!', 'Последний раз говорю!', 'Я считаю до трёх!', 'Раз… два…', 'Я иду!!!'],
      ['Up! You’ll be late for school!', 'I’m not saying it again!', 'I’m counting to three!', 'One… two…', 'I’m coming in!!!']);
    const entry = rand(5000, 11000);
    const mins = [0, 0];
    const st = ['awake', 'awake'];  // awake — ещё не лёг, sleep — спит, up — встал
    let over = false;
    let last = performance.now();

    stage.innerHTML = '<div class="logo">🛏️</div>';
    say(grabUI(t('🛏️ Держи, чтобы спать', '🛏️ Hold to sleep')));
    setStatus(t('<h2>Утро, 7:00 ⏰</h2><p>Зажми кнопку и спи</p>', '<h2>7:00 AM ⏰</h2><p>Hold the button and sleep</p>'));

    const btn = p => $p(p, '.grab');
    const label = p => {
      if (st[p] === 'sleep') btn(p).textContent = t(`😴 Спишь… ${Math.floor(mins[p])} мин`, `😴 Sleeping… ${Math.floor(mins[p])} min`);
      if (st[p] === 'up') btn(p).textContent = t(`🧍 Встал · ${Math.floor(mins[p])} мин`, `🧍 Up · ${Math.floor(mins[p])} min`);
    };

    const loop = now => {
      if (over) return;
      const dt = (now - last) / 1000;
      last = now;
      for (const p of [0, 1]) if (st[p] === 'sleep') { mins[p] += RATE * dt; label(p); }
      state.frame = requestAnimationFrame(loop);
    };
    state.frame = requestAnimationFrame(loop);

    // Мамины крики из коридора: 2–4 штуки, по нарастающей
    const count = 2 + Math.floor(Math.random() * 3);
    const times = [...Array(count)].map(() => rand(800, entry - 900)).sort((a, b) => a - b);
    const lines = [...WARNINGS].sort(() => Math.random() - .5).slice(0, count)
      .sort((a, b) => WARNINGS.indexOf(a) - WARNINGS.indexOf(b));
    times.forEach((when, i) => later(when, () => setStatus(t(`<h2>👩 «${lines[i]}»</h2>`, `<h2>👩 “${lines[i]}”</h2>`))));

    // Иногда дверь скрипит зря
    const creak = () => { stage.innerHTML = '<div class="logo">🚪</div>'; setStatus(t('<h2>🚪 Скрип…</h2>', '<h2>🚪 Creeeak…</h2>')); buzz(30); };
    if (Math.random() < .5 && entry > 4000) {
      const when = rand(1500, entry - 1800);
      later(when, creak);
      later(when + 600, () => { stage.innerHTML = '<div class="logo">🛏️</div>'; setStatus(t('<h2>…показалось</h2>', '<h2>…false alarm</h2>')); });
    }
    later(entry - 600, creak);

    const burst = () => {
      if (over) return;
      over = true;
      stopAll();
      stage.innerHTML = '<div class="logo">🩴</div>';
      const caught = st.map(s => s === 'sleep');
      const score = [0, 1].map(p => caught[p] ? -1 : Math.floor(mins[p]));
      const winner = score[0] === score[1] ? null : (score[0] > score[1] ? 0 : 1);
      if (winner !== null && score[winner] > 0) noteRecord(winner, score[winner]);
      flashResult(winner);
      buzz([80, 40, 80]);
      for (const p of [0, 1]) {
        const m = Math.floor(mins[p]);
        const verdict = caught[p] ? t('Попался! 🩴', 'Busted! 🩴')
          : st[p] === 'awake' ? t('Даже не ложился 🤨', 'Never even lay down 🤨')
          : winner === p ? t('Выспался и не попался 😎', 'Slept in, not caught 😎')
          : t('Встал слишком рано 🥱', 'Got up too early 🥱');
        say(t(`<h2>👩 «ВСТАВАЙ!!!»</h2><h2>${verdict}</h2><p>Поспал ${m} мин</p>`, `<h2>👩 “GET UP!!!”</h2><h2>${verdict}</h2><p>Slept ${m} min</p>`), p);
      }
      const text = winner === null
        ? (caught[0] && caught[1] ? t('Мама поймала обоих', 'Mom caught you both') : t('Поспали поровну — ничья', 'Same amount of sleep — draw'))
        : t(`${NAMES[winner]} поспал ${score[winner]} мин и не попался`, `${NAMES[winner]} slept ${score[winner]} min and didn’t get caught`);
      const stats = [0, 1].map(p => caught[p] ? t('попался 🩴', 'busted 🩴') : t(`${score[p]} мин сна`, `${score[p]} min of sleep`));
      later(2200, () => done(winner, text, stats));
    };
    later(entry, burst);

    state.onTap = (p, el) => {
      if (!el.closest('.grab') || st[p] !== 'awake') return;
      st[p] = 'sleep';
      btn(p).classList.add('held');
      label(p);
      buzz(15);
    };
    state.onRelease = p => {
      if (st[p] !== 'sleep') return;
      st[p] = 'up';
      btn(p).classList.remove('held');
      btn(p).classList.add('done');
      label(p);
      buzz(25);
      // Оба встали — мама заходит пораньше
      if (st.every(s => s === 'up')) later(700, burst);
    };
  },
};

const PICKLE = {
  emoji: '🥒',

  rule: t('Бегунок ездит туда-сюда. Жми «🫙 Закатать», когда он в зелёной зоне.<br>Кто больше банок закатал за 15 секунд — победил. Мимо — банка лопнула.',
    'The slider runs back and forth. Hit “🫙 Seal” while it’s in the green.<br>Most jars sealed in 15 seconds wins. Miss — the jar pops.'),
  // У каждого свой бегунок; с каждой банкой он ускоряется.
  play(done) {
    const LIMIT_S = 15;
    const ZONE = 8;  // половина ширины зелёной зоны, в процентах
    const jars = [0, 0];
    const broke = [0, 0];
    const phase = [rand(0, 6), rand(0, 6)];

      }
      const text = winner === null ? t('Поровну — ничья', 'Even — draw')
        : t(`${NAMES[winner]}: ${plural(jars[winner], 'банка', 'банки', 'банок')}, лопнуло ${broke[winner]} — лучше соперника`,
          `${NAMES[winner]}: ${jars[winner]} jar${jars[winner] === 1 ? '' : 's'}, ${broke[winner]} popped — beat the rival`);
      const stats = [0, 1].map(p => `🫙 ${jars[p]} · 💥 ${broke[p]}`);
      later(2000, () => done(winner, text, stats));
    };
    later(1000, tick);

    state.onTap = (p, el) => {
      if (!el.closest('.grab')) return;
      const now = performance.now();
      if (now < cooldown[p]) return;
      cooldown[p] = now + 250;
      const hit = Math.abs(pos(p) - 50) <= ZONE;
      if (hit) { jars[p]++; buzz(20); } else { broke[p]++; buzz([30, 30, 30]); }
      flash(p, hit ? 'win' : 'lose');
      phase[p] += rand(1, 2.5);  // после банки бегунок сбивается, чтобы не ловить в одном месте
      drawStatus(p);
    };
  },
};

const BAGS = {
  emoji: '🛍️',
  title: t('Пакет с пакетами', 'Bag of Bags'),
  rule: t('Тапай «🛍️ Пихать», чтобы набить пакет пакетами. Жми «✅ Хватит», пока он не порвался.<br>У кого больше — победил. Порвался — ноль.',
    'Tap “🛍️ Stuff” to cram bags into the bag. Hit “✅ Done” before it rips.<br>Most bags wins. Ripped — zero.'),
  // Пакет одинаковый у обоих: рвётся на одном и том же, заранее неизвестном числе. Перед разрывом трещит.
  play(done) {
    const LIMIT_MS = 12000;
    const tear = 12 + Math.floor(Math.random() * 18);
    const count = [0, 0];
    const st = ['open', 'open'];  // open — набивает, done — остановился, torn — порвался

    stage.innerHTML = '<div class="logo">🛍️</div>';
    sayEach(() => `<div class="status"></div>
      <div class="row"><div class="grab" data-b="push">${t('🛍️ Пихать', '🛍️ Stuff')}</div><div class="grab" data-b="stop">${t('✅ Хватит', '✅ Done')}</div></div>`);

    const drawStatus = p => {
      const n = count[p];
      const hint = st[p] === 'torn' ? t('Порвался! 💥', 'Ripped! 💥')
        : st[p] === 'done' ? t('Остановился 👍', 'Stopped 👍')
        : n >= tear - 2 ? t('Хрусть… 😬', 'Crrrack… 😬') : n >= tear - 5 ? t('Натянулся…', 'Getting tight…') : t('Влезает 👌', 'Still fits 👌');
      setStatus(`<h2>${t('Пакетов', 'Bags')}: ${n}</h2><p>${hint}</p>`, p);
    };
    [0, 1].forEach(drawStatus);

    const result = () => {
      stopAll();
      const s = [0, 1].map(p => st[p] === 'torn' ? 0 : count[p]);
      const winner = s[0] === s[1] ? null : (s[0] > s[1] ? 0 : 1);
      if (winner !== null) noteRecord(winner, s[winner]);
      flashResult(winner);
      for (const p of [0, 1]) {
        say(`<h2>${st[p] === 'torn' ? t('Порвался 💥', 'Ripped 💥') : winner === p ? t('Пакет мечты! 🛍️', 'Dream bag! 🛍️') : winner === null ? t('Поровну 🤝', 'Tie 🤝') : t('Маловато 😕', 'Too few 😕')}</h2>
          <p>${st[p] === 'torn' ? t(`Рвётся на ${tear + 1}-м`, `It rips at bag #${tear + 1}`) : t(`В пакете ${plural(count[p], 'пакет', 'пакета', 'пакетов')}`, `${bagsEn(count[p])} inside`)}</p>`, p);
      }
      const text = winner === null ? t('Поровну — ничья', 'Even — draw') : t(`${NAMES[winner]} набил ${plural(s[winner], 'пакет', 'пакета', 'пакетов')}`, `${NAMES[winner]} stuffed in ${bagsEn(s[winner])}`);
      const stats = [0, 1].map(p => st[p] === 'torn' ? t('порвал 💥', 'ripped 💥') : t(plural(count[p], 'пакет', 'пакета', 'пакетов'), bagsEn(count[p])));
      later(2000, () => done(winner, text, stats));
    };
    later(LIMIT_MS, result);

    state.onTap = (p, el) => {
      const b = el.closest('.grab')?.dataset.b;
      if (!b || st[p] !== 'open') return;
      if (b === 'stop') {
        st[p] = 'done';
        buzz(30);
      } else {
        count[p]++;
        buzz(8);
        if (count[p] > tear) { st[p] = 'torn'; buzz([60, 30, 60]); flash(p, 'lose'); }
      }
      halves[p].querySelectorAll('.grab').forEach(g => g.classList.toggle('done', st[p] !== 'open'));
      drawStatus(p);
      if (st.every(s => s !== 'open')) later(600, result);
    };
  },
};

const DRILL = {
  emoji: '🔨',
  title: t('Сосед с перфоратором', 'The Neighbor’s Drill'),
  rule: t('В одном из окон сверлят. Первым ткни в это окно — постучи по батарее!<br>Мимо — минус очко. Кто первым наберёт 5.',
    'Someone’s drilling behind one window. Tap it first — bang on the radiator!<br>Miss — minus a point. First to 5 wins.'),
  // «Бей крота»: у каждого своя сетка окон, сверлят в окне с одним и тем же номером.
  play(done) {
    const GOAL = 5;
    const LIMIT_MS = 25000;
    const WINDOWS = 6;
    const hits = [0, 0];
    const startAt = performance.now();
    const lockUntil = [0, 0];
    let target = -1;

    document.body.classList.add('no-stage');
    stage.innerHTML = '';
    sayEach(() => `<div class="status"></div>
      <div class="wins">${[...Array(WINDOWS)].map((_, i) => `<div class="win" data-w="${i}">🪟</div>`).join('')}</div>`);

    const drawStatus = p => setStatus(`<h2>🔨 ${hits[p]} ${t('из', 'of')} ${GOAL}</h2>`, p);
    [0, 1].forEach(drawStatus);

    const moveDrill = () => {
      let next;
      do { next = Math.floor(Math.random() * WINDOWS); } while (next === target);
      target = next;
      document.querySelectorAll('.win').forEach(w => {
        const on = Number(w.dataset.w) === target;
        w.classList.toggle('drill', on);
        w.textContent = on ? '🔨' : '🪟';
      });
    };
    const pause = () => {
      target = -1;
      document.querySelectorAll('.win').forEach(w => { w.classList.remove('drill'); w.textContent = '🪟'; });
      later(rand(300, 700), moveDrill);
    };
    later(300, moveDrill);

    const finish = winner => {
      stopAll();
      flashResult(winner);
      for (const p of [0, 1]) {
        say(`<h2>${winner === null ? t('Ничья 🤝', 'Draw 🤝') : winner === p ? t('Сосед затих! 🤫', 'Peace and quiet! 🤫') : t('Сверлят дальше 😵‍💫', 'Still drilling 😵‍💫')}</h2><p>${t('Попаданий', 'Hits')}: ${hits[p]}</p>`, p);
      }
      const text = winner === null ? t(`Поровну по ${hits[0]} — ничья`, `${hits[0]} each — draw`)
        : t(`${NAMES[winner]} достучался: ${hits[winner]} против ${hits[1 - winner]}`, `${NAMES[winner]} got through: ${hits[winner]} to ${hits[1 - winner]}`);
      later(1800, () => done(winner, text, [0, 1].map(p => `🔨 ${hits[p]}`)));
    };
    later(LIMIT_MS, () => finish(hits[0] === hits[1] ? null : (hits[0] > hits[1] ? 0 : 1)));

    state.onTap = (p, el) => {
      const w = el.closest('.win');
      if (!w || performance.now() < lockUntil[p]) return;
      if (Number(w.dataset.w) === target) {
        hits[p]++;
        buzz(30);
        flash(p, 'win');
        drawStatus(p);
        if (hits[p] >= GOAL) {
          noteRecord(p, +((performance.now() - startAt) / 1000).toFixed(1));
          finish(p);
          return;
        }
        pause();
      } else {
        hits[p] = Math.max(0, hits[p] - 1);
        lockUntil[p] = performance.now() + 400;
        buzz([30, 30, 30]);
        flash(p, 'lose');
        drawStatus(p);
      }
    };
  },
};

    if (!where) return;
    if (where === 'sound') { toggleSound(); showStart(); return; }
    // Другой язык: запоминаем и перезагружаем — все надписи соберутся заново
    if (where === 'lang') { buzz(20); save('kolorit-lang', t('en', 'ru')); location.reload(); return; }
    buzz(20);
    if (where === 'local') showMenu();
    else if (where === 'rules') showRules();
    else if (where === 'records') showRecords();
    else if (where === 'names') showNames();
    else if (where === 'skins') showSkins();
    else showOnlineSoon();
  };
}

// Выбор оформления: тап по скину сразу его включает, чтобы было видно, как выглядит
// Закрытый стиль открывается рекламой за награду; note — строка под заголовком
function showSkins(note = '') {
  enterMenu();
  document.body.classList.add('rules-open');
  stage.innerHTML = '';
  const hint = SKINS.some(s => isLocked(s.id)) ? `<p>${t('🔒 Стиль открывается за просмотр рекламы — навсегда', '🔒 Watch an ad to unlock a style forever')}</p>` : '';
  say(`<h2>${t('🎨 Стиль', '🎨 Style')}</h2>${note ? `<p>${note}</p>` : hint}
    <div class="modes grid skins">${SKINS.map(s =>
      `<div class="mode ${isLocked(s.id) ? 'locked' : ''}" data-skin="${s.id}"><span class="e">${s.emoji}</span><span><b>${s.id === currentSkin ? '✓ ' : isLocked(s.id) ? '🔒 ' : ''}${s.title}</b><small>${isLocked(s.id) ? t('📺 Реклама — и стиль твой', '📺 Watch an ad to unlock') : s.sub}</small></span></div>`
    ).join('')}</div>
    <div><span class="btn" data-act="back">${BACK}</span></div>`);
  state.onTap = (p, el) => {
    if (el.closest('[data-act=back]')) { showStart(); return; }
    const btn = el.closest('[data-skin]');
    if (!btn) return;
    buzz(20);
    const id = btn.dataset.skin;
    if (isLocked(id)) {
      state.onTap = null;
      ADS.reward().then(ok => {
        if (!ok) { showSkins(t('Реклама не досмотрена — стиль пока закрыт', 'Ad not finished — style is still locked')); return; }
        unlocked.add(id);
        save('kolorit-unlocked', [...unlocked]);
        currentSkin = applySkin(id);
        sfx('fanfare');
        showSkins(t('🎉 Стиль открыт навсегда!', '🎉 Style unlocked forever!'));
      });
      return;
    }
    currentSkin = applySkin(id);
    music.restart();
    showSkins();
  };
}

function showRecords() {
  enterMenu();
  document.body.classList.add('rules-open');
  stage.innerHTML = '';
  const all = load('kolorit-records', {});
  say(`<h2>${t('🏆 Рекорды', '🏆 Records')}</h2>
    <div class="rules">${MODES.filter(m => m.rec).map(m => {
      const r = all[m.id];
      return `<p>${modeEmoji(m)} ${m.rec.label}: <b>${r ? recText(m.rec, r.value) : '—'}</b>${r ? ` · ${r.name}` : ''}</p>`;
    }).join('')}</div>
    <div><span class="btn" data-act="back">${BACK}</span></div>`);
  state.onTap = (p, el) => {
    if (el.closest('[data-act=back]')) showStart();
  };
}

// Каждый пишет своё имя на своей половине
function showNames() {
  enterMenu();
  document.body.classList.add('rules-open');
  stage.innerHTML = '';
  sayEach(p => `<h2>${t('Как тебя зовут?', 'What’s your name?')}</h2>
    <input class="name-input" maxlength="12" value="${NAMES[p]}" aria-label="${t('Имя игрока', 'Player name')}">
    <div><span class="btn" data-act="save">${t('✅ Готово', '✅ Done')}</span></div>`);
  state.onTap = (p, el) => {
    if (!el.closest('[data-act=save]')) return;
    for (const i of [0, 1]) {
      const v = $p(i, '.name-input').value.replace(/[<>&"]/g, '').trim();
      NAMES[i] = v || DEFAULT_NAMES[i];
    }
    if (NAMES[0] === NAMES[1]) NAMES[1] += ' 2';
    save('kolorit-names', NAMES);
    document.activeElement?.blur();
    buzz(20);
    showStart();
  };
}

function showRules() {
  enterMenu();
  document.body.classList.add('rules-open');
  stage.innerHTML = '';
  say(t(`<h2>Как играть</h2>
    <div class="rules">
      <p>📱 Телефон между вами: синий снизу, красный сверху. Тапай по своей половине, ✕ — в меню.</p>
      <p>🎮 ${GAMES.length} мини-игр. Выбрали одну — играете в неё до ${WINS_TO} побед. 🎲 Турнир — все игры по разу.</p>
      <p>📖 Правило игры показывается перед каждым раундом — успейте прочитать до «3, 2, 1».</p>
      <p>🔘 Если на твоей половине есть кнопки — засчитываются только они, а не тапы мимо.</p>
      <p>▶ Между раундами игра ждёт, пока оба нажмут «Следующий раунд».</p>
    </div>`, `<h2>How to play</h2>
    <div class="rules">
      <p>📱 Phone between you: blue at the bottom, red on top. Tap your own half, ✕ goes to the menu.</p>
      <p>🎮 ${GAMES.length} mini-games. Pick one and play it to ${WINS_TO} wins. 🎲 Tournament: every game once.</p>
      <p>📖 The rule shows before every round — read it before “3, 2, 1”.</p>
      <p>🔘 If your half has buttons, only taps on them count, not taps around them.</p>
      <p>▶ Between rounds the game waits until you both tap “Next round”.</p>
    </div>`) + `
    <div><span class="btn" data-act="back">${BACK}</span></div>`);
  state.onTap = (p, el) => {
    if (el.closest('[data-act=back]')) showStart();
  };
}

function showOnlineSoon() {
  enterMenu();
  say(`${t(`<h2>🌐 По сети — скоро</h2>
    <p>Чтобы два телефона играли вместе, нужен сервер, который передаёт тапы между ними. Включим, когда игра будет в интернете.</p>`,
    `<h2>🌐 Online — coming soon</h2>
    <p>For two phones to play together, we need a server that passes taps between them. We’ll switch it on once the game is online.</p>`)}
    <div><span class="btn" data-act="back">${BACK}</span></div>`);
  state.onTap = (p, el) => {
    if (el.closest('[data-act=back]')) showStart();
  };
}

// Выбор мини-игры: по 4 на страницу, листаем ◀ ▶
const PER_PAGE = 4;
let menuPage = 0;

function showMenu() {
  enterMenu();
  const pages = Math.ceil(MODES.length / PER_PAGE);
  menuPage = Math.min(menuPage, pages - 1);
  const list = MODES.slice(menuPage * PER_PAGE, (menuPage + 1) * PER_PAGE);
  say(`<h2>${t('Во что рубимся?', 'Pick your battle')}</h2>
    <div class="modes grid">${list.map(m =>
      `<div class="mode" data-mode="${m.id}"><span class="e">${modeEmoji(m)}</span><span><b>${modeTitle(m)}</b><small>${m.sub}</small></span></div>`
    ).join('')}</div>
    <div class="pager">
      <span class="btn" data-act="back">←</span>
      <span class="btn" data-act="prev">◀</span>
      <span class="page">${menuPage + 1} / ${pages}</span>
      <span class="btn" data-act="more">▶</span>
    </div>`);
  state.onTap = (p, el) => {
    const act = el.closest('[data-act]')?.dataset.act;
    if (act === 'back') { showStart(); return; }
    if (act === 'prev' || act === 'more') {
      buzz(10);
      menuPage = (menuPage + (act === 'more' ? 1 : pages - 1)) % pages;
      showMenu();
      return;
    }
    const btn = el.closest('[data-mode]');
    if (!btn) return;
    buzz(20);
    startMode(MODES.find(m => m.id === btn.dataset.mode));
  };
}

function startMode(mode) {
  stopAll();
  state.mode = mode;
  state.wins = [0, 0];
  state.round = 0;
  state.queue = mode.tour ? [...GAMES].sort(() => Math.random() - .5) : [];
  document.body.classList.remove('menu');
  updateHud();
  nextRound();
}

function matchOver() {
  return state.mode.tour ? state.round >= state.queue.length : Math.max(...state.wins) >= WINS_TO;
}

function nextRound() {
  state.round++;
  const prev = state.game;
  const game = state.mode.tour ? state.queue[state.round - 1] : state.mode.game;
  state.game = game;
  state.newRec = [null, null];
  arena.innerHTML = '';
  // Новая для этого матча игра — сначала показываем, как играть, и ждём «Начать» от обоих
  if (state.round === 1 || game !== prev) showIntro(game, () => countdown(game, 1200));
  else countdown(game, 2400);
}

function progressText(p) {
  const progress = state.mode.tour
    ? t(`Игра ${state.round} из ${state.queue.length}`, `Game ${state.round} of ${state.queue.length}`)
    : t(`Раунд ${state.round} · до ${WINS_TO} побед`, `Round ${state.round} · first to ${WINS_TO} wins`);
  return `${progress} · ${t('счёт', 'score')} ${state.wins[p]}:${state.wins[1 - p]}`;
}

// «3, 2, 1» в центре, правило перед глазами, потом игра
function countdown(game, wait) {
  music.stop();
  ADS.playing(true);
  document.body.classList.remove('no-stage', 'intro');
  stage.innerHTML = `<div class="logo">${game.emoji}</div>`;
  sayEach(p => `<p>${progressText(p)}</p><h2>${game.title}</h2><p>${game.rule}</p>`);
  let n = 3;
  const tick = () => {
    if (n === 0) { sfx('start'); game.play(roundOver); return; }
    sfx('beep');
    stage.innerHTML = `<div class="logo">${n}</div>`;
    n--;
    later(800, tick);
  };
  later(wait, tick);
}

// Экран «как играть»: анимация, правило и кнопка «Начать» у каждого игрока
function showIntro(game, start) {
  document.body.classList.add('no-stage', 'intro');
  stage.innerHTML = '';
  const ready = [false, false];
  const button = p => `<span class="btn ${ready[p] ? 'on' : ''}" data-act="go">${ready[p] ? WAITING : t('▶ Начать', '▶ Start')}</span>`;
  // Номер игры показываем только в турнире: в обычном матче это всегда первый раунд
  const head = p => state.mode.tour ? `<p class="demo-progress">${progressText(p)}</p>` : '';
  sayEach(p => `${head(p)}<h2>${game.emoji} ${game.title}</h2>
    <div class="demo"><div class="demo-pic"></div><div class="demo-bar"><b></b><i></i><s></s></div>
      <div class="grab demo-btn"></div><div class="demo-cap"></div></div>
    <p class="demo-rule">${game.rule}</p><div class="go">${button(0)}</div>`);
  playDemo(game.demo);
  // Задержка, чтобы тап по «Следующему раунду» не нажал заодно «Начать»
  const shownAt = performance.now();
  state.onTap = (p, el) => {
    if (performance.now() - shownAt < 700) return;
    if (!el.closest('[data-act=go]') || ready[p]) return;
    ready[p] = true;
    buzz(20);
    $p(p, '.go').innerHTML = button(p);
    if (ready[0] && ready[1]) { stopAll(); start(); }
  };
}

function playDemo(frames) {
  let i = 0;
  const show = () => {
    const f = frames[i++ % frames.length];
    for (const p of [0, 1]) {
      const demo = $p(p, '.demo');
      if (!demo) return;
      const finger = !f.act ? '' : f.act === 'pic' || !f.btn ? 'finger-pic' : 'finger-btn';
      demo.className = `demo ${f.act ? 'act-' + f.act : ''} ${finger}`;
      demo.querySelector('.demo-pic').textContent = f.pic;
      demo.querySelector('.demo-cap').textContent = f.cap;
      const btn = demo.querySelector('.demo-btn');
      btn.textContent = f.btn || '';
      btn.classList.toggle('hot', !!f.hot);
      btn.classList.toggle('held', f.act === 'hold');
      btn.style.visibility = f.btn ? '' : 'hidden';
      const bar = demo.querySelector('.demo-bar');
      bar.style.display = f.bar ? '' : 'none';
      if (f.bar) {
        bar.querySelector('b').style.cssText = `left: ${f.bar.zone[0]}%; width: ${f.bar.zone[1]}%`;
        bar.querySelector('i').style.width = `${f.bar.fill ?? 0}%`;
        bar.querySelector('s').style.cssText = f.bar.dot === undefined ? 'display: none' : `left: ${f.bar.dot}%`;
      }
    }
    later(1500, show);
  };
  show();
}

function roundOver(winner, text, stats) {
  if (winner !== null) state.wins[winner]++;
  updateHud();
  arena.innerHTML = '';
  document.body.classList.remove('no-stage');
  stage.innerHTML = `<div class="logo">${winner === null ? '🤷' : '⭐'}</div>`;
  sfx(winner === null ? 'draw' : 'round');
  // Крупно — кто выиграл, ниже — что набрал каждый: сначала ты, потом соперник
  const result = p => {
    const kind = winner === null ? 'v-draw' : winner === p ? 'v-win' : 'v-lose';
    const verdict = t({ 'v-win': 'ПОБЕДА 🏆', 'v-lose': 'ПРОИГРЫШ 😵', 'v-draw': 'НИЧЬЯ 🤝' },
      { 'v-win': 'VICTORY 🏆', 'v-lose': 'DEFEAT 😵', 'v-draw': 'DRAW 🤝' })[kind];
    const note = winner === null ? `<p>${state.mode.tour ? t('Очко никому', 'No point for anyone') : t('Переигрываем', 'Play it again')}</p>` : '';
    const line = q => `<div class="${q === p ? 'me' : ''} ${q === winner ? 'won' : ''}">` +
      `<b>${q === p ? t('Ты', 'You') : NAMES[q]}</b><span>${stats[q]}</span></div>`;
    const board = stats ? `<div class="res">${line(p)}${line(1 - p)}</div>` : `<p>${text}</p>`;
    const rec = state.newRec[p] ? `<p>🏆 ${t('Новый рекорд', 'New record')}: ${state.newRec[p]}!</p>` : '';
    return `<h1 class="verdict ${kind}">${verdict}</h1>${note}${board}${rec}<p>${t('Счёт', 'Score')} ${state.wins[p]}:${state.wins[1 - p]}</p>`;
  };
  if (matchOver()) {
    sayEach(result);
    later(2200, showFinal);
    return;
  }
  // Следующий раунд — только когда оба нажали «Дальше»
  const ready = [false, false];
  const draw = () => sayEach(p => result(p) +
    `<div><span class="btn ${ready[p] ? 'on' : ''}" data-act="next">${ready[p] ? WAITING : t('Следующий раунд ▶', 'Next round ▶')}</span></div>`);
  draw();
  // Небольшая задержка, чтобы разогнавшийся в «Пульте» палец не нажал «Дальше» случайно
  const shownAt = performance.now();
  state.onTap = (p, el) => {
    if (performance.now() - shownAt < 700) return;
    if (!el.closest('[data-act=next]') || ready[p]) return;
    ready[p] = true;
    buzz(20);
    draw();
    if (ready[0] && ready[1]) { state.onTap = null; later(300, nextRound); }
  };
}

function showFinal() {
  const [a, b] = state.wins;
  const winner = a === b ? null : (a > b ? 0 : 1);
  const [winText, loseText] = state.mode.final;
  stage.innerHTML = `<div class="logo">${winner === null ? '🤝' : '🏆'}</div>`;
  ADS.playing(false);
  flashResult(winner);
  buzz([100, 60, 100]);
  sfx('fanfare');
  sayEach(p => {
    const head = winner === null
      ? t(`<h1>Ничья ${a}:${b} 🤝</h1><p>Силы равны — реванш?</p>`, `<h1>Draw ${a}:${b} 🤝</h1><p>Evenly matched — rematch?</p>`)
      : winner === p
      ? `<h1>${t('Победа', 'Victory')} ${state.wins[p]}:${state.wins[1 - p]} 🏆</h1><p>${winText}</p>`
      : `<h1>${t('Проиграл', 'Lost')} ${state.wins[p]}:${state.wins[1 - p]}</h1><p>${loseText}</p>`;
    return head + t('<div><span class="btn" data-act="again">🔁 Реванш</span><span class="btn" data-act="menu">🏠 Меню</span></div>',
      '<div><span class="btn" data-act="again">🔁 Rematch</span><span class="btn" data-act="menu">🏠 Menu</span></div>');
  });
  state.onTap = (p, el) => {
    const act = el.closest('[data-act]')?.dataset.act;
    if (act !== 'again' && act !== 'menu') return;
    // Матч сыгран — естественная пауза для рекламы
    state.onTap = null;
    ADS.between().then(() => act === 'again' ? startMode(state.mode) : showMenu());
  };
}

showStart();

// Свернули игру — звук молчит, вернулись — звучит снова (площадки это проверяют)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) audio?.suspend();
  else if (soundMode && !ADS.busy) audio?.resume();
});

// Запоминаем игру в телефоне для работы без интернета (только на своём сайте, не из файла
// и не на площадках — там за файлы отвечает сама площадка)
if ('serviceWorker' in navigator && location.protocol === 'https:' && ADS.kind !== 'yandex' && ADS.kind !== 'vk') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* без офлайна тоже играем */ });
}
</script>
</body>
</html>
